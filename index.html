
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f1edf9">
<title>KTrep — Korean Travel Expressions</title>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Avenir Next","Segoe UI",sans-serif;color:#58647b;background:linear-gradient(135deg,#f1edf9,#eaf2f8 48%,#f9edf1);background-attachment:fixed}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{width:min(100% - 28px,760px);margin:auto;padding:25px 0 40px}
.header{display:flex;justify-content:space-between;align-items:center;padding:5px 4px 22px}
.logo{font-family:Georgia,serif;font-size:27px;letter-spacing:-1px;color:#586784;font-weight:700}
.header-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ffffff99;border:1px solid white;box-shadow:0 7px 20px #64739622;color:#a18cb9}
.main{border-radius:28px;padding:22px;min-height:540px;background:#ffffff88;border:1px solid #ffffffd9;backdrop-filter:blur(20px);box-shadow:0 20px 55px #68749629,inset 0 1px 0 white}
.heading{font-family:Georgia,serif;font-size:27px;font-weight:500;margin:4px 0 7px;color:#596a88}
.subheading{margin:0 0 20px;color:#9997ab;font-size:12px}
.section-title{font-size:15px;color:#71809d;margin:22px 0 10px;font-weight:700}
.language-wrap{margin:0 0 18px}
.language-label{display:block;font-size:12px;color:#8992aa;margin-bottom:7px;font-weight:650}
.language-select{width:100%;padding:12px 14px;border:1px solid white;border-radius:14px;background:#ffffffb8;color:#64748e;box-shadow:0 7px 18px #6473961c;outline:none}
.place-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.place-card{position:relative;height:140px;border:1px solid white;border-radius:19px;overflow:hidden;padding:0;background:#e8eaf3;box-shadow:0 10px 25px #6473962b;display:block;width:100%;isolation:isolate}
.place-card img{width:100%;height:100%;object-fit:cover;display:block;opacity:.88;pointer-events:none}
.place-overlay{position:absolute;inset:0;background:linear-gradient(transparent 35%,#2631418c);pointer-events:none}
.place-name{position:absolute;left:15px;bottom:14px;color:white;font-size:16px;font-weight:700;text-shadow:0 2px 8px #0004;pointer-events:none}
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:15px}
.feature-card{border:1px solid white;border-radius:17px;padding:15px;background:#ffffffa6;text-align:left;box-shadow:0 8px 20px #6473961c;color:#657590;width:100%;display:block}
.feature-icon{font-size:24px;display:block;margin-bottom:8px;pointer-events:none}
.feature-name{font-size:14px;font-weight:700;display:block;pointer-events:none}
.feature-desc{font-size:11px;color:#9997ab;display:block;margin-top:5px;line-height:1.4;pointer-events:none}
.back-button{border:0;background:transparent;color:#8d91ad;padding:4px 0 17px;font-size:13px}
.scenario-list,.item-list{display:flex;flex-direction:column;gap:11px}
.scenario-card,.item-card{display:flex;align-items:center;gap:14px;width:100%;padding:15px;border-radius:17px;border:1px solid white;background:#ffffffa6;box-shadow:0 9px 23px #69769620;text-align:left;color:#64748e}
.scenario-icon{width:44px;height:44px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#f1ecfa,#e5f0f5);font-size:22px}
.scenario-text{flex:1}
.scenario-name{font-size:14px;font-weight:700;display:block}
.scenario-description{font-size:11px;color:#a09db2;margin-top:4px;display:block}
.arrow{color:#a99abc;font-size:20px}
.dialogue-card{padding:21px;border-radius:23px;background:linear-gradient(145deg,#f0f5ffe0,#ffffffa6);border:1px solid white;box-shadow:0 15px 34px #6980af2b,inset 0 1px 0 white}
.speaker{color:#d49aa5;font-size:10px;letter-spacing:2px;font-weight:750;margin-bottom:13px}
.foreign-label,.korean-label,.pronunciation-label{color:#9296aa;font-size:10px;letter-spacing:1px;font-weight:700;margin:12px 0 7px}
.foreign{color:#668ac5;font-size:16px;font-weight:600;line-height:1.6;overflow-wrap:anywhere}
.korean{color:#639879;font-size:22px;font-weight:700;line-height:1.55;word-break:keep-all}
.pronunciation{color:#a18ab9;font-size:15px;font-style:italic;margin-top:8px;line-height:1.7;overflow-wrap:anywhere}
.choice-list{display:flex;flex-direction:column;gap:10px;margin-top:17px}
.choice{width:100%;padding:14px 16px;border:1px solid white;border-radius:16px;background:#ffffffb0;text-align:left;box-shadow:0 8px 20px #7080a026;color:#64748e}
.choice:disabled{opacity:.55;cursor:default}
.choice-foreign,.choice-ko,.choice-pronunciation{display:block;line-height:1.5;overflow-wrap:anywhere}
.choice-foreign{font-size:13px;font-weight:600;color:#668ac5;margin-bottom:6px}
.choice-ko{font-size:16px;font-weight:700;color:#639879;margin-bottom:5px}
.choice-pronunciation{font-size:12px;color:#a18ab9;font-style:italic}
.input-row{display:flex;gap:8px;margin-top:13px}
.input-row input{flex:1;min-width:0;padding:12px;border:1px solid white;border-radius:13px;background:#ffffffb3;color:#5d718e;outline:none}
.send-button{border:1px solid white;border-radius:13px;padding:0 16px;background:linear-gradient(135deg,#dce9f8,#e9e0f5);color:#687a9a;box-shadow:0 6px 15px #7080a022}
.tools{display:flex;gap:9px;margin-top:15px}
.tool-button{flex:1;padding:12px 8px;border:1px solid white;border-radius:14px;background:#ffffff9e;color:#7d89a8;font-size:12px}
.status{color:#9997ab;font-size:11px;margin-top:11px;min-height:17px;line-height:1.5}
.item-card{display:block;padding:16px}
.item-en{color:#668ac5;font-size:13px;font-weight:600;margin-bottom:6px}
.item-ko{color:#639879;font-size:19px;font-weight:700;line-height:1.5}
.item-ro{color:#a18ab9;font-size:12px;font-style:italic;margin-top:5px}
.item-note{color:#8d91a7;font-size:11px;margin-top:8px;line-height:1.5}
.hidden{display:none!important}
[dir="rtl"] .place-name{left:auto;right:15px}
[dir="rtl"] .scenario-card,[dir="rtl"] .choice,[dir="rtl"] .feature-card{text-align:right}
[dir="rtl"] .arrow{transform:scaleX(-1)}
[dir="rtl"] .back-button{text-align:right}
@media(max-width:420px){.main{padding:16px}.place-card{height:125px}.heading{font-size:24px}.korean{font-size:21px}.dialogue-card{padding:18px}}

/* KTrep 인트로 화면 */
#ktrep-intro{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(160deg,#172d3b,#294b56 55%,#e7b98b);color:#fff;animation:introFade 3.1s ease forwards}
.intro-scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.intro-moon{position:absolute;width:110px;height:110px;border-radius:50%;background:#f8e9c7;right:15%;top:13%;box-shadow:0 0 55px #f8e9c777}
.intro-palace{position:absolute;bottom:18%;width:min(90%,650px);height:210px;opacity:.9}
.intro-tiger{position:absolute;bottom:25%;left:13%;font-size:65px;animation:tigerMove 2.4s ease-in-out}
.intro-dragon{position:absolute;bottom:43%;right:12%;font-size:58px;animation:dragonMove 2.4s ease-in-out}
.intro-rabbits{position:absolute;bottom:13%;right:23%;font-size:34px;animation:rabbitHop 1.1s ease-in-out infinite alternate}
.intro-magpie{position:absolute;top:23%;left:22%;font-size:30px;animation:birdMove 2.2s ease-in-out}
.intro-center{position:relative;z-index:2;text-align:center;margin-top:20px;text-shadow:0 2px 15px #10232a88}
.intro-hangul{font-family:serif;font-size:clamp(90px,22vw,150px);font-weight:700;line-height:1;animation:hangulAppear 1.7s ease both}
.intro-brand{font-family:Georgia,serif;font-size:clamp(32px,9vw,48px);letter-spacing:5px;margin-top:16px}
.intro-tagline{font-size:10px;letter-spacing:3px;margin-top:9px;color:#f6e5cb}
@keyframes introFade{0%,75%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes hangulAppear{0%{opacity:0;transform:scale(.55)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes tigerMove{0%{transform:translateX(-80px);opacity:0}60%{transform:translateX(12px);opacity:1}100%{transform:translateX(0)}}
@keyframes dragonMove{0%{transform:translate(70px,-35px);opacity:0}70%{transform:translate(-10px,8px);opacity:1}100%{transform:translate(0,0)}}
@keyframes rabbitHop{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@keyframes birdMove{0%{transform:translate(0,0)}50%{transform:translate(45px,-15px)}100%{transform:translate(80px,0)}}
@media(prefers-reduced-motion:reduce){#ktrep-intro,.intro-tiger,.intro-dragon,.intro-rabbits,.intro-magpie,.intro-hangul{animation:none}}
</style>
</head>

<body>

<!-- KTrep 시작 인트로 -->
<div id="ktrep-intro" aria-label="KTrep introduction">
  <div class="intro-scene">
    <div class="intro-moon"></div>
    <svg class="intro-palace" viewBox="0 0 700 230" aria-hidden="true">
      <path d="M35 190 L35 125 L350 35 L665 125 L665 190 Z" fill="#182e38"/>
      <path d="M15 125 L350 20 L685 125 L650 125 L350 52 L50 125 Z" fill="#b87852"/>
      <path d="M85 190 V120 H120 V190 M190 190 V100 H225 V190 M285 190 V82 H320 V190 M380 190 V82 H415 V190 M475 190 V100 H510 V190 M580 190 V120 H615 V190" fill="#203d46"/>
      <path d="M25 190 H675 V205 H25 Z" fill="#162a34"/>
      <path d="M0 207 H700 V230 H0 Z" fill="#172c35"/>
    </svg>
    <div class="intro-tiger">🐅</div>
    <div class="intro-dragon">🐉</div>
    <div class="intro-rabbits">🐇 🐇</div>
    <div class="intro-magpie">🐦</div>
    <div class="intro-center">
      <div class="intro-hangul">정</div>
      <div class="intro-brand">KTrep</div>
      <div class="intro-tagline">KOREAN TRAVEL EXPRESSIONS</div>
    </div>
  </div>
</div>

<main class="app">
<header class="header">
  <div class="logo">KTrep</div>
  <div class="header-icon">✦</div>
</header>

<section class="main">

<section id="home">
  <h1 class="heading" id="homeTitle">Where to?</h1>
  <p class="subheading" id="homeSubheading">Explore Korea and learn useful Korean</p>

  <div class="language-wrap">
    <label class="language-label" id="languageLabel" for="languageSelect">Choose your language</label>
    <select class="language-select" id="languageSelect" onchange="setLanguage(this.value)">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="zh">中文（简体）</option>
      <option value="ja">日本語</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="ar">العربية</option>
      <option value="pt">Português</option>
      <option value="ru">Русский</option>
      <option value="vi">Tiếng Việt</option>
      <option value="si">සිංහල</option>
      <option value="ne">नेपाली</option>
      <option value="th">ไทย</option>
    </select>
  </div>

  <div class="place-grid">
    <button class="place-card" onclick="selectPlace('cafe')"><img src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=700" alt="Cafe"><span class="place-overlay"></span><span class="place-name" data-place="cafe">Cafe</span></button>
    <button class="place-card" onclick="selectPlace('restaurant')"><img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=700" alt="Restaurant"><span class="place-overlay"></span><span class="place-name" data-place="restaurant">Restaurant</span></button>
    <button class="place-card" onclick="selectPlace('transport')"><img src="https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=700" alt="Transport"><span class="place-overlay"></span><span class="place-name" data-place="transport">Transport</span></button>
    <button class="place-card" onclick="selectPlace('shopping')"><img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=700" alt="Shopping"><span class="place-overlay"></span><span class="place-name" data-place="shopping">Shopping</span></button>
    <button class="place-card" onclick="selectPlace('stay')"><img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=700" alt="Accommodation"><span class="place-overlay"></span><span class="place-name" data-place="stay">Stay</span></button>
  </div>

  <h2 class="section-title" id="learnTitle">Learn Korean</h2>
  <div class="feature-grid">
    <button class="feature-card" onclick="openLibrary('expressions')"><span class="feature-icon">🗣️</span><span class="feature-name" id="featureExpressions">Essential Expressions</span><span class="feature-desc" id="featureExpressionsDesc">Useful phrases for everyday situations</span></button>
    <button class="feature-card" onclick="openLibrary('grammar')"><span class="feature-icon">📖</span><span class="feature-name" id="featureGrammar">Useful Grammar</span><span class="feature-desc" id="featureGrammarDesc">Practical grammar with travel examples</span></button>
    <button class="feature-card" onclick="openLibrary('dietary')"><span class="feature-icon">🥗</span><span class="feature-name" id="featureDietary">Dietary Needs</span><span class="feature-desc" id="featureDietaryDesc">Vegetarian, vegan, halal and gluten-free</span></button>
    <button class="feature-card" onclick="openLibrary('all')"><span class="feature-icon">✨</span><span class="feature-name" id="featureAll">All Learning Materials</span><span class="feature-desc" id="featureAllDesc">Browse all expressions and grammar</span></button>
  </div>
</section>

<section id="scenarios" class="hidden">
  <button class="back-button" onclick="goHome()" id="scenarioBack">← Back</button>
  <h1 class="heading" id="placeHeading"></h1>
  <p class="subheading" id="scenarioSubheading">Choose a situation</p>
  <div class="scenario-list" id="scenarioList"></div>
</section>

<section id="conversation" class="hidden">
  <button class="back-button" onclick="goScenarios()" id="conversationBack">← Back</button>
  <h1 class="heading" id="conversationHeading"></h1>
  <div class="dialogue-card">
    <div class="speaker" id="speaker">STAFF</div>
    <div class="foreign-label" id="foreignLabel">YOUR LANGUAGE</div>
    <div class="foreign" id="foreign"></div>
    <div class="korean-label" id="koreanLabel">KOREAN</div>
    <div class="korean" id="korean"></div>
    <div class="pronunciation-label" id="pronunciationLabel">KOREAN PRONUNCIATION</div>
    <div class="pronunciation" id="pronunciation"></div>
  </div>
  <div class="choice-list" id="choices"></div>
  <div class="input-row">
    <input id="userInput" type="text" placeholder="Type what you want to say...">
    <button class="send-button" id="sendButton" onclick="submitText()">Send</button>
  </div>
  <div class="tools">
    <button class="tool-button" id="speakButton" onclick="listen()">🎙 Speak Korean</button>
    <button class="tool-button" id="listenButton" onclick="speakCurrent()">🔊 Listen</button>
  </div>
  <div class="status" id="status">Choose a response or type a phrase.</div>
</section>

<section id="library" class="hidden">
  <button class="back-button" onclick="goHome()" id="libraryBack">← Back</button>
  <h1 class="heading" id="libraryHeading">Learning Materials</h1>
  <p class="subheading" id="librarySubheading">Useful Korean for your trip</p>
  <div class="item-list" id="libraryList"></div>
</section>

</section>
</main>

<script>

// ==========================================
// 2부: 여행 상황 및 한국어 학습 데이터
// ==========================================

// 장소별 여행 상황과 대화 데이터를 저장합니다.
const appData = [

  // 1. 카페
  {
    place: "cafe",
    scenarios: [
      {
        id: "cafe_order",
        title: "Ordering a Drink",
        description: "Order coffee or tea",
        icon: "☕",
        dialogues: [{
          speaker: "STAFF",
          en: "What would you like to order?",
          ko: "무엇을 주문하시겠어요?",
          roman: "Mueoseul jumunhasigesseoyo?",
          choices: [
            {en:"One iced Americano, please.",ko:"아이스 아메리카노 하나 주세요.",roman:"Aiseu Americano hana juseyo."},
            {en:"One hot latte, please.",ko:"따뜻한 라테 하나 주세요.",roman:"Ttatteuthan latte hana juseyo."},
            {en:"Can I see the menu?",ko:"메뉴를 볼 수 있을까요?",roman:"Menyureul bol su isseulkkayo?"}
          ]
        }]
      },
      {
        id: "cafe_size",
        title: "Choosing a Size",
        description: "Choose the size of your drink",
        icon: "🥤",
        dialogues: [{
          speaker: "STAFF",
          en: "What size would you like?",
          ko: "어떤 사이즈로 드릴까요?",
          roman: "Eotteon saijeuro deurilkkayo?",
          choices: [
            {en:"A small, please.",ko:"작은 사이즈로 주세요.",roman:"Jageun saijeuro juseyo."},
            {en:"A medium, please.",ko:"중간 사이즈로 주세요.",roman:"Junggan saijeuro juseyo."},
            {en:"A large, please.",ko:"큰 사이즈로 주세요.",roman:"Keun saijeuro juseyo."}
          ]
        }]
      },
      {
        id: "cafe_takeout",
        title: "Takeout or For Here",
        description: "Choose where to enjoy your drink",
        icon: "🛍️",
        dialogues: [{
          speaker: "STAFF",
          en: "Is that for here or to go?",
          ko: "드시고 가세요, 아니면 가져가세요?",
          roman: "Deusigo gaseyo, animyeon gajyeogaseyo?",
          choices: [
            {en:"For here, please.",ko:"매장에서 마실게요.",roman:"Maejangeseo masilgeyo."},
            {en:"To go, please.",ko:"포장해 주세요.",roman:"Pojanghae juseyo."}
          ]
        }]
      }
    ]
  },

  // 2. 식당
  {
    place: "restaurant",
    scenarios: [
      {
        id: "restaurant_order",
        title: "Ordering Food",
        description: "Order a meal",
        icon: "🍽️",
        dialogues: [{
          speaker: "STAFF",
          en: "Are you ready to order?",
          ko: "주문하시겠어요?",
          roman: "Jumunhasigesseoyo?",
          choices: [
            {en:"Yes, I'd like this one.",ko:"네, 이걸로 주세요.",roman:"Ne, igeollo juseyo."},
            {en:"Could I have a little more time?",ko:"조금 더 생각해 봐도 될까요?",roman:"Jogeum deo saenggakhae bwado doelkkayo?"}
          ]
        }]
      },
      {
        id: "restaurant_extra",
        title: "Asking for More",
        description: "Ask for water or extra side dishes",
        icon: "🥢",
        dialogues: [{
          speaker: "STAFF",
          en: "Can I help you with anything?",
          ko: "더 필요한 게 있으세요?",
          roman: "Deo piryohan ge isseuseyo?",
          choices: [
            {en:"Could I have some water, please?",ko:"물 좀 주세요.",roman:"Mul jom juseyo."},
            {en:"Could I have another side dish?",ko:"반찬 좀 더 주세요.",roman:"Banchan jom deo juseyo."}
          ]
        }]
      },
      {
        id: "restaurant_dietary",
        title: "Dietary Requirements",
        description: "Explain your dietary preferences",
        icon: "🥬",
        dialogues: [{
          speaker: "USER",
          en: "I'm vegetarian. Do you have vegetarian dishes?",
          ko: "저는 채식주의자예요. 채식 메뉴가 있나요?",
          roman: "Jeoneun chaesikjuuijayeyo. Chaesik menyuga innayo?",
          choices: [
            {en:"Does this dish contain meat?",ko:"이 음식에 고기가 들어가나요?",roman:"I eumsige gogiga deureoganayo?"},
            {en:"Does this contain pork?",ko:"돼지고기가 들어가나요?",roman:"Dwaejigogiga deureoganayo?"},
            {en:"Is there a vegan option?",ko:"비건 메뉴가 있나요?",roman:"Bigeon menyuga innayo?"}
          ]
        }]
      },
      {
        id: "restaurant_allergy",
        title: "Food Allergies",
        description: "Ask about ingredients and cross-contact",
        icon: "⚠️",
        dialogues: [{
          speaker: "USER",
          en: "I have a food allergy. Could you check the ingredients?",
          ko: "음식 알레르기가 있어요. 재료를 확인해 주시겠어요?",
          roman: "Eumsik allereugiga isseoyo. Jaeryoreul hwaginhae jusigesseoyo?",
          choices: [
            {en:"Does this contain peanuts?",ko:"이 음식에 땅콩이 들어가나요?",roman:"I eumsige ttangkongi deureoganayo?"},
            {en:"Could there be cross-contact?",ko:"다른 음식과 접촉할 가능성이 있나요?",roman:"Dareun eumsikgwa jeopchokhal ganeungseongi innayo?"}
          ]
        }]
      },
      {
        id: "restaurant_payment",
        title: "Paying the Bill",
        description: "Ask for the bill and pay",
        icon: "💳",
        dialogues: [{
          speaker: "STAFF",
          en: "Would you like to pay now?",
          ko: "지금 결제하시겠어요?",
          roman: "Jigeum gyeoljehasigesseoyo?",
          choices: [
            {en:"Can I pay by card?",ko:"카드로 결제할 수 있나요?",roman:"Kadeuro gyeoljehal su innayo?"},
            {en:"Could I have the bill, please?",ko:"계산서 주세요.",roman:"Gyesanseo juseyo."}
          ]
        }]
      }
    ]
  },

  // 3. 교통
  {
    place: "transport",
    scenarios: [
      {
        id: "transport_ticket",
        title: "Buying a Ticket",
        description: "Buy a bus or train ticket",

// ============================================
// 시나리오 제목 번역
// ============================================

// 장소와 시나리오 ID에 맞춰 번역을 추가할 수 있다.
// 개별 제목 번역이 없으면 appData의 기본 제목을 표시한다.
const scenarioNames = {};

// ============================================
// 문장 번역
// ============================================

// 한국어 문장을 키로 사용한다.
// 각 문장의 번역은 언어별로 추가한다.
const phraseTranslations = {};

// ============================================
// 시나리오 설명 번역
// ============================================

const scenarioDescriptions = {};

// ============================================
// 공통 번역 함수
// ============================================

// 현재 선택한 언어의 화면 문구를 가져온다.
function getText(key) {
  return translations[currentLanguage]?.[key]
    || translations.en[key]
    || key;
}

// 시나리오 제목을 가져온다.
function getScenarioName(scenario) {
  return scenarioNames[scenario.id]?.[currentLanguage]
    || scenario.title;
}

// 시나리오 설명을 가져온다.
function getScenarioDescription(scenario) {
  return scenarioDescriptions[scenario.id]?.[currentLanguage]
    || scenario.description
    || "";
}

// 한국어 문장의 번역을 가져온다.
function getPhraseTranslation(korean, fallback = "") {
  return phraseTranslations[korean]?.[currentLanguage]
    || fallback;
}

// 아랍어 오른쪽에서 왼쪽으로 표시 여부
function isRTL() {
  return currentLanguage === "ar";
}

// 지원하는 언어인지 확인한다.
function isSupportedLanguage(language) {
  return Object.prototype.hasOwnProperty.call(
    languageNames,
    language
  );
}

// ============================================
// PART 4/5 — 앱 작동 기능
// ============================================

// ============================================
// 1. 현재 앱 상태
// ============================================

// 처음에는 영어를 기본 언어로 사용한다.
let currentLanguage = "en";

// 현재 선택한 장소
let currentPlace = null;

// 현재 선택한 시나리오
let currentScenario = null;

// 현재 대화 단계
let currentStep = 0;

// 현재 학습 자료 카테고리
let currentLibraryCategory = "all";

// ============================================
// 2. 공통 HTML 요소 함수
// ============================================

// HTML 요소를 ID로 가져온다.
function getElement(id) {
  return document.getElementById(id);
}

// 요소가 있을 때만 텍스트를 변경한다.
function setElementText(id, value) {
  const element = getElement(id);

  if (element) {
    element.textContent = value;
  }
}

// 요소가 있을 때만 입력창 안내 문구를 변경한다.
function setPlaceholder(id, value) {
  const element = getElement(id);

  if (element) {
    element.placeholder = value;
  }
}

// ============================================
// 3. 화면 언어 변경
// ============================================

function setLanguage(language) {

  // 지원하는 언어인지 확인한다.
  if (!isSupportedLanguage(language)) {
    language = "en";
  }

  // 현재 언어를 저장한다.
  currentLanguage = language;

  // 다음 방문 때도 선택한 언어를 사용하도록 저장한다.
  try {
    localStorage.setItem("travelLanguage", language);
  } catch (error) {
    console.warn("언어 설정을 저장하지 못했습니다.", error);
  }

  // 아랍어는 오른쪽에서 왼쪽으로 표시한다.
  document.documentElement.dir = isRTL() ? "rtl" : "ltr";

  // HTML의 언어 설정도 변경한다.
  document.documentElement.lang = language;

  // 언어 선택창의 값도 변경한다.
  const languageSelect = getElement("languageSelect");

  if (languageSelect) {
    languageSelect.value = language;
  }

  // 화면의 공통 문구를 갱신한다.
  updateInterface();

  // 현재 화면의 내용을 다시 그린다.
  const homeScreen = getElement("homeScreen");
  const scenarioScreen = getElement("scenarioScreen");
  const conversationScreen = getElement("conversationScreen");
  const libraryScreen = getElement("libraryScreen");

  if (homeScreen && homeScreen.style.display !== "none") {
    renderPlaces();
  }

  if (scenarioScreen && scenarioScreen.style.display !== "none") {
    renderScenarios();
  }

  if (conversationScreen && conversationScreen.style.display !== "none") {
    renderDialogue();
  }

  if (libraryScreen && libraryScreen.style.display !== "none") {
    showLibraryCategory(currentLibraryCategory);
  }
}

// ============================================
// 4. 화면 공통 문구 갱신
// ============================================

function updateInterface() {

  // 메인 화면
  setElementText("homeTitle", getText("homeTitle"));
  setElementText("homeSubheading", getText("homeSubheading"));
  setElementText("languageLabel", getText("languageLabel"));
  setElementText("learnTitle", getText("learnTitle"));

  // 시나리오 화면
  setElementText("scenarioSubheading", getText("scenarioSubheading"));

  // 대화 화면
  setElementText("conversationHeading", getText("conversationHeading"));
  setElementText("foreignLabel", getText("foreign"));
  setElementText("koreanLabel", getText("korean"));
  setElementText("pronunciationLabel", getText("pronunciation"));

  // 학습 자료 화면
  setElementText("libraryHeading", getText("libraryHeading"));
  setElementText("librarySubheading", getText("librarySubheading"));

  // 학습 자료 카테고리
  setElementText("featureExpressions", getText("featureExpressions"));
  setElementText("featureExpressionsDesc", getText("featureExpressionsDesc"));

  setElementText("featureGrammar", getText("featureGrammar"));
  setElementText("featureGrammarDesc", getText("featureGrammarDesc"));

  setElementText("featureDietary", getText("featureDietary"));
  setElementText("featureDietaryDesc", getText("featureDietaryDesc"));

  setElementText("featureAll", getText("featureAll"));
  setElementText("featureAllDesc", getText("featureAllDesc"));

  // 버튼
  setElementText("backButton", getText("back"));
  setElementText("sendButton", getText("sendButton"));
  setElementText("speakButton", getText("speakButton"));
  setElementText("listenButton", getText("listenButton"));

  // 입력창
  setPlaceholder("messageInput", getText("inputPlaceholder"));
}

// ============================================
// 5. 화면 이동
// ============================================

function showScreen(screenName) {

  // 모든 화면을 먼저 숨긴다.
  const screens = [
    "homeScreen",
    "scenarioScreen",
    "conversationScreen",
    "libraryScreen"
  ];

  screens.forEach(function(id) {
    const screen = getElement(id);

    if (screen) {
      screen.style.display = "none";
    }
  });

  // 요청한 화면만 표시한다.
  const selectedScreen = getElement(screenName + "Screen");

  if (selectedScreen) {
    selectedScreen.style.display = "block";
  }
}

// ============================================
// 6. 장소 목록 표시
// ============================================

function renderPlaces() {

  // 장소 목록을 표시할 영역을 찾는다.
  const container =
    getElement("placeGrid") ||
    getElement("placesGrid") ||
    getElement("places");

  if (!container) {
    console.warn("장소 목록 영역을 찾을 수 없습니다.");
    return;
  }

  // 기존 내용을 지운다.
  container.innerHTML = "";

  // 모든 장소를 순서대로 표시한다.
  appData.forEach(function(placeData) {

    // 장소 카드 생성
    const card = document.createElement("button");

    card.className = "place-card";
    card.type = "button";

    // 장소 이름과 아이콘
    const placeName =
      placeData.title ||
      placeData.name ||
      placeData.place ||
      "Place";

    const placeIcon =
      placeData.icon || "📍";

    const placeDescription =
      placeData.description || "";

    // 아이콘
    const icon = document.createElement("div");
    icon.className = "place-icon";
    icon.textContent = placeIcon;

    // 장소 이름
    const title = document.createElement("div");
    title.className = "place-name";
    title.textContent = placeName;

    // 장소 설명
    const description = document.createElement("div");
    description.className = "place-description";
    description.textContent = placeDescription;

    // 카드에 요소 추가
    card.appendChild(icon);
    card.appendChild(title);
    card.appendChild(description);

    // 장소 선택 이벤트
    card.addEventListener("click", function() {
      selectPlace(placeData.place);
    });

    container.appendChild(card);
  });
}

// ============================================
// 7. 장소 선택
// ============================================

function selectPlace(placeId) {

  // 선택한 장소 저장
  currentPlace = placeId;

  // 이전 시나리오 초기화
  currentScenario = null;

  // 대화 단계 초기화
  currentStep = 0;

  // 시나리오 목록 표시
  renderScenarios();

  // 시나리오 화면으로 이동
  showScreen("scenario");
}

// ============================================
// 8. 현재 장소 데이터 가져오기
// ============================================

function getCurrentPlaceData() {

  return appData.find(function(item) {
    return item.place === currentPlace;
  });
}

// ============================================
// 9. 시나리오 목록 표시
// ============================================

function renderScenarios() {

  const placeData = getCurrentPlaceData();

  if (!placeData) {
    console.warn("장소 데이터를 찾을 수 없습니다.");
    return;
  }

  // 시나리오 목록 영역
  const container =
    getElement("scenarioGrid") ||
    getElement("scenariosGrid") ||
    getElement("scenarioList");

  if (!container) {
    console.warn("시나리오 목록 영역을 찾을 수 없습니다.");
    return;
  }

  // 장소 이름 표시
  setElementText(
    "placeHeading",
    placeData.title || placeData.name || placeData.place
  );

  // 기존 목록 제거
  container.innerHTML = "";

  // 해당 장소의 시나리오를 표시한다.
  (placeData.scenarios || []).forEach(function(scenario) {

    // 시나리오 카드
    const card = document.createElement("button");

    card.className = "scenario-card";
    card.type = "button";

    // 아이콘
    const icon = document.createElement("div");
    icon.className = "scenario-icon";
    icon.textContent = scenario.icon || "💬";

    // 텍스트 영역
    const textArea = document.createElement("div");
    textArea.className = "scenario-text";

    // 제목
    const title = document.createElement("div");
    title.className = "scenario-name";
    title.textContent = getScenarioName(scenario);

    // 설명
    const description = document.createElement("div");
    description.className = "scenario-description";
    description.textContent = getScenarioDescription(scenario);

    // 오른쪽 화살표
    const arrow = document.createElement("div");
    arrow.className = "arrow";
    arrow.textContent = "›";

    // 요소 연결
    textArea.appendChild(title);
    textArea.appendChild(description);

    card.appendChild(icon);
    card.appendChild(textArea);
    card.appendChild(arrow);

    // 선택 이벤트
    card.addEventListener("click", function() {
      selectScenario(scenario.id);
    });

    container.appendChild(card);
  });
}

// ============================================
// 10. 시나리오 선택
// ============================================

function selectScenario(scenarioId) {

  currentScenario = scenarioId;

  currentStep = 0;

  // 대화 화면 표시
  showScreen("conversation");

  // 대화 내용 표시
  renderDialogue();
}

// ============================================
// 11. 현재 대화 데이터 가져오기
// ============================================

function getCurrentConversation() {

  const placeData = getCurrentPlaceData();

  if (!placeData) {
    return [];
  }

  const scenario = placeData.scenarios.find(function(item) {
    return item.id === currentScenario;
  });

  if (!scenario) {
    return [];
  }

  return scenario.dialogues || [];
}

// ============================================
// 12. 현재 시나리오 데이터 가져오기
// ============================================

function getCurrentScenarioData() {

  const placeData = getCurrentPlaceData();

  if (!placeData) {
    return null;
  }

  return placeData.scenarios.find(function(item) {
    return item.id === currentScenario;
  }) || null;
}

// ============================================
// 13. 대화 화면 표시
// ============================================

function renderDialogue() {

  const conversation = getCurrentConversation();

  const foreignElement = getElement("foreign");
  const koreanElement = getElement("korean");
  const pronunciationElement = getElement("pronunciation");

  // 현재 시나리오 제목 표시
  const scenario = getCurrentScenarioData();

  if (scenario) {
    setElementText(
      "conversationHeading",
      getScenarioName(scenario)
    );
  }

  // 대화가 끝났는지 확인한다.
  if (currentStep >= conversation.length) {

    if (foreignElement) {
      foreignElement.textContent = getText("completed");
    }

    if (koreanElement) {
      koreanElement.textContent = "";
    }

    if (pronunciationElement) {
      pronunciationElement.textContent = "";
    }

    const choicesContainer = getElement("choices");

    if (choicesContainer) {
      choicesContainer.innerHTML = "";
    }

    return;
  }

  // 현재 대화 데이터
  const step = conversation[currentStep];

  // 외국어 번역
  const translatedText = getPhraseTranslation(
    step.ko,
    step.en || ""
  );

  // 번역 표시
  if (foreignElement) {
    foreignElement.textContent = translatedText;
  }

  // 한국어 표시
  if (koreanElement) {
    koreanElement.textContent = step.ko || "";
  }

  // 발음 표시
  if (pronunciationElement) {
    pronunciationElement.textContent = step.roman || "";
  }

  // 화자 표시
  setElementText("speaker", step.speaker || "");

  // 선택지 표시
  renderChoices(step.choices || []);
}

// ============================================
// 14. 대화 선택지 표시
// ============================================

function renderChoices(choices) {

  const container = getElement("choices");

  if (!container) {
    return;
  }

  // 이전 선택지 삭제
  container.innerHTML = "";

  // 선택지가 없으면 종료
  if (!Array.isArray(choices) || choices.length === 0) {
    return;
  }

  // 선택지 표시
  choices.forEach(function(choice, index) {

    const button = document.createElement("button");

    button.className = "choice";
    button.type = "button";

    // 선택지 번역
    const foreignText = getPhraseTranslation(
      choice.ko,
      choice.en || ""
    );

    // 외국어 문장
    const foreign = document.createElement("div");
    foreign.className = "choice-foreign";
    foreign.textContent = foreignText;

    // 한국어 문장
    const korean = document.createElement("div");
    korean.className = "choice-ko";
    korean.textContent = choice.ko || "";

    // 발음
    const pronunciation = document.createElement("div");
    pronunciation.className = "choice-pronunciation";
    pronunciation.textContent = choice.roman || "";

    // 버튼 구성
    button.appendChild(foreign);
    button.appendChild(korean);
    button.appendChild(pronunciation);

    // 선택 이벤트
    button.addEventListener("click", function() {
      selectChoice(index);
    });

    container.appendChild(button);
  });
}

// ============================================
// 15. 선택지 선택 및 다음 대화로 이동
// ============================================

function selectChoice(index) {

  const conversation = getCurrentConversation();

  // 현재 대화 단계 확인
  const step = conversation[currentStep];

  if (!step || !step.choices || !step.choices[index]) {
    return;
  }

  // 선택한 버튼 비활성화
  const buttons = document.querySelectorAll(".choice");

  buttons.forEach(function(button) {
    button.disabled = true;
  });

  // 선택한 문장 표시
  const selectedChoice = step.choices[index];

  const foreignElement = getElement("foreign");
  const koreanElement = getElement("korean");
  const pronunciationElement = getElement("pronunciation");

  if (foreignElement) {
    foreignElement.textContent = getPhraseTranslation(
      selectedChoice.ko,
      selectedChoice.en || ""
    );
  }

  if (koreanElement) {
    koreanElement.textContent = selectedChoice.ko || "";
  }

  if (pronunciationElement) {
    pronunciationElement.textContent = selectedChoice.roman || "";
  }

  // 다음 대화 단계로 이동
  currentStep += 1;

  // 다음 단계 표시
  window.setTimeout(function() {
    renderDialogue();
  }, 700);
}

// ============================================
// 16. 홈으로 이동
// ============================================

function goHome() {

  currentPlace = null;
  currentScenario = null;
  currentStep = 0;

  renderPlaces();

  showScreen("home");
}

// ============================================
// 17. 이전 시나리오 화면으로 이동
// ============================================

function goScenarios() {

  currentScenario = null;
  currentStep = 0;

  renderScenarios();

  showScreen("scenario");
}

// ============================================
// 1. 학습 자료 카테고리 열기
// ============================================

function openLibrary(category = "all") {

  currentLibraryCategory = category;

  // 학습 자료 화면으로 이동
  showScreen("library");

  // 선택한 카테고리 표시
  showLibraryCategory(category);
}

// ============================================
// 2. 학습 자료 목록 가져오기
// ============================================

function getLibraryItems(category) {

  // 전체 학습 자료를 가져온다.
  if (category === "all") {

    return [
      ...(learningMaterials.expressions || []),
      ...(learningMaterials.grammar || []),
      ...(learningMaterials.dietary || [])
    ];
  }

  // 특정 카테고리의 자료만 가져온다.
  return learningMaterials[category] || [];
}

// ============================================
// 3. 학습 자료 카테고리 표시
// ============================================

function renderLibrary() {

  const container =
    getElement("libraryContent") ||
    getElement("libraryItems") ||
    getElement("libraryGrid");

  if (!container) {
    console.warn("학습 자료 영역을 찾을 수 없습니다.");
    return;
  }

  // 기존 내용 삭제
  container.innerHTML = "";

  // 카테고리 버튼 영역
  const categories = [
    {
      id: "all",
      title: getText("featureAll"),
      icon: "📚"
    },
    {
      id: "expressions",
      title: getText("featureExpressions"),
      icon: "💬"
    },
    {
      id: "grammar",
      title: getText("featureGrammar"),
      icon: "📖"
    },
    {
      id: "dietary",
      title: getText("featureDietary"),
      icon: "🍽️"
    }
  ];

  categories.forEach(function(category) {

    const button = document.createElement("button");

    button.type = "button";
    button.className = "library-category";

    if (currentLibraryCategory === category.id) {
      button.classList.add("active");
    }

    button.textContent =
      category.icon + " " + category.title;

    button.addEventListener("click", function() {
      openLibrary(category.id);
    });

    container.appendChild(button);
  });

  // 자료 표시 영역
  const materialsContainer = document.createElement("div");

  materialsContainer.id = "libraryMaterialList";
  materialsContainer.className = "library-material-list";

  container.appendChild(materialsContainer);

  renderLibraryItems(materialsContainer);
}

// ============================================
// 4. 학습 자료 표시
// ============================================

function renderLibraryItems(container) {

  const items = getLibraryItems(currentLibraryCategory);

  // 자료가 없으면 안내 문구 표시
  if (!items.length) {

    const emptyMessage = document.createElement("p");

    emptyMessage.textContent = getText("noMaterials");

    container.appendChild(emptyMessage);

    return;
  }

  // 자료 카드 표시
  items.forEach(function(item) {

    const card = document.createElement("div");

    card.className = "item-card";

    // 외국어 문장
    const foreign = document.createElement("div");

    foreign.className = "item-en";

    foreign.textContent = getPhraseTranslation(
      item.ko,
      item.en || ""
    );

    // 한국어 문장
    const korean = document.createElement("div");

    korean.className = "item-ko";

    korean.textContent = item.ko || "";

    // 발음
    const pronunciation = document.createElement("div");

    pronunciation.className = "item-ro";

    pronunciation.textContent = item.roman || "";

    // 설명
    const note = document.createElement("div");

    note.className = "item-note";

    note.textContent = item.note || item.description || "";

    // 음성 재생 버튼
    const listenButton = document.createElement("button");

    listenButton.type = "button";
    listenButton.className = "listen-item-button";

    listenButton.textContent = "🔊 " + getText("listenButton");

    listenButton.addEventListener("click", function() {
      speakKorean(item.ko || "");
    });

    // 카드 구성
    card.appendChild(foreign);
    card.appendChild(korean);
    card.appendChild(pronunciation);
    card.appendChild(note);
    card.appendChild(listenButton);

    container.appendChild(card);
  });
}

// ============================================
// 5. 카테고리별 학습 자료 표시
// ============================================

function showLibraryCategory(category) {

  currentLibraryCategory = category;

  const container =
    getElement("libraryContent") ||
    getElement("libraryItems") ||
    getElement("libraryGrid");

  if (!container) {
    return;
  }

  // 카테고리 버튼과 학습 자료를 다시 그린다.
  renderLibrary();
}

// ============================================
// 6. 한국어 음성 재생
// ============================================

function speakKorean(text) {

  // 빈 문장은 재생하지 않는다.
  if (!text || !text.trim()) {
    return;
  }

  // 브라우저 음성 기능 지원 여부 확인
  if (!("speechSynthesis" in window)) {

    alert("이 브라우저에서는 음성 재생을 지원하지 않습니다.");

    return;
  }

  // 이전 음성 재생 중지
  window.speechSynthesis.cancel();

  // 음성 문장 생성
  const utterance = new SpeechSynthesisUtterance(text);

  // 한국어 설정
  utterance.lang = "ko-KR";

  // 말하는 속도
  utterance.rate = 0.85;

  // 음높이
  utterance.pitch = 1;

  // 음성 재생
  window.speechSynthesis.speak(utterance);
}

// ============================================
// 7. 현재 대화의 한국어 음성 재생
// ============================================

function speakCurrent() {

  const koreanElement = getElement("korean");

  if (!koreanElement) {
    return;
  }

  speakKorean(koreanElement.textContent);
}

// ============================================
// 8. 현재 대화의 번역 음성 재생
// ============================================

function speakForeign() {

  const foreignElement = getElement("foreign");

  if (!foreignElement) {
    return;
  }

  const text = foreignElement.textContent;

  if (!text || !text.trim()) {
    return;
  }

  // 음성 재생 기능 확인
  if (!("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  // 현재 선택한 언어로 읽는다.
  const speechLanguages = {
    en: "en-US",
    es: "es-ES",
    zh: "zh-CN",
    ja: "ja-JP",
    fr: "fr-FR",
    de: "de-DE",
    ar: "ar-SA",
    pt: "pt-PT",
    ru: "ru-RU",
    vi: "vi-VN",
    si: "si-LK",
    ne: "ne-NP",
    th: "th-TH"
  };

  utterance.lang = speechLanguages[currentLanguage] || "en-US";

  window.speechSynthesis.speak(utterance);
}

// ============================================
// 9. 음성 인식 기능
// ============================================

function listenToUser() {

  // 브라우저별 음성 인식 기능 확인
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert(
      "이 브라우저에서는 음성 인식을 지원하지 않습니다. " +
      "Safari 또는 Chrome의 지원 여부를 확인해 주세요."
    );

    return;
  }

  // 음성 인식 객체 생성
  const recognition = new SpeechRecognition();

  // 현재 언어에 맞춰 인식 언어 설정
  const recognitionLanguages = {
    en: "en-US",
    es: "es-ES",
    zh: "zh-CN",
    ja: "ja-JP",
    fr: "fr-FR",
    de: "de-DE",
    ar: "ar-SA",
    pt: "pt-PT",
    ru: "ru-RU",
    vi: "vi-VN",
    si: "si-LK",
    ne: "ne-NP",
    th: "th-TH"
  };

  recognition.lang =
    recognitionLanguages[currentLanguage] || "en-US";

  // 한 번의 발화 결과만 사용
  recognition.interimResults = false;

  // 한 번의 음성 인식
  recognition.maxAlternatives = 1;

  // 음성 인식 결과
  recognition.onresult = function(event) {

    const recognizedText =
      event.results[0][0].transcript;

    const input = getElement("messageInput");

    if (input) {
      input.value = recognizedText;
    }
  };

  // 오류 처리
  recognition.onerror = function(event) {

    console.warn("음성 인식 오류:", event.error);

    alert("음성을 인식하지 못했습니다. 다시 시도해 주세요.");
  };

  // 음성 인식 시작
  recognition.start();
}

// ============================================
// 10. 입력창 메시지 전송
// ============================================

function submitText() {

  const input = getElement("messageInput");

  if (!input) {
    return;
  }

  const message = input.value.trim();

  // 빈 메시지 방지
  if (!message) {
    return;
  }

  // 현재 버전에는 AI 대화 서버가 연결되어 있지 않다.
  // 입력한 내용을 보존하고 연결 안내를 표시한다.
  const status = getElement("status");

  if (status) {
    status.textContent =
      "Message received. AI conversation is not connected yet.";
  }

  // 입력창 초기화
  input.value = "";
}

// ============================================
// 11. 버튼 이벤트 연결
// ============================================

function connectButtons() {

  // 한국어 음성 재생 버튼
  const speakButton = getElement("speakButton");

  if (speakButton) {
    speakButton.addEventListener("click", speakCurrent);
  }

  // 번역 음성 재생 버튼
  const listenButton = getElement("listenButton");

  if (listenButton) {
    listenButton.addEventListener("click", speakForeign);
  }

  // 음성 인식 버튼
  const voiceButton = getElement("voiceButton");

  if (voiceButton) {
    voiceButton.addEventListener("click", listenToUser);
  }

  // 메시지 전송 버튼
  const sendButton = getElement("sendButton");

  if (sendButton) {
    sendButton.addEventListener("click", submitText);
  }

  // Enter 키로 메시지 전송
  const messageInput = getElement("messageInput");

  if (messageInput) {

    messageInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        submitText();
      }
    });
  }

  // 홈 버튼
  const homeButton = getElement("homeButton");

  if (homeButton) {
    homeButton.addEventListener("click", goHome);
  }

  // 뒤로 가기 버튼
  const backButton = getElement("backButton");

  if (backButton) {
    backButton.addEventListener("click", goScenarios);
  }

  // 라이브러리 버튼
  const libraryButton = getElement("libraryButton");

  if (libraryButton) {
    libraryButton.addEventListener("click", function() {
      openLibrary("all");
    });
  }

  // 언어 선택 버튼
  const languageSelect = getElement("languageSelect");

  if (languageSelect) {

    languageSelect.addEventListener("change", function(event) {

      setLanguage(event.target.value);
    });
  }
}

// ============================================
// 12. 시작 언어 불러오기
// ============================================

function getSavedLanguage() {

  let savedLanguage = "en";

  try {
    savedLanguage = localStorage.getItem("travelLanguage") || "en";
  } catch (error) {
    console.warn("저장된 언어를 불러오지 못했습니다.", error);
  }

  if (!isSupportedLanguage(savedLanguage)) {
    savedLanguage = "en";
  }

  return savedLanguage;
}

// ============================================
// 13. 앱 시작
// ============================================

function initializeApp() {

  // 저장된 언어 불러오기
  currentLanguage = getSavedLanguage();

  // 화면 언어 설정
  document.documentElement.lang = currentLanguage;

  document.documentElement.dir =
    currentLanguage === "ar" ? "rtl" : "ltr";

  // 언어 선택창 설정
  const languageSelect = getElement("languageSelect");

  if (languageSelect) {
    languageSelect.value = currentLanguage;
  }

  // 화면 문구 갱신
  updateInterface();

  // 장소 카드 표시
  renderPlaces();

  // 버튼 이벤트 연결
  connectButtons();

  // 홈 화면 표시
  showScreen("home");

  // 인트로 화면은 일정 시간 뒤 제거
  const intro = getElement("ktrep-intro");

  if (intro) {

    window.setTimeout(function() {

      intro.classList.add("intro-hidden");

      window.setTimeout(function() {

        if (intro.parentNode) {
          intro.remove();
        }

      }, 700);

    }, 2500);
  }

  console.log("KTrep is ready!");
}

// ============================================
// 14. HTML이 준비되면 앱 시작
// ============================================

if (document.readyState === "loading") {

  document.addEventListener(
    "DOMContentLoaded",
    initializeApp
  );

} else {

  initializeApp();
}
