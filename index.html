<!DOCTYPE html> <!-- HTML 문서의 시작입니다. -->
<html lang="en"> <!-- 기본 화면 언어를 영어로 설정합니다. -->
<head> <!-- 문서 설정을 시작합니다. -->
<meta charset="UTF-8"> <!-- 한글과 다국어 문자를 표시합니다. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면에 맞춥니다. -->
<title>Seoul Moments</title> <!-- 브라우저 탭에 표시할 제목입니다. -->
<style> /* 화면 디자인을 설정하는 CSS입니다. */
*{box-sizing:border-box} /* 모든 요소의 크기 계산 방식을 통일합니다. */
body{margin:0;min-height:100vh;font-family:"Avenir Next","Segoe UI",sans-serif;color:#58647b;background:linear-gradient(135deg,#f1edf9,#eaf2f8 48%,#f9edf1);background-attachment:fixed} /* 파스텔 배경과 기본 글꼴을 설정합니다. */
button,input{font:inherit} /* 버튼과 입력창의 글꼴을 통일합니다. */
button{cursor:pointer;-webkit-tap-highlight-color:transparent} /* 버튼에 마우스 커서와 모바일 터치 효과를 설정합니다. */
.app{width:min(100% - 28px,760px);margin:auto;padding:25px 0 40px} /* 앱의 전체 너비와 바깥 여백을 설정합니다. */
.header{display:flex;justify-content:space-between;align-items:center;padding:5px 4px 22px} /* 상단 제목과 아이콘을 양쪽에 배치합니다. */
.logo{font-family:Georgia,serif;font-size:27px;letter-spacing:-1px;color:#586784} /* 앱 로고의 글꼴과 색상을 설정합니다. */
.header-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ffffff99;border:1px solid white;box-shadow:0 7px 20px #64739622;color:#a18cb9} /* 상단 장식 아이콘을 둥글게 만듭니다. */
.main{border-radius:28px;padding:22px;min-height:540px;background:#ffffff88;border:1px solid #ffffffd9;backdrop-filter:blur(20px);box-shadow:0 20px 55px #68749629, inset 0 1px 0 white} /* 메인 유리 카드의 모양을 설정합니다. */
.heading{font-family:Georgia,serif;font-size:27px;font-weight:500;margin:4px 0 7px;color:#596a88} /* 화면 제목의 디자인을 설정합니다. */
.subheading{margin:0 0 20px;color:#9997ab;font-size:12px} /* 제목 아래 안내 문구를 설정합니다. */
.section-title{font-size:15px;color:#71809d;margin:22px 0 10px;font-weight:700} /* 작은 섹션 제목을 설정합니다. */
.language-wrap{margin:0 0 18px} /* 언어 선택 영역의 여백을 설정합니다. */
.language-label{display:block;font-size:12px;color:#8992aa;margin-bottom:7px;font-weight:650} /* 언어 선택 안내 문구를 설정합니다. */
.language-select{width:100%;padding:12px 14px;border:1px solid white;border-radius:14px;background:#ffffffb8;color:#64748e;box-shadow:0 7px 18px #6473961c;outline:none} /* 언어 선택 메뉴를 꾸밉니다. */
.place-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px} /* 장소 카드를 두 열로 배치합니다. */
.place-card{position:relative;height:140px;border:1px solid white;border-radius:19px;overflow:hidden;padding:0;background:#e8eaf3;box-shadow:0 10px 25px #6473962b} /* 장소 카드의 크기와 모양을 설정합니다. */
.place-card img{width:100%;height:100%;object-fit:cover;display:block;opacity:.88} /* 장소 사진이 카드에 꽉 차도록 합니다. */
.place-overlay{position:absolute;inset:0;background:linear-gradient(transparent 35%,#2631418c)} /* 사진 아래쪽에 어두운 그라데이션을 넣습니다. */
.place-name{position:absolute;left:15px;bottom:14px;color:white;font-size:16px;font-weight:700;text-shadow:0 2px 8px #0004} /* 사진 위에 장소 이름을 표시합니다. */
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:15px} /* 공통 표현과 문법 등의 카드를 두 열로 배치합니다. */
.feature-card{border:1px solid white;border-radius:17px;padding:15px;background:#ffffffa6;text-align:left;box-shadow:0 8px 20px #6473961c;color:#657590} /* 학습 카테고리 카드의 디자인을 설정합니다. */
.feature-icon{font-size:24px;display:block;margin-bottom:8px} /* 학습 카테고리 아이콘을 표시합니다. */
.feature-name{font-size:14px;font-weight:700;display:block} /* 학습 카테고리 이름을 표시합니다. */
.feature-desc{font-size:11px;color:#9997ab;display:block;margin-top:5px;line-height:1.4} /* 학습 카테고리 설명을 표시합니다. */
.back-button{border:0;background:transparent;color:#8d91ad;padding:4px 0 17px;font-size:13px} /* 뒤로 가기 버튼을 꾸밉니다. */
.scenario-list,.item-list{display:flex;flex-direction:column;gap:11px} /* 상황과 학습 항목을 세로로 배치합니다. */
.scenario-card,.item-card{display:flex;align-items:center;gap:14px;width:100%;padding:15px;border-radius:17px;border:1px solid white;background:#ffffffa6;box-shadow:0 9px 23px #69769620;text-align:left;color:#64748e} /* 상황과 학습 항목 카드를 꾸밉니다. */
.scenario-icon{width:44px;height:44px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#f1ecfa,#e5f0f5);font-size:22px} /* 상황 아이콘의 크기와 배경을 설정합니다. */
.scenario-text{flex:1} /* 상황 카드의 글 영역이 남은 공간을 차지하게 합니다. */
.scenario-name{font-size:14px;font-weight:700;display:block} /* 상황 이름을 강조합니다. */
.scenario-description{font-size:11px;color:#a09db2;margin-top:4px;display:block} /* 상황 설명을 작게 표시합니다. */
.arrow{color:#a99abc;font-size:20px} /* 오른쪽 화살표를 꾸밉니다. */
.dialogue-card{padding:21px;border-radius:23px;background:linear-gradient(145deg,#f0f5ffe0,#ffffffa6);border:1px solid white;box-shadow:0 15px 34px #6980af2b,inset 0 1px 0 white} /* 대화 문장을 담는 카드를 꾸밉니다. */
.speaker{color:#d49aa5;font-size:10px;letter-spacing:2px;font-weight:750;margin-bottom:13px} /* 말하는 사람 표시를 꾸밉니다. */
.english{color:#668ac5;font-size:15px;font-weight:600;line-height:1.55;margin-bottom:10px} /* 영어 문장을 표시합니다. */
.korean{color:#639879;font-size:22px;font-weight:700;line-height:1.55;word-break:keep-all} /* 한국어 문장을 크게 표시합니다. */
.native-pronunciation{color:#7c83a5;font-size:17px;font-weight:650;margin-top:9px;line-height:1.5;letter-spacing:.2px}.roman{color:#a18ab9;font-size:12px;font-style:italic;margin-top:5px;line-height:1.5} /* 한국어 발음을 표시합니다. */
.choice-list{display:flex;flex-direction:column;gap:10px;margin-top:17px} /* 대화 선택지를 세로로 배치합니다. */
.choice{width:100%;padding:14px 16px;border:1px solid white;border-radius:16px;background:#ffffffb0;text-align:left;box-shadow:0 8px 20px #7080a026} /* 대화 선택지의 모양을 설정합니다. */
.choice-en,.choice-ko,.choice-ro{display:block;line-height:1.45} /* 선택지의 각 언어를 줄 단위로 표시합니다. */
.choice-en{font-size:13px;font-weight:600;color:#668ac5;margin-bottom:5px} /* 선택지 영어를 표시합니다. */
.choice-ko{font-size:16px;font-weight:700;color:#639879;margin-bottom:4px} /* 선택지 한국어를 표시합니다. */
.choice-native{font-size:14px;color:#7c83a5;font-weight:650;margin-top:5px}.choice-ro{font-size:10px;color:#a18ab9;font-style:italic;margin-top:3px} /* 선택지 발음을 표시합니다. */
.input-row{display:flex;gap:8px;margin-top:13px} /* 직접 입력창과 전송 버튼을 나란히 둡니다. */
.input-row input{flex:1;min-width:0;padding:12px;border:1px solid white;border-radius:13px;background:#ffffffb3;color:#5d718e;outline:none} /* 직접 입력창의 모양을 설정합니다. */
.send-button{border:1px solid white;border-radius:13px;padding:0 16px;background:linear-gradient(135deg,#dce9f8,#e9e0f5);color:#687a9a;box-shadow:0 6px 15px #7080a022} /* 전송 버튼의 모양을 설정합니다. */
.tools{display:flex;gap:9px;margin-top:15px} /* 음성 버튼을 나란히 배치합니다. */
.tool-button{flex:1;padding:12px 8px;border:1px solid white;border-radius:14px;background:#ffffff9e;color:#7d89a8;font-size:12px} /* 음성 버튼을 꾸밉니다. */
.status{color:#9997ab;font-size:11px;margin-top:11px;min-height:17px} /* 입력 및 음성 상태를 표시합니다. */
.item-card{display:block;padding:16px} /* 표현과 문법 카드를 세로형으로 표시합니다. */
.item-en{color:#668ac5;font-size:13px;font-weight:600;margin-bottom:6px} /* 표현의 영어 번역을 표시합니다. */
.item-ko{color:#639879;font-size:19px;font-weight:700;line-height:1.5} /* 표현의 한국어 문장을 표시합니다. */
.item-native{color:#7c83a5;font-size:15px;font-weight:650;margin-top:7px}.item-ro{color:#a18ab9;font-size:11px;font-style:italic;margin-top:4px} /* 표현의 로마자 발음을 표시합니다. */
.item-note{color:#8d91a7;font-size:11px;margin-top:8px;line-height:1.5} /* 문법 설명을 표시합니다. */
.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#eeeaf7;color:#8d80a8;font-size:10px;margin-bottom:8px} /* 분류 태그를 표시합니다. */
.hidden{display:none!important} /* hidden 클래스가 붙은 화면을 숨깁니다. */
@media(max-width:420px){.main{padding:16px}.place-card{height:125px}.heading{font-size:24px}.korean{font-size:21px}.dialogue-card{padding:18px}} /* 작은 모바일 화면에서 여백과 글자 크기를 조절합니다. */
</style> <!-- CSS 디자인을 종료합니다. -->
</head> <!-- 문서 설정을 종료합니다. -->
<body> <!-- 화면 내용을 시작합니다. -->
<main class="app"> <!-- 앱 전체 영역입니다. -->
<header class="header"> <!-- 앱 상단 영역입니다. -->
<div class="logo">Seoul Moments</div> <!-- 앱 이름입니다. -->
<div class="header-icon">✦</div> <!-- 장식 아이콘입니다. -->
</header> <!-- 앱 상단 영역을 종료합니다. -->
<section class="main"> <!-- 메인 콘텐츠 영역입니다. -->

<section id="home"> <!-- 첫 화면을 시작합니다. -->
<h1 class="heading" id="homeTitle">Where to?</h1> <!-- 장소 선택 제목입니다. -->
<p class="subheading" id="homeSubheading">Choose a place or learn useful Korean</p> <!-- 첫 화면 안내입니다. -->
<div class="language-wrap"> <!-- 사용할 언어를 선택하는 영역입니다. -->
<label class="language-label" id="languageLabel" for="languageSelect">Choose your language</label> <!-- 언어 선택 안내입니다. -->
<select class="language-select" id="languageSelect" onchange="setLanguage(this.value)"> <!-- 사용자의 언어를 선택합니다. -->
<option value="en">English</option> <!-- 영어를 선택합니다. -->
<option value="es">Español</option> <!-- 스페인어를 선택합니다. -->
<option value="zh">中文（简体）</option> <!-- 중국어 간체를 선택합니다. -->
<option value="ja">日本語</option> <!-- 일본어를 선택합니다. -->
<option value="fr">Français</option> <!-- 프랑스어를 선택합니다. -->
<option value="de">Deutsch</option> <!-- 독일어를 선택합니다. -->
<option value="ar">العربية</option> <!-- 아랍어를 선택합니다. -->
<option value="pt">Português</option> <!-- 포르투갈어를 선택합니다. -->
<option value="ru">Русский</option> <!-- 러시아어를 선택합니다. -->
<option value="vi">Tiếng Việt</option> <!-- 베트남어를 선택합니다. -->
<option value="ne">नेपाली</option> <!-- 네팔어 사용자를 위한 발음 표기입니다. -->
<option value="si">සිංහල</option> <!-- 싱할라어 사용자를 위한 발음 표기입니다. -->
<option value="th">ไทย</option> <!-- 태국어 사용자를 위한 발음 표기입니다. -->
</select> <!-- 언어 선택 메뉴를 종료합니다. -->
</div> <!-- 언어 선택 영역을 종료합니다. -->
<div class="place-grid"> <!-- 장소 선택 카드들을 배치합니다. -->
<button class="place-card" onclick="selectPlace('cafe')"><img src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=700" alt="Cafe"><span class="place-overlay"></span><span class="place-name">Cafe</span></button> <!-- 카페를 선택합니다. -->
<button class="place-card" onclick="selectPlace('restaurant')"><img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=700" alt="Restaurant"><span class="place-overlay"></span><span class="place-name">Restaurant</span></button> <!-- 식당을 선택합니다. -->
<button class="place-card" onclick="selectPlace('transport')"><img src="https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=700" alt="Transport"><span class="place-overlay"></span><span class="place-name">Transport</span></button> <!-- 교통을 선택합니다. -->
<button class="place-card" onclick="selectPlace('shopping')"><img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=700" alt="Shopping"><span class="place-overlay"></span><span class="place-name">Shopping</span></button> <!-- 쇼핑을 선택합니다. -->
<button class="place-card" onclick="selectPlace('stay')"><img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=700" alt="Accommodation"><span class="place-overlay"></span><span class="place-name">Stay</span></button> <!-- 숙소를 선택합니다. -->
</div> <!-- 장소 카드 영역을 종료합니다. -->
<h2 class="section-title" id="learnTitle">Learn Korean</h2> <!-- 학습 카테고리 제목입니다. -->
<div class="feature-grid"> <!-- 학습 카테고리 카드를 배치합니다. -->
<button class="feature-card" onclick="openLibrary('expressions')"><span class="feature-icon">🗣️</span><span class="feature-name" id="featureExpressions">Essential Expressions</span><span class="feature-desc" id="featureExpressionsDesc">Useful phrases for everyday situations</span></button> <!-- 공통 표현으로 이동합니다. -->
<button class="feature-card" onclick="openLibrary('grammar')"><span class="feature-icon">📖</span><span class="feature-name" id="featureGrammar">Useful Grammar</span><span class="feature-desc" id="featureGrammarDesc">Practical grammar with travel examples</span></button> <!-- 실전 문법으로 이동합니다. -->
<button class="feature-card" onclick="openLibrary('dietary')"><span class="feature-icon">🥗</span><span class="feature-name" id="featureDietary">Dietary Needs</span><span class="feature-desc" id="featureDietaryDesc">Vegetarian, vegan, halal and gluten-free</span></button> <!-- 식이 제한 표현으로 이동합니다. -->
<button class="feature-card" onclick="openLibrary('all')"><span class="feature-icon">✨</span><span class="feature-name" id="featureAll">All Learning Materials</span><span class="feature-desc" id="featureAllDesc">Browse all expressions and grammar</span></button> <!-- 모든 학습 자료로 이동합니다. -->
</div> <!-- 학습 카테고리 영역을 종료합니다. -->
</section> <!-- 첫 화면을 종료합니다. -->

<section id="scenarios" class="hidden"> <!-- 장소별 상황 선택 화면입니다. -->
<button class="back-button" onclick="goHome()">← Back</button> <!-- 첫 화면으로 돌아갑니다. -->
<h1 class="heading" id="placeHeading"></h1> <!-- 선택한 장소 이름을 표시합니다. -->
<p class="subheading" id="scenarioSubheading">Choose a situation</p> <!-- 상황 선택 안내입니다. -->
<div class="scenario-list" id="scenarioList"></div> <!-- 장소별 상황 목록이 표시됩니다. -->
</section> <!-- 상황 선택 화면을 종료합니다. -->

<section id="conversation" class="hidden"> <!-- 대화 학습 화면입니다. -->
<button class="back-button" onclick="goScenarios()">← Back</button> <!-- 상황 목록으로 돌아갑니다. -->
<h1 class="heading" id="conversationHeading"></h1> <!-- 선택한 상황 제목입니다. -->
<div class="dialogue-card"> <!-- 직원의 말을 보여주는 카드입니다. -->
<div class="speaker" id="speaker">STAFF</div> <!-- 화자를 표시합니다. -->
<div class="english" id="english"></div> <!-- 영어 번역을 표시합니다. -->
<div class="korean" id="korean"></div> <!-- 한국어 문장을 표시합니다. -->
<div class="native-pronunciation" id="nativePronunciation"></div> <!-- 학습자 언어 문자로 발음을 표시합니다. -->
<div class="roman" id="roman"></div> <!-- 발음을 표시합니다. -->
</div> <!-- 대화 카드를 종료합니다. -->
<div class="choice-list" id="choices"></div> <!-- 대화 선택지가 표시됩니다. -->
<div class="input-row"><input id="userInput" type="text" placeholder="Type in what you want to ask..."><button class="send-button" onclick="submitText()">Send</button></div> <!-- 사용자가 자신의 언어로 입력할 수 있는 영역입니다. -->
<div class="tools"><button class="tool-button" onclick="listen()">🎙 Speak</button><button class="tool-button" onclick="speakCurrent()">🔊 Listen</button></div> <!-- 음성 입력과 문장 듣기 버튼입니다. -->
<div class="status" id="status">Choose a response or type a phrase.</div> <!-- 현재 상태를 안내합니다. -->
</section> <!-- 대화 화면을 종료합니다. -->

<section id="library" class="hidden"> <!-- 표현과 문법 학습 화면입니다. -->
<button class="back-button" onclick="goHome()">← Back</button> <!-- 첫 화면으로 돌아갑니다. -->
<h1 class="heading" id="libraryHeading">Learning Materials</h1> <!-- 학습 자료 제목입니다. -->
<p class="subheading" id="librarySubheading">Useful Korean for your trip</p> <!-- 학습 자료 안내입니다. -->
<div class="item-list" id="libraryList"></div> <!-- 학습 항목 목록을 표시합니다. -->
</section> <!-- 학습 화면을 종료합니다. -->

</section> <!-- 메인 콘텐츠 영역을 종료합니다. -->
</main> <!-- 앱 전체 영역을 종료합니다. -->

<script> // 앱의 동작을 담당하는 JavaScript를 시작합니다.
const screens=["home","scenarios","conversation","library"]; // 앱에서 사용하는 화면 ID를 저장합니다.
let currentPlace=""; // 현재 선택한 장소 ID를 저장합니다.
let currentScenario=""; // 현재 선택한 상황 ID를 저장합니다.

function selectPlace(placeId){ // 장소 카드를 눌렀을 때 실행합니다.
currentPlace=placeId; // 선택한 장소 ID를 저장합니다.
document.getElementById("placeHeading").textContent=placeNames[placeId]; // 선택한 장소 이름을 제목에 표시합니다.

function renderScenarios(){ // 현재 장소의 상황 목록을 표시합니다.
const list=document.getElementById("scenarioList"); // 상황 목록을 표시할 영역을 가져옵니다.
list.innerHTML=""; // 이전에 표시된 상황을 모두 지웁니다.
const scenarios=scenarioData[currentPlace]||[]; // 현재 장소에 해당하는 상황만 가져옵니다.
scenarios.forEach(scenario=>{ // 현재 장소의 상황을 하나씩 반복합니다.
const button=document.createElement("button"); // 상황을 선택할 버튼을 만듭니다.
button.className="scenario-card"; // 상황 카드 디자인을 적용합니다.
button.innerHTML=`<span class="scenario-icon">${scenario.icon}</span><span class="scenario-text"><span class="scenario-name">${scenario.name}</span><span class="scenario-description">${scenario.description}</span></span><span class="arrow">›</span>`; // 아이콘, 이름, 설명을 버튼에 넣습니다.
button.onclick=()=>selectScenario(scenario.id); // 버튼을 누르면 해당 상황 ID를 전달합니다.
list.appendChild(button); // 만든 버튼을 화면에 추가합니다.
}); // 상황 반복을 종료합니다.
} // 상황 목록 표시 함수를 종료합니다.

function selectScenario(scenarioId){ // 상황을 선택했을 때 실행합니다.
currentScenario=scenarioId; // 선택한 상황 ID를 저장합니다.
if(!conversations[scenarioId]){alert("This situation is being prepared.");return;} // 대화 데이터가 없으면 안내하고 종료합니다.
currentStep=0; // 대화를 첫 단계부터 시작합니다.
document.getElementById("conversationHeading").textContent=findScenarioName(scenarioId); // 대화 화면 제목을 설정합니다.
document.getElementById("userInput").value=""; // 입력창을 비웁니다.
document.getElementById("status").textContent="Choose a response or type a phrase."; // 상태 안내를 초기화합니다.
showScreen("conversation"); // 대화 화면으로 이동합니다.
renderStep(); // 첫 번째 대사를 표시합니다.
} // 상황 선택 함수를 종료합니다.

function findScenarioName(scenarioId){ // 상황 ID에 맞는 화면 이름을 찾습니다.
for(const group of Object.values(scenarioData)){ // 모든 장소의 상황 목록을 순서대로 확인합니다.
const found=group.find(item=>item.id===scenarioId); // 현재 목록에서 ID가 일치하는 상황을 찾습니다.
if(found)return found.name; // 찾으면 상황 이름을 반환합니다.
} // 모든 장소 검색을 종료합니다.
return "Conversation"; // 일치하는 이름이 없으면 기본 제목을 반환합니다.
} // 상황 이름 검색 함수를 종료합니다.

document.getElementById("nativePronunciation").textContent=getNativePronunciation(step.ko,step.ro); // 선택 언어의 문자로 발음을 표시합니다.
document.getElementById("roman").textContent=step.ro; // 로마자 발음을 보조로 표시합니다.
const list=document.getElementById("choices"); // 선택지 영역을 가져옵니다.
list.innerHTML=""; // 이전 선택지를 지웁니다.
step.choices.forEach(choice=>{ // 현재 단계의 선택지를 하나씩 만듭니다.
const button=document.createElement("button"); // 선택지 버튼을 만듭니다.
button.className="choice"; // 선택지 디자인을 적용합니다.
const native=getNativePronunciation(choice[1],choice[2]);
button.innerHTML=`<span class="choice-en">${choice[0]}</span><span class="choice-ko">${choice[1]}</span>${native?`<span class="choice-native">${native}</span>`:""}<span class="choice-ro">${choice[2]}</span>`; // 영어, 한국어, 발음을 표시합니다.
button.onclick=()=>chooseAnswer(choice); // 선택하면 다음 단계로 이동합니다.
list.appendChild(button); // 선택지 버튼을 화면에 추가합니다.
}); // 선택지 반복을 종료합니다.
} // 대화 단계 표시 함수를 종료합니다.

function chooseAnswer(choice){ // 사용자가 선택지를 눌렀을 때 실행합니다.
const steps=conversations[currentScenario]; // 현재 상황의 대화 데이터를 가져옵니다.
if(currentStep<steps.length-1){ // 아직 마지막 단계가 아닌지 확인합니다.
currentStep+=1; // 다음 대화 단계로 이동합니다.
renderStep(); // 다음 대사를 표시합니다.
document.getElementById("status").textContent="Response selected."; // 선택 완료 안내를 표시합니다.
}else{ // 마지막 대화 단계라면 실행합니다.
currentStep=0; // 대화를 처음 단계로 되돌립니다.
renderStep(); // 첫 대사를 다시 표시합니다.
document.getElementById("status").textContent="Conversation complete. You can start again."; // 대화가 끝났음을 안내합니다.
} // 마지막 단계인지 확인하는 조건문을 종료합니다.
} // 선택지 처리 함수를 종료합니다.

function submitText(){ // 사용자가 입력창에 쓴 문장을 처리합니다.
const input=document.getElementById("userInput"); // 입력창 요소를 가져옵니다.
const typed=input.value.trim().replace(/\s/g,""); // 입력 문장의 앞뒤와 모든 공백을 제거합니다.
if(!typed)return; // 아무것도 입력하지 않았다면 종료합니다.
const step=conversations[currentScenario][currentStep]; // 현재 대화 단계의 선택지를 가져옵니다.
const matched=step.choices.find(choice=>choice[1].replace(/\s/g,"")===typed); // 입력 문장이 선택지 한국어와 정확히 같은지 확인합니다.
if(matched){chooseAnswer(matched);}else{document.getElementById("status").textContent="For now, choose one of the Korean responses shown above."; } // 일치하면 다음 단계로 가고 아니면 선택지를 안내합니다.
input.value=""; // 입력창을 비웁니다.
} // 직접 입력 함수를 종료합니다.

function listen(){ // 브라우저 음성 인식을 시작합니다.
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition; // 브라우저가 지원하는 음성 인식 기능을 찾습니다.
if(!SpeechRecognition){document.getElementById("status").textContent="Speech recognition is not supported in this browser.";return;} // 지원하지 않으면 안내하고 종료합니다.
const recognition=new SpeechRecognition(); // 음성 인식 객체를 생성합니다.
recognition.lang="ko-KR"; // 현재 버전에서는 한국어 음성을 인식하도록 설정합니다.
recognition.interimResults=false; // 중간 인식 결과는 받지 않습니다.
document.getElementById("status").textContent="Listening..."; // 듣기 중임을 표시합니다.
recognition.onresult=event=>{ // 음성 인식 결과가 도착하면 실행합니다.
const spoken=event.results[0][0].transcript; // 인식된 문장을 가져옵니다.
document.getElementById("userInput").value=spoken; // 인식한 문장을 입력창에 넣습니다.
document.getElementById("status").textContent="Recognized: "+spoken; // 인식 결과를 안내합니다.
submitText(); // 인식한 문장을 현재 선택지와 비교합니다.
}; // 음성 인식 결과 처리를 종료합니다.
recognition.onerror=event=>{document.getElementById("status").textContent="Speech error: "+event.error;}; // 음성 인식 오류를 화면에 표시합니다.
recognition.start(); // 음성 인식을 시작합니다.
} // 음성 인식 함수를 종료합니다.

function speakCurrent(){ // 현재 한국어 문장을 브라우저 음성으로 읽습니다.
if(!("speechSynthesis" in window)){document.getElementById("status").textContent="Text-to-speech is not supported.";return;} // 음성 출력 기능이 없으면 안내합니다.
const utterance=new SpeechSynthesisUtterance(document.getElementById("korean").textContent); // 현재 한국어 문장으로 음성 객체를 만듭니다.
utterance.lang="ko-KR"; // 한국어 음성으로 설정합니다.
utterance.rate=0.88; // 학습하기 좋도록 읽는 속도를 조금 낮춥니다.
window.speechSynthesis.cancel(); // 이전에 재생 중인 음성을 중지합니다.
window.speechSynthesis.speak(utterance); // 현재 문장을 읽습니다.
} // 문장 듣기 함수를 종료합니다.

function openLibrary(type){ // 학습 카테고리를 열 때 실행합니다.
currentLibrary=type; // 선택한 학습 카테고리를 저장합니다.
const list=document.getElementById("libraryList"); // 학습 항목을 표시할 영역을 가져옵니다.
list.innerHTML=""; // 이전 항목을 지웁니다.
const titles={expressions:"Essential Expressions",grammar:"Useful Grammar",dietary:"Dietary Needs",all:"All Learning Materials"}; // 카테고리별 제목을 저장합니다.
const descriptions={expressions:"Useful phrases for everyday situations",grammar:"Practical grammar with travel examples",dietary:"Food restrictions and ingredient questions",all:"Expressions, dietary needs and grammar"}; // 카테고리별 설명을 저장합니다.
document.getElementById("libraryHeading").textContent=titles[type]; // 화면 제목을 설정합니다.
document.getElementById("librarySubheading").textContent=descriptions[type]; // 화면 설명을 설정합니다.
let items=[]; // 표시할 학습 항목 배열을 준비합니다.
if(type==="expressions"||type==="all")items=items.concat(expressions.map(item=>({...item,category:"Essential Expression"}))); // 공통 표현을 목록에 추가합니다.
if(type==="dietary"||type==="all")items=items.concat(dietary.map(item=>({...item,category:"Dietary Needs"}))); // 식이 제한 표현을 목록에 추가합니다.
if(type==="grammar"||type==="all")items=items.concat(grammar.map(item=>({...item,category:item.pattern}))); // 문법 예문을 목록에 추가합니다.
items.forEach(item=>{ // 각 학습 항목을 카드로 만듭니다.
const card=document.createElement("article"); // 학습 카드 요소를 생성합니다.
card.className="item-card"; // 학습 카드 디자인을 적용합니다.
const native=getNativePronunciation(item.ko,item.ro);
card.innerHTML=`<span class="tag">${item.category}</span><div class="item-en">${item.en||item.meaning||""}</div><div class="item-ko">${item.ko}</div>${native?`<div class="item-native">${native}</div>`:""}<div class="item-ro">${item.ro||""}</div><div class="item-note">${item.note||""}</div>`; // 영어, 한국어, 발음, 설명을 카드에 표시합니다.
list.appendChild(card); // 학습 카드를 화면에 추가합니다.
}); // 학습 항목 반복을 종료합니다.
showScreen("library"); // 학습 화면으로 이동합니다.
} // 학습 자료 표시 함수를 종료합니다.

function goHome(){ // 첫 화면으로 돌아갑니다.
showScreen("home"); // 첫 화면을 표시합니다.
} // 첫 화면 이동 함수를 종료합니다.

function goScenarios(){ // 상황 목록 화면으로 돌아갑니다.
renderScenarios(); // 현재 선택한 장소의 상황 목록을 다시 표시합니다.
showScreen("scenarios"); // 상황 선택 화면으로 이동합니다.
} // 상황 목록 이동 함수를 종료합니다.

setLanguage("en"); // 처음 화면의 안내 문구를 영어로 설정합니다.

document.getElementById("userInput").addEventListener("keydown",event=>{ // 입력창에서 키보드 입력을 감지합니다.
if(event.key==="Enter")submitText(); // Enter 키를 누르면 입력 문장을 처리합니다.
}); // 키보드 이벤트 설정을 종료합니다.
</script> <!-- JavaScript를 종료합니다. -->
</body> <!-- 화면 내용을 종료합니다. -->
</html> <!-- HTML 문서를 종료합니다. -->
