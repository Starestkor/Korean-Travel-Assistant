<html lang="en"> <!-- 기본 언어를 영어로 설정합니다. -->
<head> <!-- 페이지 설정을 시작합니다. -->
<meta charset="UTF-8"> <!-- 한글 표시를 지원합니다. -->

<title>Seoul Moments</title> <!-- 브라우저 제목입니다. -->

<style> /* 디자인 CSS를 시작합니다. */
* { box-sizing: border-box; } /* 모든 요소의 크기 계산을 통일합니다. */
body { margin: 0; min-height: 100vh; font-family: "Avenir Next", "Segoe UI", sans-serif; color: #58647B; background: linear-gradient(135deg,#F1EDF9,#EAF2F8 48%,#F9EDF1); background-attachment: fixed; } /* 파스텔 배경입니다. */
button, input { font: inherit; } /* 버튼과 입력창 글꼴을 통일합니다. */
button { -webkit-tap-highlight-color: transparent; } /* 모바일 터치 강조색을 제거합니다. */
.app { width: min(100% - 28px,760px); margin: auto; padding: 25px 0 40px; } /* 앱 전체 영역입니다. */
.header { display: flex; justify-content: space-between; align-items: center; padding: 5px 4px 22px; } /* 상단 브랜드 영역입니다. */
.logo { font-family: Georgia,serif; font-size: 27px; letter-spacing: -1px; color: #586784; } /* 앱 이름입니다. */
.header-icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.58); border: 1px solid white; box-shadow: 0 7px 20px rgba(100,115,150,.13); color: #A18CB9; } /* 상단 장식입니다. */
.glass { background: rgba(255,255,255,.53); border: 1px solid rgba(255,255,255,.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 18px 45px rgba(100,112,145,.15),0 5px 14px rgba(100,112,145,.07),inset 0 1px 0 white; } /* 공통 유리 스타일입니다. */
.main { border-radius: 28px; padding: 22px; min-height: 500px; box-shadow: 0 20px 55px rgba(104,116,150,.16),0 7px 20px rgba(104,116,150,.08),inset 0 1px 0 white; } /* 메인 카드입니다. */
.heading { font-family: Georgia,serif; font-size: 27px; font-weight: 500; margin: 4px 0 7px; color: #596A88; } /* 화면 제목입니다. */
.subheading { margin: 0 0 20px; color: #9997AB; font-size: 12px; } /* 보조 설명입니다. */
.place-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; } /* 장소 카드 그리드입니다. */
.place-card { position: relative; height: 140px; border: 1px solid white; border-radius: 19px; overflow: hidden; padding: 0; background: #E8EAF3; cursor: pointer; box-shadow: 0 10px 25px rgba(100,115,150,.17); transition: transform .2s,box-shadow .2s; } /* 장소 카드입니다. */
.place-card:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(100,115,150,.22); } /* 장소 카드 호버 효과입니다. */
.place-card img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .88; transition: transform .4s; } /* 장소 사진입니다. */
.place-card:hover img { transform: scale(1.04); } /* 사진 확대 효과입니다. */
.place-overlay { position: absolute; inset: 0; background: linear-gradient(transparent 35%,rgba(38,49,65,.55)); } /* 사진 위 그라데이션입니다. */
.place-name { position: absolute; left: 15px; bottom: 14px; color: white; font-size: 16px; font-weight: 650; text-shadow: 0 2px 8px rgba(0,0,0,.25); } /* 장소 이름입니다. */
.back-button { border: 0; background: transparent; color: #8D91AD; padding: 4px 0 17px; cursor: pointer; font-size: 13px; } /* 뒤로 가기 버튼입니다. */
.scenario-list { display: flex; flex-direction: column; gap: 12px; } /* 상황 목록입니다. */
.scenario-card { display: flex; align-items: center; gap: 15px; width: 100%; padding: 16px; border-radius: 18px; border: 1px solid white; background: rgba(255,255,255,.58); box-shadow: 0 9px 23px rgba(105,118,150,.13),inset 0 1px 0 white; text-align: left; cursor: pointer; transition: transform .2s; } /* 상황 선택 카드입니다. */
.scenario-card:active { transform: scale(.985); } /* 상황 카드 클릭 효과입니다. */
.scenario-icon { width: 46px; height: 46px; flex-shrink: 0; border-radius: 15px; display: grid; place-items: center; background: linear-gradient(145deg,#F1ECFA,#E5F0F5); font-size: 22px; box-shadow: 0 5px 13px rgba(125,130,170,.10); } /* 상황 아이콘입니다. */
.scenario-text { flex: 1; } /* 상황 텍스트 영역입니다. */
.scenario-name { font-size: 15px; color: #64748E; font-weight: 650; } /* 상황 이름입니다. */
.scenario-description { color: #A09DB2; font-size: 11px; margin-top: 4px; } /* 상황 설명입니다. */
.scenario-arrow { color: #A99ABC; font-size: 18px; } /* 오른쪽 화살표입니다. */
.dialogue-card { padding: 21px; border-radius: 23px; background: linear-gradient(145deg,rgba(240,245,255,.88),rgba(255,255,255,.65)); border: 1px solid white; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: 0 15px 34px rgba(105,128,175,.17),0 5px 13px rgba(105,128,175,.08),inset 0 1px 0 white; } /* 직원 대사 카드입니다. */
.speaker { color: #D49AA5; font-size: 10px; letter-spacing: 2px; font-weight: 750; margin-bottom: 13px; } /* 화자 표시입니다. */
.english { color: #668AC5; font-size: 15px; font-weight: 600; line-height: 1.55; margin-bottom: 12px; } /* 영어 문장입니다. */
.korean { color: #639879; font-size: 22px; font-weight: 700; line-height: 1.55; word-break: keep-all; } /* 한국어 문장입니다. */
.roman { color: #A18AB9; font-size: 13px; font-style: italic; margin-top: 9px; line-height: 1.5; } /* 로마자 발음입니다. */
.choice-list { display: flex; flex-direction: column; gap: 11px; margin-top: 18px; } /* 선택지 목록입니다. */
.choice { width: 100%; padding: 15px 17px; border: 1px solid white; border-radius: 17px; background: rgba(255,255,255,.66); text-align: left; cursor: pointer; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(112,125,160,.15),0 3px 8px rgba(112,125,160,.07),inset 0 1px 0 white; transition: transform .15s,background .15s; } /* 선택지 카드입니다. */
.choice:active { transform: scale(.985); background: rgba(237,241,250,.9); } /* 선택지 클릭 효과입니다. */
.choice-en { display: block; font-size: 14px; font-weight: 600; color: #668AC5; margin-bottom: 7px; line-height: 1.45; } /* 선택지 영어입니다. */
.choice-ko { display: block; font-size: 17px; font-weight: 700; color: #639879; margin-bottom: 5px; line-height: 1.5; } /* 선택지 한국어입니다. */
.choice-ro { display: block; font-size: 12px; color: #A18AB9; font-style: italic; line-height: 1.5; } /* 선택지 발음입니다. */
.input-row { display: flex; gap: 8px; margin-top: 13px; } /* 직접 입력 영역입니다. */
.input-row input { flex: 1; min-width: 0; padding: 12px; border: 1px solid white; border-radius: 13px; background: rgba(255,255,255,.7); color: #5D718E; outline: none; } /* 입력창입니다. */
.input-row input::placeholder { color: #A5A5B8; } /* 입력 안내 색상입니다. */
.input-row input:focus { border-color: #B9C9E7; } /* 입력창 포커스 효과입니다. */
.send-button { border: 1px solid white; border-radius: 13px; padding: 0 16px; background: linear-gradient(135deg,#DCE9F8,#E9E0F5); color: #687A9A; cursor: pointer; box-shadow: 0 6px 15px rgba(112,125,160,.13); } /* 전송 버튼입니다. */
.tools { display: flex; gap: 9px; margin-top: 18px; } /* 음성 기능 영역입니다. */
.tool-button { flex: 1; padding: 12px 8px; border: 1px solid white; border-radius: 14px; background: rgba(255,255,255,.62); color: #7D89A8; cursor: pointer; font-size: 12px; box-shadow: 0 7px 17px rgba(112,125,160,.12); } /* 음성 버튼입니다. */
.status { color: #9997AB; font-size: 11px; margin-top: 11px; min-height: 17px; } /* 상태 안내입니다. */
.hidden { display: none !important; } /* 요소를 숨깁니다. */

@media (max-width: 420px) { /* 작은 모바일 화면 설정입니다. */
  .main { padding: 16px; } /* 메인 여백을 줄입니다. */
  .place-card { height: 125px; } /* 장소 카드 높이를 줄입니다. */
  .heading { font-size: 24px; } /* 제목 크기를 줄입니다. */
  .korean { font-size: 21px; } /* 한국어 글자 크기입니다. */
  .dialogue-card { padding: 18px; } /* 대화 카드 여백입니다. */
} /* 모바일 설정을 종료합니다. */
</style> <!-- CSS를 종료합니다. -->
</head> <!-- 페이지 설정을 종료합니다. -->

<body> <!-- 화면 내용을 시작합니다. -->
<main class="app"> <!-- 앱 전체 영역입니다. -->
<header class="header"> <!-- 상단 브랜드입니다. -->
  <div class="logo">Seoul Moments</div> <!-- 앱 이름입니다. -->
  <div class="header-icon">✦</div> <!-- 장식 아이콘입니다. -->
</header> <!-- 헤더를 종료합니다. -->

<section class="main glass"> <!-- 메인 유리 카드입니다. -->

<section id="places"> <!-- 장소 선택 화면입니다. -->
  <h1 class="heading">Where to?</h1> <!-- 제목입니다. -->
  <p class="subheading">Choose your destination</p> <!-- 안내입니다. -->
  <div class="place-grid"> <!-- 장소 카드 목록입니다. -->
    <button class="place-card" onclick="selectPlace('cafe')"><img src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=700" alt="Cafe"><span class="place-overlay"></span><span class="place-name">Cafe</span></button> <!-- 카페 카드입니다. -->
    <button class="place-card" onclick="selectPlace('restaurant')"><img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=700" alt="Restaurant"><span class="place-overlay"></span><span class="place-name">Restaurant</span></button> <!-- 식당 카드입니다. -->
    <button class="place-card" onclick="selectPlace('transport')"><img src="https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=700" alt="Transportation"><span class="place-overlay"></span><span class="place-name">Transport</span></button> <!-- 교통 카드입니다. -->
    <button class="place-card" onclick="selectPlace('shopping')"><img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=700" alt="Shopping"><span class="place-overlay"></span><span class="place-name">Shopping</span></button> <!-- 쇼핑 카드입니다. -->
    <button class="place-card" onclick="selectPlace('accommodation')"><img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=700" alt="Accommodation"><span class="place-overlay"></span><span class="place-name">Stay</span></button> <!-- 숙소 카드입니다. -->
  </div> <!-- 장소 목록을 종료합니다. -->
</section> <!-- 장소 화면을 종료합니다. -->

<section id="scenarios" class="hidden"> <!-- 상황 선택 화면입니다. -->
  <button class="back-button" onclick="goPlaces()">← Back</button> <!-- 장소 화면으로 돌아갑니다. -->
  <h1 class="heading" id="placeHeading">Cafe</h1> <!-- 장소 이름입니다. -->
  <p class="subheading">Choose a situation</p> <!-- 안내 문구입니다. -->
  <div class="scenario-list" id="scenarioList"></div> <!-- 상황 목록입니다. -->
</section> <!-- 상황 화면을 종료합니다. -->

<section id="conversation" class="hidden"> <!-- 대화 화면입니다. -->
  <button class="back-button" onclick="goScenarios()">← Back</button> <!-- 상황 목록으로 돌아갑니다. -->
  <div class="dialogue-card"> <!-- 직원 대사 카드입니다. -->
    <div class="speaker" id="speaker">STAFF</div> <!-- 화자입니다. -->
    <div class="english" id="english"></div> <!-- 영어 문장입니다. -->
    <div class="korean" id="korean"></div> <!-- 한국어 문장입니다. -->
    <div class="roman" id="roman"></div> <!-- 발음입니다. -->
  </div> <!-- 대사 카드를 종료합니다. -->
  <div class="choice-list" id="choices"></div> <!-- 선택지 목록입니다. -->
  <div class="input-row"> <!-- 입력 영역입니다. -->
    <input id="userInput" placeholder="Type in Korean..." type="text"> <!-- 입력창입니다. -->
    <button class="send-button" onclick="submitText()">Send</button> <!-- 전송 버튼입니다. -->
  </div> <!-- 입력 영역을 종료합니다. -->
  <div class="tools"> <!-- 음성 기능 영역입니다. -->
    <button class="tool-button" onclick="listen('user')">🎙 Speak</button> <!-- 사용자 음성 입력입니다. -->
    <button class="tool-button" onclick="listen('staff')">🎧 Staff</button> <!-- 직원 음성 인식입니다. -->
  </div> <!-- 음성 기능을 종료합니다. -->
  <div class="status" id="status">Choose a response or speak Korean.</div> <!-- 상태 안내입니다. -->
</section> <!-- 대화 화면을 종료합니다. -->

</section> <!-- 메인 카드를 종료합니다. -->
</main> <!-- 앱 영역을 종료합니다. -->

    {id:"stay_checkout",icon:"🧳",name:"Check out",description:"Check out and settle the bill"}, // 체크아웃입니다.

  cafe_order: [ // 카페 음료 주문입니다.

    {en:"Thank you for staying with us.",ko:"저희 숙소를 이용해 주셔서 감사합니다.",ro:"Jeohui sukso-reul iyonghae jusyeoseo gamsahamnida.",choices:[["I had a great stay.","잘 묵고 갑니다.","Jal mukgo gamnida."]]} // 마무리입니다.
  ], // 체크아웃 데이터를 종료합니다.

  stay_facility: [ // 숙소 시설 문의입니다.
    {en:"How can I help you?",ko:"무엇을 도와드릴까요?",ro:"Mueoseul dowadeurilkkayo?",choices:[["What is the Wi-Fi password?","와이파이 비밀번호가 뭐예요?","Waipai bimilbeonhoga mwoyeyo?"],["Where is the laundry room?","세탁실이 어디예요?","Setaksiri eodiyeyo?"],["What time is the gym open?","헬스장은 몇 시에 여나요?","Helseujangeun myeot sie yeonayo?"]]}, // 시설 문의입니다.
    {en:"The Wi-Fi password is on your room card.",ko:"와이파이 비밀번호는 객실 카드에 적혀 있어요.",ro:"Waipai bimilbeoneun gaeksil kadeue jeokhyeo isseoyo.",choices:[["Could you help me connect?","연결하는 걸 도와주시겠어요?","Yeongyeolhaneun geol dowajusigesseoyo?"],["Thank you.","감사합니다.","Gamsahamnida."]]}, // 와이파이 안내입니다.
    {en:"Of course. I'll help you.",ko:"물론이죠. 도와드릴게요.",ro:"Mullonjyo. Dowadeurilgeyo.",choices:[["Thank you very much.","정말 감사합니다.","Jeongmal gamsahamnida."]]} // 마무리입니다.
  ] // 시설 문의 데이터를 종료합니다.

}; // 전체 대화 데이터를 종료합니다.

function showScreen(name) { // 화면 전환 함수입니다.
  screens.forEach(id => document.getElementById(id).classList.add("hidden")); // 모든 화면을 숨깁니다.
  document.getElementById(name).classList.remove("hidden"); // 선택한 화면을 보여줍니다.
} // 화면 전환 함수를 종료합니다.

function selectPlace(placeId) { // 장소를 선택하는 함수입니다.
  currentPlace = placeId; // 장소 ID를 저장합니다.
  document.getElementById("placeHeading").textContent = placeNames[placeId]; // 장소 이름을 표시합니다.
  renderScenarios(); // 해당 장소의 상황을 표시합니다.
  showScreen("scenarios"); // 상황 화면으로 이동합니다.
} // 장소 선택 함수를 종료합니다.

function renderScenarios() { // 장소별 상황을 화면에 만드는 함수입니다.
  const list = document.getElementById("scenarioList"); // 상황 목록 영역을 가져옵니다.
  list.innerHTML = ""; // 기존 목록을 지웁니다.
  scenarioData[currentPlace].forEach(scenario => { // 선택한 장소의 상황만 반복합니다.
    const button = document.createElement("button"); // 상황 버튼을 만듭니다.
    button.className = "scenario-card"; // 카드 스타일을 적용합니다.
    button.innerHTML = `<span class="scenario-icon">${scenario.icon}</span><span class="scenario-text"><span class="scenario-name">${scenario.name}</span><span class="scenario-description">${scenario.description}</span></span><span class="scenario-arrow">›</span>`; // 카드 내용을 구성합니다.
    button.onclick = () => selectScenario(scenario.id); // 클릭한 상황 ID를 전달합니다.
    list.appendChild(button); // 화면에 카드를 추가합니다.
  }); // 상황 반복을 종료합니다.
} // 상황 목록 함수를 종료합니다.

function selectScenario(scenarioId) { // 상황을 선택하는 함수입니다.
  currentScenario = scenarioId; // 상황 ID를 저장합니다.
  if (!conversations[scenarioId]) { // 대화 데이터가 있는지 확인합니다.
    alert("This situation is being prepared."); // 대화 데이터가 없으면 안내합니다.
    return; // 함수를 종료합니다.
  } // 대화 데이터 확인을 종료합니다.
  currentStep = 0; // 대화의 첫 단계로 이동합니다.
  document.getElementById("userInput").value = ""; // 입력창을 비웁니다.
  document.getElementById("status").textContent = "Choose a response or speak Korean."; // 상태 문구를 초기화합니다.
  showScreen("conversation"); // 대화 화면으로 이동합니다.
  renderStep(); // 첫 대사를 표시합니다.
} // 상황 선택 함수를 종료합니다.

function renderStep() { // 현재 대화 단계를 표시하는 함수입니다.
  const steps = conversations[currentScenario]; // 선택한 상황의 대화 데이터를 가져옵니다.
  const step = steps[currentStep]; // 현재 단계 데이터를 가져옵니다.
  document.getElementById("speaker").textContent = "STAFF"; // 화자를 직원으로 표시합니다.
  document.getElementById("english").textContent = step.en; // 영어 문장을 표시합니다.
  document.getElementById("korean").textContent = step.ko; // 한국어 문장을 표시합니다.
  document.getElementById("roman").textContent = step.ro; // 발음을 표시합니다.

  const list = document.getElementById("choices"); // 선택지 영역을 가져옵니다.
  list.innerHTML = ""; // 기존 선택지를 지웁니다.

  step.choices.forEach(choice => { // 현재 단계의 선택지를 반복합니다.
    const button = document.createElement("button"); // 선택지 버튼을 만듭니다.
    button.className = "choice"; // 선택지 디자인을 적용합니다.
    button.innerHTML = `<span class="choice-en">${choice[0]}</span><span class="choice-ko">${choice[1]}</span><span class="choice-ro">${choice[2]}</span>`; // 영어, 한국어, 발음을 표시합니다.
    button.onclick = () => chooseAnswer(choice); // 선택하면 다음 단계로 이동합니다.
    list.appendChild(button); // 버튼을 목록에 추가합니다.
  }); // 선택지 반복을 종료합니다.
} // 대화 표시 함수를 종료합니다.

function chooseAnswer(choice) { // 선택지를 선택했을 때 실행합니다.
  const steps = conversations[currentScenario]; // 현재 상황의 대화 데이터를 가져옵니다.
  if (currentStep < steps.length - 1) { // 마지막 단계인지 확인합니다.
    currentStep += 1; // 다음 대화 단계로 이동합니다.
    renderStep(); // 다음 대사를 표시합니다.
    document.getElementById("status").textContent = "Response selected."; // 선택 완료를 표시합니다.
  } else { // 마지막 대화 단계라면 실행합니다.
    currentStep = 0; // 처음 단계로 초기화합니다.
    document.getElementById("status").textContent = "Conversation complete. You can start again."; // 대화 완료를 안내합니다.
    renderStep(); // 처음 대사를 다시 표시합니다.
  } // 마지막 단계 확인을 종료합니다.
} // 응답 선택 함수를 종료합니다.

function submitText() { // 직접 입력한 문장을 처리합니다.
  const input = document.getElementById("userInput"); // 입력창을 가져옵니다.
  const text = input.value.trim().replace(/\s/g,""); // 입력 문장의 공백을 제거합니다.
  if (!text) return; // 빈 입력이면 종료합니다.
  const step = conversations[currentScenario][currentStep]; // 현재 대화 단계를 가져옵니다.
  const match = step.choices.find(choice => choice[1].replace(/\s/g,"") === text); // 한국어 선택지와 정확히 일치하는지 확인합니다.
  if (match) { // 일치하는 선택지가 있으면 실행합니다.
    chooseAnswer(match); // 해당 선택지를 선택합니다.
  } else { // 일치하는 선택지가 없으면 실행합니다.
    document.getElementById("status").textContent = "Please choose one of the responses for now."; // 현재는 선택지로 답하도록 안내합니다.
  } // 입력 확인을 종료합니다.
  input.value = ""; // 입력창을 비웁니다.
} // 입력 함수를 종료합니다.

function listen(mode) { // 음성 인식을 시작하는 함수입니다.
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; // 브라우저 음성 인식 기능을 확인합니다.
  if (!SpeechRecognition) { // 음성 인식이 지원되지 않는 경우입니다.
    document.getElementById("status").textContent = "Speech recognition is not supported here."; // 지원되지 않는다고 표시합니다.
    return; // 함수를 종료합니다.
  } // 지원 여부 확인을 종료합니다.

  const recognition = new SpeechRecognition(); // 음성 인식 객체를 만듭니다.
  recognition.lang = "ko-KR"; // 한국어 인식으로 설정합니다.
  recognition.interimResults = false; // 최종 결과만 받습니다.
  document.getElementById("status").textContent = "Listening..."; // 듣기 상태를 표시합니다.

  recognition.onresult = event => { // 음성 인식 결과가 도착하면 실행합니다.
    const spoken = event.results[0][0].transcript; // 인식된 문장을 가져옵니다.
    document.getElementById("status").textContent = "Recognized: " + spoken; // 인식 결과를 표시합니다.
    if (mode === "user") { // 사용자 음성 입력인지 확인합니다.
      document.getElementById("userInput").value = spoken; // 인식한 문장을 입력창에 넣습니다.
      submitText(); // 선택지와 비교합니다.
    } else { // 직원 음성 입력인 경우입니다.
      document.getElementById("status").textContent = "Staff audio recognized: " + spoken + ". Choose the matching response."; // 직원 발화를 인식했다고 안내합니다.
    } // 음성 모드 확인을 종료합니다.
  }; // 인식 결과 처리를 종료합니다.

  recognition.onerror = event => { // 음성 인식 오류가 발생하면 실행합니다.
    document.getElementById("status").textContent = "Error: " + event.error; // 오류 메시지를 표시합니다.
  }; // 오류 처리를 종료합니다.

  recognition.start(); // 음성 인식을 시작합니다.
} // 음성 인식 함수를 종료합니다.

function goPlaces() { // 장소 선택 화면으로 돌아갑니다.
  showScreen("places"); // 장소 화면을 표시합니다.
} // 장소 이동 함수를 종료합니다.

function goScenarios() { // 상황 선택 화면으로 돌아갑니다.
  renderScenarios(); // 현재 장소의 상황 목록을 다시 표시합니다.
  showScreen("scenarios"); // 상황 화면을 표시합니다.
} // 상황 이동 함수를 종료합니다.

document.getElementById("userInput").addEventListener("keydown",event => { // 입력창 키보드를 감지합니다.
  if (event.key === "Enter") submitText(); // Enter를 누르면 전송합니다.
}); // 키보드 이벤트 설정을 종료합니다.

</script> <!-- JavaScript를 종료합니다. -->
</body> <!-- 화면 내용을 종료합니다. -->
