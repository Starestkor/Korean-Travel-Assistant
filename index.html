
<!DOCTYPE html> <!-- HTML 문서의 시작입니다. -->
<html lang="en"> <!-- 기본 화면 언어를 영어로 설정합니다. -->
<head> <!-- 문서 설정을 시작합니다. -->
<meta charset="UTF-8"> <!-- 한글과 다국어 문자를 표시합니다. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면에 맞춥니다. -->
<title>Seoul Moments</title> <!-- 브라우저 탭에 표시할 제목입니다. -->

<style> /* 화면 디자인을 설정하는 CSS입니다. */
*{box-sizing:border-box} /* 모든 요소의 크기 계산 방식을 통일합니다. */
body{margin:0;min-height:100vh;font-family:"Avenir Next","Segoe UI",sans-serif;color:#58647b;background:linear-gradient(135deg,#f1edf9,#eaf2f8 48%,#f9edf1);background-attachment:fixed} /* 파스텔 배경과 기본 글꼴을 설정합니다. */
button,input{font:inherit} /* 버튼과 입력창의 글꼴을 통일합니다. */
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation} /* 버튼의 터치 반응을 개선합니다. */
.app{width:min(100% - 28px,760px);margin:auto;padding:25px 0 40px} /* 앱의 전체 너비와 바깥 여백을 설정합니다. */
.header{display:flex;justify-content:space-between;align-items:center;padding:5px 4px 22px} /* 상단 제목과 아이콘을 양쪽에 배치합니다. */
.logo{font-family:Georgia,serif;font-size:27px;letter-spacing:-1px;color:#586784} /* 앱 로고의 글꼴과 색상을 설정합니다. */
.header-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ffffff99;border:1px solid white;box-shadow:0 7px 20px #64739622;color:#a18cb9} /* 상단 장식 아이콘을 둥글게 만듭니다. */
.main{border-radius:28px;padding:22px;min-height:540px;background:#ffffff88;border:1px solid #ffffffd9;backdrop-filter:blur(20px);box-shadow:0 20px 55px #68749629,inset 0 1px 0 white} /* 메인 유리 카드의 모양을 설정합니다. */
.heading{font-family:Georgia,serif;font-size:27px;font-weight:500;margin:4px 0 7px;color:#596a88} /* 화면 제목의 디자인을 설정합니다. */
.subheading{margin:0 0 20px;color:#9997ab;font-size:12px} /* 제목 아래 안내 문구를 설정합니다. */
.section-title{font-size:15px;color:#71809d;margin:22px 0 10px;font-weight:700} /* 작은 섹션 제목을 설정합니다. */
.language-wrap{margin:0 0 18px} /* 언어 선택 영역의 여백을 설정합니다. */
.language-label{display:block;font-size:12px;color:#8992aa;margin-bottom:7px;font-weight:650} /* 언어 선택 안내 문구를 설정합니다. */
.language-select{width:100%;padding:12px 14px;border:1px solid white;border-radius:14px;background:#ffffffb8;color:#64748e;box-shadow:0 7px 18px #6473961c;outline:none} /* 언어 선택 메뉴를 꾸밉니다. */
.place-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px} /* 장소 카드를 두 열로 배치합니다. */
.place-card{position:relative;height:140px;border:1px solid white;border-radius:19px;overflow:hidden;padding:0;background:#e8eaf3;box-shadow:0 10px 25px #6473962b;display:block;width:100%;isolation:isolate} /* 장소 카드의 크기와 터치 영역을 설정합니다. */
.place-card img{width:100%;height:100%;object-fit:cover;display:block;opacity:.88;pointer-events:none} /* 사진이 카드에 꽉 차고 터치를 방해하지 않도록 합니다. */
.place-overlay{position:absolute;inset:0;background:linear-gradient(transparent 35%,#2631418c);pointer-events:none} /* 사진 아래쪽에 어두운 그라데이션을 넣습니다. */
.place-name{position:absolute;left:15px;bottom:14px;color:white;font-size:16px;font-weight:700;text-shadow:0 2px 8px #0004;pointer-events:none} /* 사진 위에 장소 이름을 표시합니다. */
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:15px} /* 학습 카테고리를 두 열로 배치합니다. */
.feature-card{border:1px solid white;border-radius:17px;padding:15px;background:#ffffffa6;text-align:left;box-shadow:0 8px 20px #6473961c;color:#657590;width:100%;display:block;touch-action:manipulation} /* 학습 카테고리 카드의 디자인과 터치 영역을 설정합니다. */
.feature-icon{font-size:24px;display:block;margin-bottom:8px;pointer-events:none} /* 학습 카테고리 아이콘을 표시합니다. */
.feature-name{font-size:14px;font-weight:700;display:block;pointer-events:none} /* 학습 카테고리 이름을 표시합니다. */
.feature-desc{font-size:11px;color:#9997ab;display:block;margin-top:5px;line-height:1.4;pointer-events:none} /* 학습 카테고리 설명을 표시합니다. */
.back-button{border:0;background:transparent;color:#8d91ad;padding:4px 0 17px;font-size:13px} /* 뒤로 가기 버튼을 꾸밉니다. */
.scenario-list,.item-list{display:flex;flex-direction:column;gap:11px} /* 상황과 학습 항목을 세로로 배치합니다. */
.scenario-card,.item-card{display:flex;align-items:center;gap:14px;width:100%;padding:15px;border-radius:17px;border:1px solid white;background:#ffffffa6;box-shadow:0 9px 23px #69769620;text-align:left;color:#64748e} /* 상황과 학습 항목 카드를 꾸밉니다. */
.scenario-icon{width:44px;height:44px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#f1ecfa,#e5f0f5);font-size:22px} /* 상황 아이콘의 크기와 배경을 설정합니다. */
.scenario-text{flex:1} /* 상황 카드의 글 영역이 남은 공간을 차지하게 합니다. */
.scenario-name{font-size:14px;font-weight:700;display:block} /* 상황 이름을 강조합니다. */
.scenario-description{font-size:11px;color:#a09db2;margin-top:4px;display:block} /* 상황 설명을 작게 표시합니다. */
.arrow{color:#a99abc;font-size:20px} /* 오른쪽 화살표를 꾸밉니다. */
.dialogue-card{padding:21px;border-radius:23px;background:linear-gradient(145deg,#f0f5ffe0,#ffffffa6);border:1px solid white;box-shadow:0 15px 34px #6980af2b,inset 0 1px 0 white} /* 대화 문장을 담는 카드를 꾸밉니다. */
.speaker{color:#d49aa5;font-size:10px;letter-spacing:2px;font-weight:750;margin-bottom:13px} /* 말하는 사람 표시를 꾸밉니다. */
.english{color:#668ac5;font-size:15px;font-weight:600;line-height:1.55;margin-bottom:10px} /* 영어 문장을 표시합니다. */
.korean{color:#639879;font-size:22px;font-weight:700;line-height:1.55;word-break:keep-all} /* 한국어 문장을 크게 표시합니다. */
.roman{color:#a18ab9;font-size:13px;font-style:italic;margin-top:9px;line-height:1.5} /* 한국어 발음을 표시합니다. */
.choice-list{display:flex;flex-direction:column;gap:10px;margin-top:17px} /* 대화 선택지를 세로로 배치합니다. */
.choice{width:100%;padding:14px 16px;border:1px solid white;border-radius:16px;background:#ffffffb0;text-align:left;box-shadow:0 8px 20px #7080a026} /* 대화 선택지의 모양을 설정합니다. */
.choice-en,.choice-ko,.choice-ro{display:block;line-height:1.45} /* 선택지의 각 언어를 줄 단위로 표시합니다. */
.choice-en{font-size:13px;font-weight:600;color:#668ac5;margin-bottom:5px} /* 선택지 영어를 표시합니다. */
.choice-ko{font-size:16px;font-weight:700;color:#639879;margin-bottom:4px} /* 선택지 한국어를 표시합니다. */
.choice-ro{font-size:11px;color:#a18ab9;font-style:italic} /* 선택지 발음을 표시합니다. */
.input-row{display:flex;gap:8px;margin-top:13px} /* 직접 입력창과 전송 버튼을 나란히 둡니다. */
.input-row input{flex:1;min-width:0;padding:12px;border:1px solid white;border-radius:13px;background:#ffffffb3;color:#5d718e;outline:none} /* 직접 입력창의 모양을 설정합니다. */
.send-button{border:1px solid white;border-radius:13px;padding:0 16px;background:linear-gradient(135deg,#dce9f8,#e9e0f5);color:#687a9a;box-shadow:0 6px 15px #7080a022} /* 전송 버튼의 모양을 설정합니다. */
.tools{display:flex;gap:9px;margin-top:15px} /* 음성 버튼을 나란히 배치합니다. */
.tool-button{flex:1;padding:12px 8px;border:1px solid white;border-radius:14px;background:#ffffff9e;color:#7d89a8;font-size:12px} /* 음성 버튼을 꾸밉니다. */
.status{color:#9997ab;font-size:11px;margin-top:11px;min-height:17px} /* 입력 및 음성 상태를 표시합니다. */
.item-card{display:block;padding:16px} /* 표현과 문법 카드를 세로형으로 표시합니다. */
.item-en{color:#668ac5;font-size:13px;font-weight:600;margin-bottom:6px} /* 표현의 영어 번역을 표시합니다. */
.item-ko{color:#639879;font-size:19px;font-weight:700;line-height:1.5} /* 표현의 한국어 문장을 표시합니다. */
.item-ro{color:#a18ab9;font-size:12px;font-style:italic;margin-top:5px} /* 표현의 로마자 발음을 표시합니다. */
.item-note{color:#8d91a7;font-size:11px;margin-top:8px;line-height:1.5} /* 문법 설명을 표시합니다. */
.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#eeeaf7;color:#8d80a8;font-size:10px;margin-bottom:8px} /* 분류 태그를 표시합니다. */
.hidden{display:none!important} /* hidden 클래스가 붙은 화면을 숨깁니다. */
@media(max-width:420px){.main{padding:16px}.place-card{height:125px}.heading{font-size:24px}.korean{font-size:21px}.dialogue-card{padding:18px}} /* 작은 모바일 화면에서 여백과 글자 크기를 조절합니다. */
</style> <!-- CSS 디자인을 종료합니다. -->
</head> <!-- 문서 설정을 종료합니다. -->

<body> <!-- 화면 내용을 시작합니다. -->
<main class="app"> <!-- 앱 전체 영역입니다. -->
<header class="header"> <!-- 앱 상단 영역입니다. -->
<div class="logo">Seoul Moments</div> <!-- 앱 이름입니다. -->
<div class="header-icon">✦</div> <!-- 장식 아이콘입니다. -->
</header> <!-- 앱 상단 영역을 종료합니다. -->

<section class="main"> <!-- 메인 콘텐츠 영역입니다. -->
<section id="home"> <!-- 첫 화면을 시작합니다. -->
<h1 class="heading" id="homeTitle">Where to?</h1> <!-- 장소 선택 제목입니다. -->
<p class="subheading" id="homeSubheading">Choose a place or learn useful Korean</p> <!-- 첫 화면 안내입니다. -->

<div class="language-wrap"> <!-- 사용할 언어를 선택하는 영역입니다. -->
<label class="language-label" id="languageLabel" for="languageSelect">Choose your language</label> <!-- 언어 선택 안내 문구입니다. -->
<select class="language-select" id="languageSelect" onchange="setLanguage(this.value)"> <!-- 사용자의 언어를 선택합니다. -->
<option value="en">English</option> <!-- 영어를 선택합니다. -->
<option value="es">Español</option> <!-- 스페인어를 선택합니다. -->
<option value="zh">中文（简体）</option> <!-- 중국어 간체를 선택합니다. -->
<option value="ja">日本語</option> <!-- 일본어를 선택합니다. -->
<option value="fr">Français</option> <!-- 프랑스어를 선택합니다. -->
<option value="de">Deutsch</option> <!-- 독일어를 선택합니다. -->
<option value="ar">العربية</option> <!-- 아랍어를 선택합니다. -->
<option value="pt">Português</option> <!-- 포르투갈어를 선택합니다. -->
<option value="ru">Русский</option> <!-- 러시아어를 선택합니다. -->
<option value="vi">Tiếng Việt</option> <!-- 베트남어를 선택합니다. -->
</select> <!-- 언어 선택 메뉴를 종료합니다. -->
</div> <!-- 언어 선택 영역을 종료합니다. -->

<div class="place-grid"> <!-- 장소 선택 카드를 배치합니다. -->
<button class="place-card" onclick="selectPlace('cafe')"><img src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=700" alt="Cafe"><span class="place-overlay"></span><span class="place-name">Cafe</span></button> <!-- 카페를 선택합니다. -->
<button class="place-card" onclick="selectPlace('restaurant')"><img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=700" alt="Restaurant"><span class="place-overlay"></span><span class="place-name">Restaurant</span></button> <!-- 식당을 선택합니다. -->
<button class="place-card" onclick="selectPlace('transport')"><img src="https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=700" alt="Transport"><span class="place-overlay"></span><span class="place-name">Transport</span></button> <!-- 교통을 선택합니다. -->
<button class="place-card" onclick="selectPlace('shopping')"><img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=700" alt="Shopping"><span class="place-overlay"></span><span class="place-name">Shopping</span></button> <!-- 쇼핑을 선택합니다. -->
<button class="place-card" onclick="selectPlace('stay')"><img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=700" alt="Accommodation"><span class="place-overlay"></span><span class="place-name">Stay</span></button> <!-- 숙소를 선택합니다. -->
</div> <!-- 장소 카드 영역을 종료합니다. -->

<h2 class="section-title" id="learnTitle">Learn Korean</h2> <!-- 학습 카테고리 제목입니다. -->
<div class="feature-grid"> <!-- 학습 카테고리 카드를 배치합니다. -->
<button class="feature-card" onclick="openLibrary('expressions')"><span class="feature-icon">🗣️</span><span class="feature-name" id="featureExpressions">Essential Expressions</span><span class="feature-desc" id="featureExpressionsDesc">Useful phrases for everyday situations</span></button> <!-- 공통 표현으로 이동합니다. -->
<button class="feature-card" onclick="openLibrary('grammar')"><span class="feature-icon">📖</span><span class="feature-name" id="featureGrammar">Useful Grammar</span><span class="feature-desc" id="featureGrammarDesc">Practical grammar with travel examples</span></button> <!-- 실전 문법으로 이동합니다. -->
<button class="feature-card" onclick="openLibrary('dietary')"><span class="feature-icon">🥗</span><span class="feature-name" id="featureDietary">Dietary Needs</span><span class="feature-desc" id="featureDietaryDesc">Vegetarian, vegan, halal and gluten-free</span></button> <!-- 식이 제한 표현으로 이동합니다. -->
<button class="feature-card" onclick="openLibrary('all')"><span class="feature-icon">✨</span><span class="feature-name" id="featureAll">All Learning Materials</span><span class="feature-desc" id="featureAllDesc">Browse all expressions and grammar</span></button> <!-- 전체 학습 자료로 이동합니다. -->
</div> <!-- 학습 카테고리 영역을 종료합니다. -->
</section> <!-- 첫 화면을 종료합니다. -->

<section id="scenarios" class="hidden"> <!-- 장소별 상황 선택 화면입니다. -->
<button class="back-button" onclick="goHome()">← Back</button> <!-- 첫 화면으로 돌아갑니다. -->
<h1 class="heading" id="placeHeading"></h1> <!-- 선택한 장소 이름을 표시합니다. -->
<p class="subheading" id="scenarioSubheading">Choose a situation</p> <!-- 상황 선택 안내입니다. -->
<div class="scenario-list" id="scenarioList"></div> <!-- 장소별 상황 목록이 표시됩니다. -->
</section> <!-- 상황 선택 화면을 종료합니다. -->

<section id="conversation" class="hidden"> <!-- 대화 학습 화면입니다. -->
<button class="back-button" onclick="goScenarios()">← Back</button> <!-- 상황 목록으로 돌아갑니다. -->
<h1 class="heading" id="conversationHeading"></h1> <!-- 선택한 상황 제목을 표시합니다. -->
<div class="dialogue-card"> <!-- 대화 문장을 보여주는 카드입니다. -->
<div class="speaker" id="speaker">STAFF</div> <!-- 말하는 사람을 표시합니다. -->
<div class="english" id="english"></div> <!-- 영어 문장을 표시합니다. -->
<div class="korean" id="korean"></div> <!-- 한국어 문장을 표시합니다. -->
<div class="roman" id="roman"></div> <!-- 발음을 표시합니다. -->
</div> <!-- 대화 카드 영역을 종료합니다. -->
<div class="choice-list" id="choices"></div> <!-- 대화 선택지를 표시합니다. -->
<div class="input-row"><input id="userInput" type="text" placeholder="Type in what you want to ask..."><button class="send-button" onclick="submitText()">Send</button></div> <!-- 직접 문장을 입력하고 전송합니다. -->
<div class="tools"><button class="tool-button" onclick="listen()">🎙 Speak</button><button class="tool-button" onclick="speakCurrent()">🔊 Listen</button></div> <!-- 음성 입력과 문장 듣기 버튼입니다. -->
<div class="status" id="status">Choose a response or type a phrase.</div> <!-- 현재 상태를 안내합니다. -->
</section> <!-- 대화 화면을 종료합니다. -->

<section id="library" class="hidden"> <!-- 학습 자료 화면입니다. -->
<button class="back-button" onclick="goHome()">← Back</button> <!-- 첫 화면으로 돌아갑니다. -->
<h1 class="heading" id="libraryHeading">Learning Materials</h1> <!-- 학습 자료 제목입니다. -->
<p class="subheading" id="librarySubheading">Useful Korean for your trip</p> <!-- 학습 자료 안내입니다. -->
<div class="item-list" id="libraryList"></div> <!-- 학습 자료 목록을 표시합니다. -->
</section> <!-- 학습 자료 화면을 종료합니다. -->

</section> <!-- 메인 콘텐츠 영역을 종료합니다. -->
</main> <!-- 앱 전체 영역을 종료합니다. -->

<!-- 다음 부분에서 JavaScript 데이터와 기능을 이어 붙입니다. -->
 <script>
// 장소별 상황과 대화 데이터를 저장하는 배열입니다.
const appData = [ // 전체 장소 데이터를 시작합니다.

// 카페의 상황 3개입니다.
{ place:"cafe", scenarios:[ // 카페 상황 목록을 시작합니다.
{ id:"cafe_order", title:"Ordering a Drink", description:"Order coffee or tea", icon:"☕", dialogues:[ // 음료 주문 상황입니다.
{ speaker:"STAFF", en:"What would you like to order?", ko:"무엇을 주문하시겠어요?", roman:"Mueoseul jumunhasigesseoyo?", choices:[ // 직원의 질문에 답하는 선택지입니다.

let currentDialogueIndex = 0; // 첫 번째 대화부터 시작합니다.

// 현재 선택된 화면 언어를 저장합니다.

// 화면에 표시할 장소 이름을 저장합니다.
const placeNames = { // 장소 이름 데이터를 시작합니다.
cafe:"Cafe", // 카페입니다.
restaurant:"Restaurant", // 식당입니다.
transport:"Transport", // 교통입니다.
shopping:"Shopping", // 쇼핑입니다.
stay:"Accommodation" // 숙소입니다.
}; // 장소 이름 데이터를 종료합니다.

// 화면에 표시할 상황 목록을 찾는 함수입니다.
function findPlace(placeId){ // 장소 ID를 전달받습니다.
return appData.find(place => place.place === placeId); // 해당 장소의 데이터를 찾아 반환합니다.
} // 장소 검색 함수를 종료합니다.

// 화면에 표시할 상황을 찾는 함수입니다.
function findScenario(scenarioId){ // 상황 ID를 전달받습니다.
const placeData = findPlace(currentPlace); // 현재 선택한 장소의 데이터를 찾습니다.
if(!placeData) return null; // 장소가 없으면 null을 반환합니다.
return placeData.scenarios.find(item => item.id === scenarioId); // 상황 ID가 같은 데이터를 반환합니다.
} // 상황 검색 함수를 종료합니다.

// 특정 화면만 보이게 만드는 함수입니다.
function showScreen(screenId){ // 표시할 화면의 ID를 전달받습니다.
const screenIds = ["home","scenarios","conversation","library"]; // 앱에 있는 화면 ID를 저장합니다.
screenIds.forEach(id => { // 모든 화면을 하나씩 확인합니다.
document.getElementById(id).classList.toggle("hidden",id !== screenId); // 선택한 화면만 표시합니다.
}); // 화면 반복을 종료합니다.
} // 화면 전환 함수를 종료합니다.

// 장소를 선택했을 때 실행하는 함수입니다.
function selectPlace(placeId){ // 사용자가 선택한 장소 ID를 전달받습니다.
currentPlace = placeId; // 현재 장소를 저장합니다.
const placeData = findPlace(placeId); // 해당 장소의 상황 데이터를 찾습니다.
if(!placeData) return; // 데이터가 없으면 함수를 종료합니다.
document.getElementById("placeHeading").textContent = getPlaceName(placeId); // 장소 이름을 화면에 표시합니다.
renderScenarios(placeData.scenarios); // 장소에 맞는 상황 목록을 화면에 표시합니다.
showScreen("scenarios"); // 상황 선택 화면으로 이동합니다.
} // 장소 선택 함수를 종료합니다.

// 장소별 상황 목록을 화면에 만드는 함수입니다.
function renderScenarios(scenarios){ // 상황 데이터 배열을 전달받습니다.
const list = document.getElementById("scenarioList"); // 상황 목록이 들어갈 HTML 요소를 찾습니다.
list.innerHTML = ""; // 이전에 표시된 상황을 비웁니다.
scenarios.forEach(scenario => { // 상황 데이터를 하나씩 반복합니다.
const button = document.createElement("button"); // 새로운 버튼을 만듭니다.
button.className = "scenario-card"; // 상황 카드 디자인을 적용합니다.
button.innerHTML = `<span class="scenario-icon">${scenario.icon}</span><span class="scenario-text"><span class="scenario-name">${scenario.title}</span><span class="scenario-description">${scenario.description}</span></span><span class="arrow">›</span>`; // 아이콘과 상황 이름과 설명을 표시합니다.
button.addEventListener("click", () => selectScenario(scenario.id)); // 버튼을 누르면 해당 상황을 선택합니다.
list.appendChild(button); // 새 버튼을 상황 목록에 추가합니다.
}); // 모든 상황을 반복해서 표시합니다.
} // 상황 목록 표시 함수를 종료합니다.

// 상황을 선택했을 때 실행하는 함수입니다.
function selectScenario(scenarioId){ // 선택한 상황의 ID를 전달받습니다.
currentScenario = findScenario(scenarioId); // 선택한 상황의 데이터를 저장합니다.
currentDialogueIndex = 0; // 대화 순서를 처음으로 초기화합니다.
if(!currentScenario) return; // 상황 데이터가 없으면 종료합니다.
document.getElementById("conversationHeading").textContent = currentScenario.title; // 대화 화면의 제목을 표시합니다.
renderDialogue(); // 첫 번째 대화 문장을 화면에 표시합니다.
showScreen("conversation"); // 대화 화면으로 이동합니다.
} // 상황 선택 함수를 종료합니다.

// 현재 대화 문장을 화면에 표시하는 함수입니다.
function renderDialogue(){ // 현재 대화 정보를 화면에 표시합니다.
if(!currentScenario) return; // 선택된 상황이 없으면 종료합니다.
const dialogues = currentScenario.dialogues; // 현재 상황의 대화 목록을 가져옵니다.
const dialogue = dialogues[currentDialogueIndex]; // 현재 순서의 대화를 가져옵니다.
if(!dialogue) return; // 대화 데이터가 없으면 종료합니다.
document.getElementById("speaker").textContent = dialogue.speaker; // 말하는 사람이 누구인지 표시합니다.
document.getElementById("english").textContent = dialogue.en; // 영어 문장을 표시합니다.
document.getElementById("korean").textContent = dialogue.ko; // 한국어 문장을 표시합니다.
document.getElementById("roman").textContent = dialogue.roman; // 로마자 발음을 표시합니다.
const choiceBox = document.getElementById("choices"); // 선택지가 들어갈 영역을 찾습니다.
choiceBox.innerHTML = ""; // 이전 선택지를 지웁니다.
dialogue.choices.forEach(choice => { // 모든 선택지를 하나씩 반복합니다.
const button = document.createElement("button"); // 선택지 버튼을 만듭니다.
button.className = "choice"; // 선택지 디자인을 적용합니다.
button.innerHTML = `<span class="choice-en">${choice.en}</span><span class="choice-ko">${choice.ko}</span><span class="choice-ro">${choice.roman}</span>`; // 영어와 한국어와 발음을 표시합니다.
button.addEventListener("click", () => selectChoice(choice)); // 선택하면 해당 문장을 선택 처리합니다.

document.getElementById("placeHeading").textContent = getPlaceName(currentPlace); // 선택한 장소 제목을 번역합니다.

} // 선택된 장소 확인을 종료합니다.
if(currentScenario){ // 선택된 상황이 있는지 확인합니다.
document.getElementById("conversationHeading").textContent = getScenarioName(currentScenario); // 대화 제목을 번역합니다.
} // 선택된 상황 확인을 종료합니다.
if(!document.getElementById("library").classList.contains("hidden")) openLibrary(currentLibrary); // 학습 자료 화면이 열려 있으면 다시 표시합니다.
} // 언어 변경 함수를 종료합니다.

// 상황 이름을 현재 언어로 가져옵니다.
function getScenarioName(scenario){ // 상황 데이터를 전달받습니다.
const translated = scenarioNames[scenario.id]; // 해당 상황의 번역 데이터를 찾습니다.
return currentLanguage === "en" ? scenario.title : (translated && translated[currentLanguage]) || scenario.title; // 번역이 있으면 번역하고 없으면 영어 제목을 표시합니다.
} // 상황 이름 함수를 종료합니다.

// 상황 목록을 현재 언어로 표시하도록 기존 함수를 보완합니다.
const originalRenderScenarios = renderScenarios; // 기존 상황 표시 함수를 보관합니다.
renderScenarios = function(scenarios){ // 상황 목록을 다시 표시하는 함수를 만듭니다.
const list = document.getElementById("scenarioList"); // 상황 목록 영역을 찾습니다.
list.innerHTML = ""; // 기존 목록을 비웁니다.
scenarios.forEach(scenario => { // 모든 상황을 반복합니다.
const button = document.createElement("button"); // 상황 버튼을 만듭니다.
button.className = "scenario-card"; // 상황 카드 디자인을 적용합니다.
const translatedTitle = getScenarioName(scenario); // 번역된 상황 이름을 가져옵니다.
button.innerHTML = `<span class="scenario-icon">${scenario.icon}</span><span class="scenario-text"><span class="scenario-name"></span><span class="scenario-description"></span></span><span class="arrow">›</span>`; // 상황 카드의 내부 구조를 만듭니다.
button.querySelector(".scenario-name").textContent = translatedTitle; // 상황 제목을 안전하게 표시합니다.
button.querySelector(".scenario-description").textContent = currentLanguage === "en" ? scenario.description : translatedTitle; // 다른 언어에서는 번역된 제목을 설명 영역에도 표시합니다.
button.addEventListener("click", () => selectScenario(scenario.id)); // 버튼을 누르면 해당 상황으로 이동합니다.
list.appendChild(button); // 상황 버튼을 화면에 추가합니다.
}); // 상황 반복을 종료합니다.
}; // 상황 목록 번역 함수를 종료합니다.

// 현재 학습 자료의 분류를 저장합니다.
let currentLibrary = "all"; // 기본 학습 자료 분류는 전체입니다.

// 학습 자료를 저장합니다.
const learningMaterials = { // 학습 자료 데이터를 시작합니다.

{en:"Could I have this, please?",ko:"이거 주세요.",roman:"Igeo juseyo.",note:"물건이나 음식을 요청할 때 사용합니다."}, // 이거 주세요입니다.
{en:"How much is this?",ko:"이거 얼마예요?",roman:"Igeo eolmayeyo?",note:"가격을 물어볼 때 사용합니다."}, // 얼마예요입니다.
{en:"Thank you.",ko:"감사합니다.",roman:"Gamsahamnida.",note:"감사를 표현하는 공손한 표현입니다."}, // 감사합니다입니다.
{en:"I'm sorry.",ko:"죄송합니다.",roman:"Joesonghamnida.",note:"사과하거나 양해를 구할 때 사용합니다."}, // 죄송합니다입니다.
{en:"It's okay.",ko:"괜찮아요.",roman:"Gwaenchanayo.",note:"상대방을 안심시키거나 괜찮다고 말할 때 사용합니다."}, // 괜찮아요입니다.
{en:"Just a moment, please.",ko:"잠시만요.",roman:"Jamsimanyo.",note:"잠깐 기다려 달라고 할 때 사용합니다."}, // 잠시만요입니다.
{en:"Could you say that again?",ko:"다시 말씀해 주세요.",roman:"Dasi malsseumhae juseyo.",note:"상대방의 말을 다시 듣고 싶을 때 사용합니다."}, // 다시 말씀해 주세요입니다.
{en:"Do you have this?",ko:"이거 있어요?",roman:"Igeo isseoyo?",note:"상품이나 메뉴가 있는지 물어볼 때 사용합니다."}, // 이거 있어요입니다.
{en:"Where is the restroom?",ko:"화장실이 어디예요?",roman:"Hwajangsiri eodiyeyo?",note:"화장실 위치를 물어볼 때 사용합니다."}, // 화장실이 어디예요입니다.
{en:"A little, please.",ko:"조금만 주세요.",roman:"Jogeumman juseyo.",note:"양을 조금만 달라고 요청할 때 사용합니다."} // 조금만 주세요입니다.
], // 공통 표현 목록을 종료합니다.
grammar:[ // 여행에 유용한 문법입니다.
{en:"May I ...?",ko:"-아/어도 돼요?",roman:"-ado / -eodo dwaeyo?",note:"허락을 구할 때 사용합니다. 예: 여기 앉아도 돼요? — May I sit here?"}, // 허락을 구하는 문법입니다.
{en:"Can I try ...?",ko:"-아/어 봐도 돼요?",roman:"-a / -eo bwado dwaeyo?",note:"무언가를 시도해도 되는지 물어봅니다. 예: 입어 봐도 돼요? — Can I try it on?"}, // 시도 허락 문법입니다.
{en:"Shouldn't I ...?",ko:"-(으)면 안 돼요?",roman:"-(eu)myeon an dwaeyo?",note:"어떤 행동이 금지되는지 확인할 때 사용합니다."}, // 금지 확인 문법입니다.
{en:"I know how to ...",ko:"-(으)ㄹ 줄 알아요.",roman:"-(eu)l jul arayo.",note:"어떤 일을 할 줄 안다고 말합니다."}, // 능력 문법입니다.
{en:"I have to ...",ko:"-아/어야 돼요.",roman:"-aya / -eoya dwaeyo.",note:"필요하거나 의무적인 일을 말합니다."}, // 의무 문법입니다.
{en:"Please ...",ko:"-아/어 주세요.",roman:"-a / -eo juseyo.",note:"상대방에게 정중하게 부탁합니다."}, // 요청 문법입니다.
{en:"Try doing ...",ko:"-아/어 보다.",roman:"-a / -eo boda.",note:"어떤 행동을 시도하거나 경험하는 표현입니다."}, // 시도 문법입니다.
{en:"Have you ever ...?",ko:"-(으)ㄴ 적 있어요?",roman:"-(eu)n jeok isseoyo?",note:"과거에 경험한 적이 있는지 물어봅니다."} // 경험 문법입니다.
], // 문법 목록을 종료합니다.
dietary:[ // 식이 제한 관련 표현입니다.
{en:"I'm vegetarian.",ko:"저는 채식주의자예요.",roman:"Jeoneun chaesikjuuijayeyo.",note:"채식주의자임을 알릴 때 사용합니다."}, // 채식주의 표현입니다.
{en:"I'm vegan.",ko:"저는 비건이에요.",roman:"Jeoneun bigeonieyo.",note:"동물성 식품을 먹지 않는다고 알립니다."}, // 비건 표현입니다.
{en:"Is this halal?",ko:"이 음식은 할랄인가요?",roman:"I eumsigeun hallalingayo?",note:"할랄 여부를 확인합니다."}, // 할랄 표현입니다.
{en:"Is this gluten-free?",ko:"이 음식은 글루텐이 없나요?",roman:"I eumsigeun geulluteni eomnayo?",note:"글루텐 포함 여부를 확인합니다."}, // 글루텐 표현입니다.
{en:"Does this contain pork?",ko:"돼지고기가 들어가나요?",roman:"Dwaejigogiga deureoganayo?",note:"돼지고기 포함 여부를 확인합니다."}, // 돼지고기 표현입니다.
{en:"Does this contain pork broth or fat?",ko:"돼지고기 육수나 기름이 들어가나요?",roman:"Dwaejigogi yuksuna gireumi deureoganayo?",note:"육수와 기름도 확인합니다."}, // 육수 표현입니다.
{en:"Does this contain wheat?",ko:"밀이 들어가나요?",roman:"Miri deureoganayo?",note:"밀 포함 여부를 확인합니다."}, // 밀 표현입니다.
{en:"Do you have a meat-free dish?",ko:"고기가 들어가지 않는 메뉴가 있나요?",roman:"Gogiga deureogaji anneun menyuga innayo?",note:"고기가 없는 메뉴를 요청합니다."}, // 고기 없는 메뉴 표현입니다.
{en:"Could you check the ingredients?",ko:"재료를 확인해 주시겠어요?",roman:"Jaeryoreul hwaginhae jusigesseoyo?",note:"재료를 확인해 달라고 요청합니다."}, // 재료 확인 표현입니다.
{en:"Could there be cross-contact?",ko:"다른 음식과 접촉할 가능성이 있나요?",roman:"Dareun eumsikgwa jeopchokhal ganeungseongi innayo?",note:"알레르기가 있다면 교차 접촉 가능성도 확인해야 합니다. 안전을 보장할 수 없으므로 직원의 확인을 꼭 받으세요."} // 교차 접촉 표현입니다.
] // 식이 제한 목록을 종료합니다.
}; // 학습 자료 데이터를 종료합니다.

// 학습 자료 화면을 여는 함수입니다.
function openLibrary(category){ // 사용자가 선택한 학습 자료 분류를 전달받습니다.
currentLibrary = category; // 현재 분류를 저장합니다.
const list = document.getElementById("libraryList"); // 학습 자료 목록 영역을 찾습니다.
list.innerHTML = ""; // 기존 목록을 비웁니다.
let materials = []; // 표시할 학습 자료를 담을 배열을 만듭니다.
if(category === "all"){ // 전체 자료를 선택했는지 확인합니다.
materials = [...learningMaterials.expressions,...learningMaterials.grammar,...learningMaterials.dietary]; // 세 종류의 자료를 하나로 합칩니다.
}else{ // 특정 분류를 선택했다면 실행합니다.
materials = learningMaterials[category] || []; // 선택한 분류의 자료를 가져옵니다.
} // 분류 확인을 종료합니다.
materials.forEach(item => { // 모든 학습 자료를 반복합니다.
const card = document.createElement("article"); // 새로운 학습 자료 카드를 만듭니다.
card.className = "item-card"; // 카드 디자인을 적용합니다.
const english = document.createElement("div"); // 영어 문장을 담을 요소를 만듭니다.
english.className = "item-en"; // 영어 문장 디자인을 적용합니다.
english.textContent = item.en; // 영어 문장을 표시합니다.
const korean = document.createElement("div"); // 한국어 문장을 담을 요소를 만듭니다.
korean.className = "item-ko"; // 한국어 문장 디자인을 적용합니다.
korean.textContent = item.ko; // 한국어 문장을 표시합니다.
const roman = document.createElement("div"); // 발음을 담을 요소를 만듭니다.
roman.className = "item-ro"; // 발음 디자인을 적용합니다.
roman.textContent = item.roman; // 로마자 발음을 표시합니다.
const note = document.createElement("div"); // 설명을 담을 요소를 만듭니다.
note.className = "item-note"; // 설명 디자인을 적용합니다.
note.textContent = item.note; // 설명을 표시합니다.
const audioButton = document.createElement("button"); // 발음 듣기 버튼을 만듭니다.
audioButton.className = "tool-button"; // 발음 듣기 버튼 디자인을 적용합니다.
audioButton.textContent = "🔊 Listen"; // 버튼에 듣기 문구를 표시합니다.
audioButton.addEventListener("click",() => speakText(item.ko)); // 버튼을 누르면 한국어 발음을 읽습니다.
card.append(english,korean,roman,note,audioButton); // 문장과 설명과 버튼을 카드에 넣습니다.
list.appendChild(card); // 카드를 화면에 추가합니다.
}); // 학습 자료 반복을 종료합니다.
showScreen("library"); // 학습 자료 화면을 표시합니다.
} // 학습 자료 화면 함수를 종료합니다.

// 한국어 문장을 음성으로 읽는 공통 함수입니다.
function speakText(text){ // 읽을 문장을 전달받습니다.
if(!("speechSynthesis" in window)){ // 브라우저가 음성 읽기를 지원하는지 확인합니다.
document.getElementById("status").textContent = "Speech playback is not supported in this browser."; // 지원하지 않는다고 안내합니다.
return; // 함수 실행을 종료합니다.
} // 음성 지원 확인을 종료합니다.
window.speechSynthesis.cancel(); // 이전 음성 재생을 중단합니다.
const utterance = new SpeechSynthesisUtterance(text); // 읽을 문장을 음성 객체로 만듭니다.
utterance.lang = "ko-KR"; // 한국어 발음으로 설정합니다.
utterance.rate = 0.85; // 조금 천천히 읽도록 설정합니다.
window.speechSynthesis.speak(utterance); // 음성 재생을 시작합니다.
} // 음성 재생 함수를 종료합니다.

// 현재 화면의 한국어 문장을 읽는 함수입니다.
function speakCurrent(){ // 현재 문장을 읽습니다.
const korean = document.getElementById("korean").textContent; // 화면의 한국어 문장을 가져옵니다.
if(korean) speakText(korean); // 문장이 있으면 읽습니다.
} // 현재 문장 읽기 함수를 종료합니다.

// 사용자의 한국어 음성을 인식하는 함수입니다.
function listen(){ // 음성 인식을 시작합니다.
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition; // 브라우저의 음성 인식 기능을 찾습니다.
if(!Recognition){ // 음성 인식 기능이 없는지 확인합니다.
document.getElementById("status").textContent = "Speech recognition is not supported in this browser."; // 지원하지 않는다고 안내합니다.
return; // 함수 실행을 종료합니다.
} // 음성 인식 지원 확인을 종료합니다.
const recognition = new Recognition(); // 음성 인식 객체를 만듭니다.
recognition.lang = "ko-KR"; // 한국어 음성을 인식하도록 설정합니다.
recognition.interimResults = false; // 최종 인식 결과만 받도록 설정합니다.
recognition.onresult = event => { // 음성 인식 결과가 도착하면 실행합니다.
const result = event.results[0][0].transcript; // 인식된 문장을 가져옵니다.
document.getElementById("userInput").value = result; // 인식된 문장을 입력창에 넣습니다.
document.getElementById("status").textContent = "Speech recognized: " + result; // 인식 결과를 안내합니다.
}; // 음성 인식 결과 처리를 종료합니다.
recognition.onerror = () => { // 음성 인식 중 오류가 발생하면 실행합니다.
document.getElementById("status").textContent = "Could not recognize your speech. Please try again."; // 다시 시도하라고 안내합니다.
}; // 오류 처리를 종료합니다.
recognition.start(); // 음성 인식을 시작합니다.
} // 음성 인식 함수를 종료합니다.

// 입력창에서 엔터를 누르면 문장을 전송합니다.
document.getElementById("userInput").addEventListener("keydown",event => { // 입력창의 키보드 입력을 감지합니다.
if(event.key === "Enter") submitText(); // 엔터 키를 누르면 전송 함수를 실행합니다.
}); // 엔터 키 이벤트를 종료합니다.

// 처음 웹사이트를 열었을 때 영어 화면을 표시합니다.
setLanguage("en"); // 기본 언어를 영어로 설정합니다.

// 처음에는 홈 화면을 표시합니다.
showScreen("home"); // 첫 화면을 보여줍니다.

</script> <!-- JavaScript 코드를 종료합니다. -->
