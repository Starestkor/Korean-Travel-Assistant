

<!DOCTYPE html> <!-- HTML 문서의 시작 -->
<html lang="en" dir="ltr"> <!-- 기본 언어는 영어, 기본 방향은 왼쪽에서 오른쪽 -->
<head> <!-- 문서 설정 시작 -->
<meta charset="UTF-8"> <!-- 다국어 문자 지원 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면 최적화 -->
<title>Seoul Moments</title> <!-- 브라우저 탭 제목 -->

<style> /* CSS 디자인 시작 */
*{box-sizing:border-box} /* 모든 요소의 크기 계산 통일 */
body{margin:0;min-height:100vh;font-family:"Avenir Next","Segoe UI",sans-serif;color:#58647b;background:linear-gradient(135deg,#f1edf9,#eaf2f8 48%,#f9edf1);background-attachment:fixed} /* 전체 배경과 글꼴 */
button,input,select{font:inherit} /* 입력 요소의 글꼴 통일 */
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation} /* 버튼 터치 개선 */
.app{width:min(100% - 28px,760px);margin:auto;padding:25px 0 40px} /* 앱 전체 너비 */
.header{display:flex;justify-content:space-between;align-items:center;padding:5px 4px 22px} /* 상단 배치 */
.logo{font-family:Georgia,serif;font-size:27px;letter-spacing:-1px;color:#586784} /* 로고 디자인 */
.header-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ffffff99;border:1px solid white;box-shadow:0 7px 20px #64739622;color:#a18cb9} /* 상단 장식 */
.main{border-radius:28px;padding:22px;min-height:540px;background:#ffffff88;border:1px solid #ffffffd9;backdrop-filter:blur(20px);box-shadow:0 20px 55px #68749629,inset 0 1px 0 white} /* 메인 유리 카드 */
.heading{font-family:Georgia,serif;font-size:27px;font-weight:500;margin:4px 0 7px;color:#596a88} /* 화면 제목 */
.subheading{margin:0 0 20px;color:#9997ab;font-size:12px} /* 제목 설명 */
.section-title{font-size:15px;color:#71809d;margin:22px 0 10px;font-weight:700} /* 섹션 제목 */
.language-wrap{margin:0 0 18px} /* 언어 선택 여백 */
.language-label{display:block;font-size:12px;color:#8992aa;margin-bottom:7px;font-weight:650} /* 언어 안내 */
.language-select{width:100%;padding:12px 14px;border:1px solid white;border-radius:14px;background:#ffffffb8;color:#64748e;box-shadow:0 7px 18px #6473961c;outline:none} /* 언어 선택 메뉴 */
.place-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px} /* 장소 카드 배열 */
.place-card{position:relative;height:140px;border:1px solid white;border-radius:19px;overflow:hidden;padding:0;background:#e8eaf3;box-shadow:0 10px 25px #6473962b;display:block;width:100%;isolation:isolate} /* 장소 카드 */
.place-card img{width:100%;height:100%;object-fit:cover;display:block;opacity:.88;pointer-events:none} /* 카드 이미지 */
.place-overlay{position:absolute;inset:0;background:linear-gradient(transparent 35%,#2631418c);pointer-events:none} /* 이미지 그라데이션 */
.place-name{position:absolute;left:15px;bottom:14px;color:white;font-size:16px;font-weight:700;text-shadow:0 2px 8px #0004;pointer-events:none} /* 장소 이름 */
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:15px} /* 학습 카드 배열 */
.feature-card{border:1px solid white;border-radius:17px;padding:15px;background:#ffffffa6;text-align:left;box-shadow:0 8px 20px #6473961c;color:#657590;width:100%;display:block} /* 학습 카드 */
.feature-icon{font-size:24px;display:block;margin-bottom:8px;pointer-events:none} /* 학습 아이콘 */
.feature-name{font-size:14px;font-weight:700;display:block;pointer-events:none} /* 학습 이름 */
.feature-desc{font-size:11px;color:#9997ab;display:block;margin-top:5px;line-height:1.4;pointer-events:none} /* 학습 설명 */
.back-button{border:0;background:transparent;color:#8d91ad;padding:4px 0 17px;font-size:13px} /* 뒤로 가기 */
.scenario-list,.item-list{display:flex;flex-direction:column;gap:11px} /* 목록 세로 배열 */
.scenario-card,.item-card{display:flex;align-items:center;gap:14px;width:100%;padding:15px;border-radius:17px;border:1px solid white;background:#ffffffa6;box-shadow:0 9px 23px #69769620;text-align:left;color:#64748e} /* 상황 카드 */
.scenario-icon{width:44px;height:44px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#f1ecfa,#e5f0f5);font-size:22px} /* 상황 아이콘 */
.scenario-text{flex:1} /* 상황 설명 영역 */
.scenario-name{font-size:14px;font-weight:700;display:block} /* 상황 이름 */
.scenario-description{font-size:11px;color:#a09db2;margin-top:4px;display:block} /* 상황 설명 */
.arrow{color:#a99abc;font-size:20px} /* 이동 화살표 */
.dialogue-card{padding:21px;border-radius:23px;background:linear-gradient(145deg,#f0f5ffe0,#ffffffa6);border:1px solid white;box-shadow:0 15px 34px #6980af2b,inset 0 1px 0 white} /* 대화 카드 */
.speaker{color:#d49aa5;font-size:10px;letter-spacing:2px;font-weight:750;margin-bottom:13px} /* 화자 표시 */
.foreign-label,.korean-label,.pronunciation-label{color:#9296aa;font-size:10px;letter-spacing:1px;font-weight:700;margin:12px 0 7px} /* 대화 언어별 안내 */
.foreign{color:#668ac5;font-size:16px;font-weight:600;line-height:1.6;overflow-wrap:anywhere} /* 선택한 외국어 문장 */
.korean{color:#639879;font-size:22px;font-weight:700;line-height:1.55;word-break:keep-all} /* 한국어 문장 */
.pronunciation{color:#a18ab9;font-size:15px;font-style:italic;margin-top:8px;line-height:1.7;overflow-wrap:anywhere} /* 학습자 모국어 기반 발음 안내 */
.choice-list{display:flex;flex-direction:column;gap:10px;margin-top:17px} /* 선택지 배열 */
.choice{width:100%;padding:14px 16px;border:1px solid white;border-radius:16px;background:#ffffffb0;text-align:left;box-shadow:0 8px 20px #7080a026;color:#64748e} /* 선택지 카드 */
.choice-foreign,.choice-ko,.choice-pronunciation{display:block;line-height:1.5;overflow-wrap:anywhere} /* 선택지 내부 문장 */
.choice-foreign{font-size:13px;font-weight:600;color:#668ac5;margin-bottom:6px} /* 외국어 선택지 */
.choice-ko{font-size:16px;font-weight:700;color:#639879;margin-bottom:5px} /* 한국어 선택지 */
.choice-pronunciation{font-size:12px;color:#a18ab9;font-style:italic} /* 발음 선택지 */
.input-row{display:flex;gap:8px;margin-top:13px} /* 문장 입력 배열 */
.input-row input{flex:1;min-width:0;padding:12px;border:1px solid white;border-radius:13px;background:#ffffffb3;color:#5d718e;outline:none} /* 문장 입력창 */
.send-button{border:1px solid white;border-radius:13px;padding:0 16px;background:linear-gradient(135deg,#dce9f8,#e9e0f5);color:#687a9a;box-shadow:0 6px 15px #7080a022} /* 전송 버튼 */
.tools{display:flex;gap:9px;margin-top:15px} /* 음성 기능 배열 */
.tool-button{flex:1;padding:12px 8px;border:1px solid white;border-radius:14px;background:#ffffff9e;color:#7d89a8;font-size:12px} /* 음성 기능 버튼 */
.status{color:#9997ab;font-size:11px;margin-top:11px;min-height:17px;line-height:1.5} /* 상태 안내 */
.item-card{display:block;padding:16px} /* 학습 자료 카드 */
.item-en{color:#668ac5;font-size:13px;font-weight:600;margin-bottom:6px} /* 학습 외국어 */
.item-ko{color:#639879;font-size:19px;font-weight:700;line-height:1.5} /* 학습 한국어 */
.item-ro{color:#a18ab9;font-size:12px;font-style:italic;margin-top:5px} /* 학습 발음 */
.item-note{color:#8d91a7;font-size:11px;margin-top:8px;line-height:1.5} /* 학습 설명 */
.hidden{display:none!important} /* 화면 숨기기 */
[dir="rtl"] .place-name{left:auto;right:15px} /* 아랍어 장소 이름 위치 */
[dir="rtl"] .scenario-card,[dir="rtl"] .choice,[dir="rtl"] .feature-card{text-align:right} /* 아랍어 카드 글자 방향 */
[dir="rtl"] .arrow{transform:scaleX(-1)} /* 아랍어 화살표 방향 */
[dir="rtl"] .back-button{text-align:right} /* 아랍어 뒤로 가기 정렬 */
@media(max-width:420px){.main{padding:16px}.place-card{height:125px}.heading{font-size:24px}.korean{font-size:21px}.dialogue-card{padding:18px}} /* 작은 화면 최적화 */
</style> <!-- CSS 디자인 종료 -->
</head> <!-- 문서 설정 종료 -->

<body> <!-- 화면 본문 시작 -->
<main class="app"> <!-- 앱 전체 영역 시작 -->
<header class="header"> <!-- 상단 헤더 시작 -->
<div class="logo">Seoul Moments</div> <!-- 앱 로고 -->
<div class="header-icon">✦</div> <!-- 장식 아이콘 -->
</header> <!-- 상단 헤더 종료 -->

<section class="main"> <!-- 메인 카드 시작 -->
<section id="home"> <!-- 홈 화면 시작 -->
<h1 class="heading" id="homeTitle">Where to?</h1> <!-- 홈 제목 -->
<p class="subheading" id="homeSubheading">Choose a place or learn useful Korean</p> <!-- 홈 설명 -->

<div class="language-wrap"> <!-- 언어 선택 영역 시작 -->
<label class="language-label" id="languageLabel" for="languageSelect">Choose your language</label> <!-- 언어 선택 안내 -->
<select class="language-select" id="languageSelect" onchange="setLanguage(this.value)"> <!-- 언어 선택 메뉴 -->
<option value="en">English</option> <!-- 영어 -->
<option value="es">Español</option> <!-- 스페인어 -->
<option value="zh">中文（简体）</option> <!-- 중국어 간체 -->
<option value="ja">日本語</option> <!-- 일본어 -->
<option value="fr">Français</option> <!-- 프랑스어 -->
<option value="de">Deutsch</option> <!-- 독일어 -->
<option value="ar">العربية</option> <!-- 아랍어 -->
<option value="pt">Português</option> <!-- 포르투갈어 -->
<option value="ru">Русский</option> <!-- 러시아어 -->
<option value="vi">Tiếng Việt</option> <!-- 베트남어 -->
<option value="si">සිංහල</option> <!-- 싱할라어 -->
<option value="ne">नेपाली</option> <!-- 네팔어 -->
<option value="th">ไทย</option> <!-- 태국어 -->
</select> <!-- 언어 선택 메뉴 종료 -->
</div> <!-- 언어 선택 영역 종료 -->

<div class="place-grid"> <!-- 장소 카드 영역 시작 -->
<button class="place-card" onclick="selectPlace('cafe')"><img src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=700" alt="Cafe"><span class="place-overlay"></span><span class="place-name" data-place="cafe">Cafe</span></button> <!-- 카페 선택 -->
<button class="place-card" onclick="selectPlace('restaurant')"><img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=700" alt="Restaurant"><span class="place-overlay"></span><span class="place-name" data-place="restaurant">Restaurant</span></button> <!-- 식당 선택 -->
<button class="place-card" onclick="selectPlace('transport')"><img src="https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=700" alt="Transport"><span class="place-overlay"></span><span class="place-name" data-place="transport">Transport</span></button> <!-- 교통 선택 -->
<button class="place-card" onclick="selectPlace('shopping')"><img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=700" alt="Shopping"><span class="place-overlay"></span><span class="place-name" data-place="shopping">Shopping</span></button> <!-- 쇼핑 선택 -->
<button class="place-card" onclick="selectPlace('stay')"><img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=700" alt="Accommodation"><span class="place-overlay"></span><span class="place-name" data-place="stay">Stay</span></button> <!-- 숙소 선택 -->
</div> <!-- 장소 카드 영역 종료 -->

<h2 class="section-title" id="learnTitle">Learn Korean</h2> <!-- 학습 제목 -->
<div class="feature-grid"> <!-- 학습 메뉴 시작 -->
<button class="feature-card" onclick="openLibrary('expressions')"><span class="feature-icon">🗣️</span><span class="feature-name" id="featureExpressions">Essential Expressions</span><span class="feature-desc" id="featureExpressionsDesc">Useful phrases for everyday situations</span></button> <!-- 필수 표현 -->
<button class="feature-card" onclick="openLibrary('grammar')"><span class="feature-icon">📖</span><span class="feature-name" id="featureGrammar">Useful Grammar</span><span class="feature-desc" id="featureGrammarDesc">Practical grammar with travel examples</span></button> <!-- 실용 문법 -->
<button class="feature-card" onclick="openLibrary('dietary')"><span class="feature-icon">🥗</span><span class="feature-name" id="featureDietary">Dietary Needs</span><span class="feature-desc" id="featureDietaryDesc">Vegetarian, vegan, halal and gluten-free</span></button> <!-- 식이 제한 -->
<button class="feature-card" onclick="openLibrary('all')"><span class="feature-icon">✨</span><span class="feature-name" id="featureAll">All Learning Materials</span><span class="feature-desc" id="featureAllDesc">Browse all expressions and grammar</span></button> <!-- 전체 학습 자료 -->
</div> <!-- 학습 메뉴 종료 -->
</section> <!-- 홈 화면 종료 -->

<section id="scenarios" class="hidden"> <!-- 상황 선택 화면 시작 -->
<button class="back-button" onclick="goHome()" id="scenarioBack">← Back</button> <!-- 홈으로 이동 -->
<h1 class="heading" id="placeHeading"></h1> <!-- 장소 제목 -->
<p class="subheading" id="scenarioSubheading">Choose a situation</p> <!-- 상황 안내 -->
<div class="scenario-list" id="scenarioList"></div> <!-- 상황 목록 -->
</section> <!-- 상황 선택 화면 종료 -->

<section id="conversation" class="hidden"> <!-- 대화 화면 시작 -->
<button class="back-button" onclick="goScenarios()" id="conversationBack">← Back</button> <!-- 상황 목록으로 이동 -->
<h1 class="heading" id="conversationHeading"></h1> <!-- 대화 제목 -->
<div class="dialogue-card"> <!-- 대화 카드 시작 -->
<div class="speaker" id="speaker">STAFF</div> <!-- 말하는 사람 -->
<div class="foreign-label" id="foreignLabel">YOUR LANGUAGE</div> <!-- 외국어 안내 -->
<div class="foreign" id="foreign"></div> <!-- 외국어 번역 -->
<div class="korean-label" id="koreanLabel">KOREAN</div> <!-- 한국어 안내 -->
<div class="korean" id="korean"></div> <!-- 한국어 문장 -->
<div class="pronunciation-label" id="pronunciationLabel">YOUR PRONUNCIATION GUIDE</div> <!-- 현지어 발음 안내 -->
<div class="pronunciation" id="pronunciation"></div> <!-- 현지어 기반 발음 -->
</div> <!-- 대화 카드 종료 -->
<div class="choice-list" id="choices"></div> <!-- 대화 선택지 -->
<div class="input-row"><input id="userInput" type="text" placeholder="Type in what you want to ask..."><button class="send-button" id="sendButton" onclick="submitText()">Send</button></div> <!-- 문장 입력과 전송 -->
<div class="tools"><button class="tool-button" id="speakButton" onclick="listen()">🎙 Speak Korean</button><button class="tool-button" id="listenButton" onclick="speakCurrent()">🔊 Listen</button></div> <!-- 음성 기능 -->
<div class="status" id="status">Choose a response or type a phrase.</div> <!-- 상태 안내 -->
</section> <!-- 대화 화면 종료 -->

<section id="library" class="hidden"> <!-- 학습 자료 화면 시작 -->
<button class="back-button" onclick="goHome()" id="libraryBack">← Back</button> <!-- 홈으로 이동 -->
<h1 class="heading" id="libraryHeading">Learning Materials</h1> <!-- 학습 자료 제목 -->
<p class="subheading" id="librarySubheading">Useful Korean for your trip</p> <!-- 학습 자료 설명 -->
<div class="item-list" id="libraryList"></div> <!-- 학습 자료 목록 -->
</section> <!-- 학습 자료 화면 종료 -->

</section> <!-- 메인 카드 종료 -->
</main> <!-- 앱 전체 영역 종료 -->

// ==========================================
// 4부: 앱 작동 기능
// ==========================================

// 현재 선택된 언어를 저장합니다.
let currentLanguage = localStorage.getItem("travelLanguage") || "en";

// 현재 화면에 맞는 언어 데이터를 가져옵니다.
function getText(key) {
  return translations[currentLanguage]?.[key] || translations.en[key] || key;
}

// 현재 언어가 아랍어인지 확인합니다.
function isRTL() {
  return currentLanguage === "ar";
}

// HTML 요소를 간단히 가져오는 함수입니다.
function getElement(id) {
  return document.getElementById(id);
}

// 화면에 문구를 안전하게 표시하는 함수입니다.
function setText(id, value) {
  const element = getElement(id);
  if (element) element.textContent = value;
}

// ==========================================
// 언어 변경
// ==========================================

// 사용자가 언어를 변경하면 실행됩니다.
function setLanguage(language) {

  // 지원하는 언어인지 확인합니다.
  if (!translations[language]) return;

  // 현재 언어를 변경합니다.
  currentLanguage = language;

  // 브라우저에 언어 설정을 저장합니다.
  localStorage.setItem("travelLanguage", language);

  // HTML의 언어 속성을 변경합니다.
  document.documentElement.lang = language;

  // 아랍어는 오른쪽에서 왼쪽으로 표시합니다.
  document.documentElement.dir = isRTL() ? "rtl" : "ltr";

  // 언어 선택 메뉴의 값을 변경합니다.
  const languageSelect = getElement("languageSelect");
  if (languageSelect) languageSelect.value = language;

  // 공통 화면 문구를 갱신합니다.
  updateInterface();

  // 현재 화면을 다시 그립니다.
  if (currentScenario) {
    renderDialogue();
  } else if (currentPlace) {
    renderScenarios();
  } else {
    renderPlaces();
  }
}

// ==========================================
// 공통 화면 문구 갱신
// ==========================================

function updateInterface() {

  // 현재 언어의 번역 데이터를 가져옵니다.
  const t = translations[currentLanguage];

  // 홈 화면 제목을 변경합니다.
  setText("homeTitle", t.home);

  // 홈 화면 설명을 변경합니다.
  setText("homeSubheading", t.sub);

  // 언어 선택 제목을 변경합니다.
  setText("languageLabel", t.language);

  // 장소 선택 화면 제목을 변경합니다.
  setText("placeHeading", t.learn);

  // 상황 선택 화면 설명을 변경합니다.
  setText("scenarioSubheading", t.scenario);

  // 대화 화면 제목을 변경합니다.
  setText("conversationHeading", t.learn);

  // 학습 자료 화면 제목을 변경합니다.
  setText("libraryHeading", t.library);

  // 학습 자료 화면 설명을 변경합니다.
  setText("librarySubheading", t.librarySub);

  // 입력창 안내 문구를 변경합니다.
  const input = getElement("userInput");
  if (input) input.placeholder = t.input;

  // 아랍어 방향을 화면 전체에 적용합니다.
  document.documentElement.dir = isRTL() ? "rtl" : "ltr";
}

// ==========================================
// 화면 이동
// ==========================================

// 지정한 화면만 보이도록 설정합니다.
function showScreen(screenName) {

  // 사용할 화면의 ID 목록입니다.
  const screenIds = ["home", "scenarios", "conversation", "library"];

  // 모든 화면을 순서대로 확인합니다.
  screenIds.forEach(id => {

    // 해당 화면 요소를 가져옵니다.
    const element = getElement(id);

    // 현재 화면만 표시합니다.
    if (element) {
      element.style.display = id === screenName ? "block" : "none";
    }
  });
}

// ==========================================
// 장소 선택
// ==========================================

// 장소 버튼을 누르면 실행됩니다.
function selectPlace(place) {

  // 선택한 장소를 저장합니다.
  currentPlace = place;

  // 기존 상황 선택을 초기화합니다.
  currentScenario = null;

  // 대화 순서를 초기화합니다.
  currentStep = 0;

  // 상황 목록을 표시합니다.
  renderScenarios();

  // 상황 선택 화면으로 이동합니다.
  showScreen("scenarios");
}

// ==========================================
// 장소 이름 번역
// ==========================================

function getPlaceName(place) {

  // 현재 언어의 장소 번역을 가져옵니다.
  const names = translations[currentLanguage].places;

  // 번역이 있으면 번역된 이름을 반환합니다.
  if (names && names[place]) return names[place];

  // 번역이 없으면 원래 이름을 반환합니다.
  return place;
}

// ==========================================
// 장소 목록 표시
// ==========================================

function renderPlaces() {

  // 홈 화면으로 이동합니다.
  showScreen("home");

  // 공통 문구를 갱신합니다.
  updateInterface();

  // 장소 버튼을 각각 확인합니다.
  document.querySelectorAll("[data-place]").forEach(button => {

    // 장소의 고유 ID를 가져옵니다.
    const place = button.dataset.place;

    // 장소 이름을 번역합니다.
    const translatedName = getPlaceName(place);

    // 버튼의 이름을 변경합니다.
    const label = button.querySelector(".place-name");

    // 이름을 표시할 요소가 있으면 변경합니다.
    if (label) label.textContent = translatedName;
  });
}

// ==========================================
// 상황 목록 표시
// ==========================================

function renderScenarios() {

  // 상황 목록을 표시할 영역을 가져옵니다.
  const container = getElement("scenarioList");

  // 영역이 없으면 실행을 중단합니다.
  if (!container) return;

  // 기존 목록을 비웁니다.
  container.replaceChildren();

  // 장소에 해당하는 상황만 찾습니다.
  const scenarios = scenarioData.filter(item => item.id.startsWith(currentPlace));

  // 장소 이름을 화면 제목에 표시합니다.
  setText("placeHeading", getPlaceName(currentPlace));

  // 각 상황을 하나씩 표시합니다.
  scenarios.forEach(scenario => {

    // 상황 버튼을 만듭니다.
    const button = document.createElement("button");

    // 버튼의 CSS 클래스를 지정합니다.
    button.className = "scenario-card";

    // 상황 제목을 번역 데이터에서 찾습니다.
    const translatedTitle =
      scenarioNames[scenario.id]?.[currentLanguage] || scenario.name;

    // 상황 설명을 번역 데이터에서 찾습니다.
    const translatedDescription =
      scenarioDescriptions[scenario.id]?.[currentLanguage] || scenario.description;

    // 아이콘을 표시합니다.
    const icon = document.createElement("span");
    icon.textContent = scenario.icon || "📍";

    // 제목을 표시합니다.
    const title = document.createElement("strong");
    title.textContent = translatedTitle;

    // 설명을 표시합니다.
    const description = document.createElement("p");
    description.textContent = translatedDescription;

    // 버튼 안에 요소를 추가합니다.
    button.append(icon, title, description);

    // 버튼을 누르면 해당 상황을 선택합니다.
    button.addEventListener("click", () => {
      selectScenario(scenario.id);
    });

    // 목록에 버튼을 추가합니다.
    container.appendChild(button);
  });
}

// ==========================================
// 상황 선택
// ==========================================

function selectScenario(scenarioId) {

  // 선택한 상황 ID를 저장합니다.
  currentScenario = scenarioId;

  // 대화 순서를 처음으로 되돌립니다.
  currentStep = 0;

  // 대화 화면을 표시합니다.
  renderDialogue();

  // 대화 화면으로 이동합니다.
  showScreen("conversation");
}

// ==========================================
// 현재 대화 데이터 가져오기
// ==========================================

function getCurrentConversation() {

  // 선택한 상황의 대화 목록을 가져옵니다.
  const conversation = conversations[currentScenario];

  // 대화 데이터가 없으면 빈 배열을 반환합니다.
  if (!conversation) return [];

  // 배열 형태인지 확인합니다.
  return Array.isArray(conversation) ? conversation : [];
}

// ==========================================
// 외국어 번역 가져오기
// ==========================================

function getForeignTranslation(step) {

  // 한국어 문장을 기준으로 번역 데이터를 찾습니다.
  const korean = step.ko || "";

  // 번역 데이터가 있으면 선택 언어의 번역을 반환합니다.
  const translated = phraseTranslations[korean]?.[currentLanguage];

  // 번역이 있으면 반환합니다.
  if (translated) return translated;

  // 번역이 없으면 영어 문장을 반환합니다.
  return step.en || "";
}

// ==========================================
// 대화 화면 표시
// ==========================================

function renderDialogue() {

  // 현재 대화 목록을 가져옵니다.
  const conversation = getCurrentConversation();

  // 현재 단계의 대화 데이터를 가져옵니다.
  const step = conversation[currentStep];

  // 대화 데이터가 없으면 종료합니다.
  if (!step) return;

  // 외국어 문장을 표시합니다.
  setText("english", getForeignTranslation(step));

  // 한국어 문장을 표시합니다.
  setText("korean", step.ko || "");

  // 한국어 로마자 발음을 표시합니다.
  // 현지 문자 발음 표기는 별도의 검증된 데이터가 필요합니다.
  setText("roman", step.ro || "");

  // 화자 이름을 표시합니다.
  setText("speaker", step.speaker || "Korean");

  // 선택지를 표시합니다.
  renderChoices(step.choices || []);

  // 현재 언어에 맞는 설명을 표시합니다.
  const t = translations[currentLanguage];

  // 외국어 영역 제목을 변경합니다.
  setText("foreignLabel", t.foreignLabel);

  // 한국어 영역 제목을 변경합니다.
  setText("koreanLabel", t.koreanLabel);

  // 발음 영역 제목을 변경합니다.
  setText("pronunciationLabel", t.pronunciationLabel);
}

// ==========================================
// 대화 선택지 표시
// ==========================================

function renderChoices(choices) {

  // 선택지를 표시할 영역을 가져옵니다.
  const container = getElement("choices");

  // 영역이 없으면 종료합니다.
  if (!container) return;

  // 이전 선택지를 삭제합니다.
  container.replaceChildren();

  // 선택지를 하나씩 표시합니다.
  choices.forEach((choice, index) => {

    // 선택 버튼을 생성합니다.
    const button = document.createElement("button");

    // 버튼 스타일을 지정합니다.
    button.className = "choice-button";

    // 외국어 선택지 번역을 찾습니다.
    const translated =
      phraseTranslations[choice[1]]?.[currentLanguage] || choice[0];

    // 버튼에 번역 문장을 표시합니다.
    button.textContent = translated;

    // 버튼을 누르면 선택지를 처리합니다.
    button.addEventListener("click", () => {
      selectChoice(index);
    });

    // 버튼을 화면에 추가합니다.
    container.appendChild(button);
  });
}

// ==========================================
// 선택지 클릭
// ==========================================

function selectChoice(choiceIndex) {

  // 현재 대화 데이터를 가져옵니다.
  const conversation = getCurrentConversation();

  // 현재 단계의 대화를 가져옵니다.
  const step = conversation[currentStep];

  // 대화 데이터가 없으면 종료합니다.
  if (!step || !step.choices[choiceIndex]) return;

  // 선택한 답변을 가져옵니다.
  const choice = step.choices[choiceIndex];

  // 선택한 한국어 문장을 표시합니다.
  setText("korean", choice[1]);

  // 선택한 문장의 로마자 발음을 표시합니다.
  setText("roman", choice[2] || "");

  // 선택한 문장의 외국어 번역을 표시합니다.
  const translated =
    phraseTranslations[choice[1]]?.[currentLanguage] || choice[0];

  // 외국어 문장을 갱신합니다.
  setText("english", translated);

  // 잠시 후 다음 대화로 이동합니다.
  setTimeout(() => {

    // 다음 단계로 이동합니다.
    currentStep++;

    // 다음 대화가 남아 있는지 확인합니다.
    if (currentStep < conversation.length) {

      // 다음 대화를 표시합니다.
      renderDialogue();

    } else {

      // 대화가 끝났음을 표시합니다.
      setText("speaker", "✓");

      // 완료 메시지를 표시합니다.
      setText("english", getText("selected"));
    }

  }, 900);
}

// ==========================================
// 홈으로 돌아가기
// ==========================================

function goHome() {

  // 현재 선택 정보를 초기화합니다.
  currentPlace = null;
  currentScenario = null;
  currentStep = 0;

  // 장소 목록을 다시 표시합니다.
  renderPlaces();

  // 홈 화면으로 이동합니다.
  showScreen("home");
}

// ==========================================
// 상황 목록으로 돌아가기
// ==========================================

function goScenarios() {

  // 상황 선택 화면을 다시 표시합니다.
  renderScenarios();

  // 상황 선택 화면으로 이동합니다.
  showScreen("scenarios");
}

// ==========================================
// 학습 자료 화면
// ==========================================

function openLibrary() {

  // 학습 자료 화면을 표시합니다.
  showScreen("library");

  // 현재 언어의 화면 문구를 갱신합니다.
  updateInterface();

  // 학습 자료 목록을 표시합니다.
  renderLibrary();
}

// ==========================================
// 학습 자료 목록 표시
// ==========================================

function renderLibrary() {

  // 학습 자료를 표시할 영역을 가져옵니다.
  const container = getElement("libraryList");

  // 영역이 없으면 종료합니다.
  if (!container) return;

  // 기존 자료를 삭제합니다.
  container.replaceChildren();

  // 자료 분류를 정의합니다.
  const categories = [
    ["expressions", "expressionsDesc"],
    ["grammar", "grammarDesc"],
    ["dietary", "dietaryDesc"],
    ["all", "allDesc"]
  ];

  // 분류별 버튼을 생성합니다.
  categories.forEach(category => {

    // 버튼을 만듭니다.
    const button = document.createElement("button");

    // 버튼 스타일을 지정합니다.
    button.className = "library-card";

    // 제목을 만듭니다.
    const title = document.createElement("strong");
    title.textContent = getText(category[0]);

    // 설명을 만듭니다.
    const description = document.createElement("p");
    description.textContent = getText(category[1]);

    // 버튼에 제목과 설명을 추가합니다.
    button.append(title, description);

    // 버튼을 누르면 해당 자료를 표시합니다.
    button.addEventListener("click", () => {
      showLibraryCategory(category[0]);
    });

    // 화면에 버튼을 추가합니다.
    container.appendChild(button);
  });
}

// ==========================================
// 학습 자료 세부 내용
// ==========================================

function showLibraryCategory(category) {

  // 자료를 표시할 영역을 가져옵니다.
  const container = getElement("libraryList");

  // 영역이 없으면 종료합니다.
  if (!container) return;

  // 기존 목록을 삭제합니다.
  container.replaceChildren();

  // 학습 자료에서 해당 분류를 가져옵니다.
  const materials = learningMaterials[category];

  // 자료가 없는 경우 안내 문구를 표시합니다.
  if (!materials) {
    const message = document.createElement("p");
    message.textContent = "Learning materials are not available.";
    container.appendChild(message);
    return;
  }

  // 자료가 배열이면 하나씩 표시합니다.
  if (Array.isArray(materials)) {

    // 각 자료를 화면에 표시합니다.
    materials.forEach(item => {

      // 자료 카드 영역을 만듭니다.
      const card = document.createElement("div");
      card.className = "learning-card";

      // 자료 내용을 표시합니다.
      const content = document.createElement("p");

      // 문자열과 객체를 모두 처리합니다.
      content.textContent =
        typeof item === "string"
          ? item
          : item.title || item.expression || item.ko || JSON.stringify(item);

      // 카드에 내용을 추가합니다.
      card.appendChild(content);

      // 화면에 카드를 추가합니다.
      container.appendChild(card);
    });
  }
}

// ==========================================
// 사용자가 문장 입력
// ==========================================

function submitText() {

  // 입력창을 가져옵니다.
  const input = getElement("userInput");

  // 입력창이 없으면 종료합니다.
  if (!input) return;

  // 사용자가 입력한 문장을 가져옵니다.
  const message = input.value.trim();

  // 입력이 비어 있으면 안내합니다.
  if (!message) {
    setText("speaker", getText("empty"));
    return;
  }

  // 현재는 AI 번역 기능이 연결되어 있지 않습니다.
  // 따라서 입력 문장을 임의로 번역하지 않습니다.
  setText("speaker", getText("ai"));

  // 입력창을 비웁니다.
  input.value = "";
}

// ==========================================
// 한국어 음성 듣기
// ==========================================

function speakText(text) {

  // 브라우저 음성 기능을 지원하는지 확인합니다.
  if (!("speechSynthesis" in window)) return;

  // 이전 음성 재생을 중단합니다.
  window.speechSynthesis.cancel();

  // 읽을 문장을 설정합니다.
  const utterance = new SpeechSynthesisUtterance(text);

  // 한국어 음성으로 설정합니다.
  utterance.lang = "ko-KR";

  // 음성 속도를 설정합니다.
  utterance.rate = 0.85;

  // 음성을 재생합니다.
  window.speechSynthesis.speak(utterance);
}

// ==========================================
// 현재 한국어 문장 듣기
// ==========================================

function speakCurrent() {

  // 현재 한국어 문장을 가져옵니다.
  const korean = getElement("korean")?.textContent || "";

  // 문장이 있으면 음성으로 읽습니다.
  if (korean) speakText(korean);
}

// ==========================================
// 마이크로 한국어 말하기
// ==========================================

function listen() {

  // 브라우저 음성 인식 기능을 확인합니다.
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  // 지원하지 않는 브라우저라면 안내합니다.
  if (!SpeechRecognition) {
    setText("speaker", "Speech recognition is not supported in this browser.");
    return;
  }

  // 음성 인식 객체를 생성합니다.
  const recognition = new SpeechRecognition();

  // 한국어 음성 인식으로 설정합니다.
  recognition.lang = "ko-KR";

  // 한 번의 음성을 인식합니다.
  recognition.continuous = false;

  // 인식 결과를 가져옵니다.
  recognition.onresult = event => {

    // 인식된 문장을 가져옵니다.
    const result = event.results[0][0].transcript;

    // 입력창에 문장을 표시합니다.
    const input = getElement("userInput");

    // 입력창이 있으면 문장을 넣습니다.
    if (input) input.value = result;
  };

  // 음성 인식을 시작합니다.
  recognition.start();
}

// ==========================================
// 앱 시작
// ==========================================

// 저장된 언어를 적용합니다.
setLanguage(currentLanguage);
