
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTrep — Korean Travel Expressions</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Avenir Next", "Segoe UI", sans-serif;
  color: #58647b;
  background: linear-gradient(135deg, #f1edf9, #eaf2f8 48%, #f9edf1);
  background-attachment: fixed;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.app {
  width: min(100% - 28px, 760px);
  margin: auto;
  padding: 25px 0 40px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 4px 22px;
}

.logo {
  font-family: Georgia, serif;
  font-size: 27px;
  letter-spacing: -1px;
  color: #586784;
}

.header-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #ffffff99;
  border: 1px solid white;
  box-shadow: 0 7px 20px #64739622;
  color: #a18cb9;
}

.main {
  border-radius: 28px;
  padding: 22px;
  min-height: 540px;
  background: #ffffff88;
  border: 1px solid #ffffffd9;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 55px #68749629, inset 0 1px 0 white;
}

.heading {
  font-family: Georgia, serif;
  font-size: 27px;
  font-weight: 500;
  margin: 4px 0 7px;
  color: #596a88;
}

.subheading {
  margin: 0 0 20px;
  color: #9997ab;
  font-size: 12px;
}

.section-title {
  font-size: 15px;
  color: #71809d;
  margin: 22px 0 10px;
  font-weight: 700;
}

.language-wrap {
  margin: 0 0 18px;
}

.language-label {
  display: block;
  font-size: 12px;
  color: #8992aa;
  margin-bottom: 7px;
  font-weight: 650;
}

.language-select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid white;
  border-radius: 14px;
  background: #ffffffb8;
  color: #64748e;
  box-shadow: 0 7px 18px #6473961c;
  outline: none;
}

.place-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.place-card {
  position: relative;
  height: 140px;
  border: 1px solid white;
  border-radius: 19px;
  overflow: hidden;
  padding: 0;
  background: #e8eaf3;
  box-shadow: 0 10px 25px #6473962b;
  display: block;
  width: 100%;
  isolation: isolate;
}

.place-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: .88;
  pointer-events: none;
}

.place-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(transparent 35%, #2631418c);
  pointer-events: none;
}

.place-name {
  position: absolute;
  left: 15px;
  bottom: 14px;
  color: white;
  font-size: 16px;
  font-weight: 700;
  text-shadow: 0 2px 8px #0004;
  pointer-events: none;
}

.feature-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
  margin-top: 15px;
}

.feature-card {
  border: 1px solid white;
  border-radius: 17px;
  padding: 15px;
  background: #ffffffa6;
  text-align: left;
  box-shadow: 0 8px 20px #6473961c;
  color: #657590;
  width: 100%;
  display: block;
}

.feature-icon {
  font-size: 24px;
  display: block;
  margin-bottom: 8px;
  pointer-events: none;
}

.feature-name {
  font-size: 14px;
  font-weight: 700;
  display: block;
  pointer-events: none;
}

.feature-desc {
  font-size: 11px;
  color: #9997ab;
  display: block;
  margin-top: 5px;
  line-height: 1.4;
  pointer-events: none;
}

.back-button {
  border: 0;
  background: transparent;
  color: #8d91ad;
  padding: 4px 0 17px;
  font-size: 13px;
}

.scenario-list, .item-list {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.scenario-card, .item-card {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 15px;
  border-radius: 17px;
  border: 1px solid white;
  background: #ffffffa6;
  box-shadow: 0 9px 23px #69769620;
  text-align: left;
  color: #64748e;
}

.scenario-icon {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #f1ecfa, #e5f0f5);
  font-size: 22px;
}

.scenario-text {
  flex: 1;
}

.scenario-name {
  font-size: 14px;
  font-weight: 700;
  display: block;
}

.scenario-description {
  font-size: 11px;
  color: #a09db2;
  margin-top: 4px;
  display: block;
}

.arrow {
  color: #a99abc;
  font-size: 20px;
}

.dialogue-card {
  padding: 21px;
  border-radius: 23px;
  background: linear-gradient(145deg, #f0f5ffe0, #ffffffa6);
  border: 1px solid white;
  box-shadow: 0 15px 34px #6980af2b, inset 0 1px 0 white;
}

.speaker {
  color: #d49aa5;
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: 750;
  margin-bottom: 13px;
}

.foreign-label, .korean-label, .pronunciation-label {
  color: #9296aa;
  font-size: 10px;
  letter-spacing: 1px;
  font-weight: 700;
  margin: 12px 0 7px;
}

.foreign {
  color: #668ac5;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.korean {
  color: #639879;
  font-size: 22px;
  font-weight: 700;
  line-height: 1.55;
  word-break: keep-all;
}

.pronunciation {
  color: #a18ab9;
  font-size: 15px;
  font-style: italic;
  margin-top: 8px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.choice-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 17px;
}

.choice {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid white;
  border-radius: 16px;
  background: #ffffffb0;
  text-align: left;
  box-shadow: 0 8px 20px #7080a026;
  color: #64748e;
}

.choice:disabled {
  opacity: .65;
  cursor: default;
}

.choice-foreign, .choice-ko, .choice-pronunciation {
  display: block;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.choice-foreign {
  font-size: 13px;
  font-weight: 600;
  color: #668ac5;
  margin-bottom: 6px;
}

.choice-ko {
  font-size: 16px;
  font-weight: 700;
  color: #639879;
  margin-bottom: 5px;
}

.choice-pronunciation {
  font-size: 12px;
  color: #a18ab9;
  font-style: italic;
}

.input-row {
  display: flex;
  gap: 8px;
  margin-top: 13px;
}

.input-row input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid white;
  border-radius: 13px;
  background: #ffffffb3;
  color: #5d718e;
  outline: none;
}

.send-button {
  border: 1px solid white;
  border-radius: 13px;
  padding: 0 16px;
  background: linear-gradient(135deg, #dce9f8, #e9e0f5);
  color: #687a9a;
  box-shadow: 0 6px 15px #7080a022;
}

.tools {
  display: flex;
  gap: 9px;
  margin-top: 15px;
}

.tool-button {
  flex: 1;
  padding: 12px 8px;
  border: 1px solid white;
  border-radius: 14px;
  background: #ffffff9e;
  color: #7d89a8;
  font-size: 12px;
}

.status {
  color: #9997ab;
  font-size: 11px;
  margin-top: 11px;
  min-height: 17px;
  line-height: 1.5;
}

.item-card {
  display: block;
  padding: 16px;
}

.item-en {
  color: #668ac5;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

.item-ko {
  color: #639879;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.5;
}

.item-ro {
  color: #a18ab9;
  font-size: 12px;
  font-style: italic;
  margin-top: 5px;
}

.item-note {
  color: #8d91a7;
  font-size: 11px;
  margin-top: 8px;
  line-height: 1.5;
}

.hidden {
  display: none !important;
}

[dir="rtl"] .place-name {
  left: auto;
  right: 15px;
}

[dir="rtl"] .scenario-card,
[dir="rtl"] .choice,
[dir="rtl"] .feature-card {
  text-align: right;
}

[dir="rtl"] .arrow {
  transform: scaleX(-1);
}

[dir="rtl"] .back-button {
  text-align: right;
}

@media(max-width:420px) {
  .main {
    padding: 16px;
  }

  .place-card {
    height: 125px;
  }

  .heading {
    font-size: 24px;
  }

  .korean {
    font-size: 21px;
  }

  .dialogue-card {
    padding: 18px;
  }
}
</style>
</head>

<body>
<main class="app">

<header class="header">
  <div class="logo">KTrep</div>
  <div class="header-icon">✦</div>
</header>

<section class="main">

  <!-- 홈 화면 -->
  <section id="home">

    <h1 class="heading" id="homeTitle">Where to?</h1>

    <p class="subheading" id="homeSubheading">
      Explore Korea and learn useful Korean
    </p>

    <div class="language-wrap">
      <label class="language-label" id="languageLabel" for="languageSelect">
        Choose your language
      </label>

      <select class="language-select" id="languageSelect" onchange="setLanguage(this.value)">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh">中文（简体）</option>
        <option value="ja">日本語</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="ar">العربية</option>
        <option value="pt">Português</option>
        <option value="ru">Русский</option>
        <option value="vi">Tiếng Việt</option>
        <option value="si">සිංහල</option>
        <option value="ne">नेपाली</option>
        <option value="th">ไทย</option>
      </select>
    </div>

    <div class="place-grid">

      <button class="place-card" onclick="selectPlace('cafe')">
        <img src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=700" alt="Cafe">
        <span class="place-overlay"></span>
        <span class="place-name" data-place="cafe">Cafe</span>
      </button>

      <button class="place-card" onclick="selectPlace('restaurant')">
        <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=700" alt="Restaurant">
        <span class="place-overlay"></span>
        <span class="place-name" data-place="restaurant">Restaurant</span>
      </button>

      <button class="place-card" onclick="selectPlace('transport')">
        <img src="https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=700" alt="Transport">
        <span class="place-overlay"></span>
        <span class="place-name" data-place="transport">Transport</span>
      </button>

      <button class="place-card" onclick="selectPlace('shopping')">
        <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=700" alt="Shopping">
        <span class="place-overlay"></span>
        <span class="place-name" data-place="shopping">Shopping</span>
      </button>

      <button class="place-card" onclick="selectPlace('stay')">
        <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=700" alt="Accommodation">
        <span class="place-overlay"></span>
        <span class="place-name" data-place="stay">Stay</span>
      </button>

    </div>

    <h2 class="section-title" id="learnTitle">Learn Korean</h2>

    <div class="feature-grid">

      <button class="feature-card" onclick="openLibrary('expressions')">
        <span class="feature-icon">🗣️</span>
        <span class="feature-name" id="featureExpressions">Essential Expressions</span>
        <span class="feature-desc" id="featureExpressionsDesc">Useful phrases for everyday situations</span>
      </button>

      <button class="feature-card" onclick="openLibrary('grammar')">
        <span class="feature-icon">📖</span>
        <span class="feature-name" id="featureGrammar">Useful Grammar</span>
        <span class="feature-desc" id="featureGrammarDesc">Practical grammar with travel examples</span>
      </button>

      <button class="feature-card" onclick="openLibrary('dietary')">
        <span class="feature-icon">🥗</span>
        <span class="feature-name" id="featureDietary">Dietary Needs</span>
        <span class="feature-desc" id="featureDietaryDesc">Vegetarian, vegan, halal and gluten-free</span>
      </button>

      <button class="feature-card" onclick="openLibrary('all')">
        <span class="feature-icon">✨</span>
        <span class="feature-name" id="featureAll">All Learning Materials</span>
        <span class="feature-desc" id="featureAllDesc">Browse all expressions and grammar</span>
      </button>

    </div>
  </section>

  <!-- 상황 선택 화면 -->
  <section id="scenarios" class="hidden">

    <button class="back-button" onclick="goHome()">← Back</button>

    <h1 class="heading" id="placeHeading"></h1>

    <p class="subheading" id="scenarioSubheading">
      Choose a situation
    </p>

    <div class="scenario-list" id="scenarioList"></div>

  </section>

  <!-- 대화 화면 -->
  <section id="conversation" class="hidden">

    <button class="back-button" onclick="goScenarios()">← Back</button>

    <h1 class="heading" id="conversationHeading"></h1>

    <div class="dialogue-card">

      <div class="speaker" id="speaker">STAFF</div>

      <div class="foreign-label" id="foreignLabel">YOUR LANGUAGE</div>
      <div class="foreign" id="foreign"></div>

      <div class="korean-label" id="koreanLabel">KOREAN</div>
      <div class="korean" id="korean"></div>

      <div class="pronunciation-label" id="pronunciationLabel">
        KOREAN PRONUNCIATION
      </div>

      <div class="pronunciation" id="pronunciation"></div>

    </div>

    <div class="choice-list" id="choices"></div>

    <div class="input-row">
      <input id="userInput" type="text" placeholder="Type in what you want to ask...">
      <button class="send-button" id="sendButton" onclick="submitText()">Send</button>
    </div>

    <div class="tools">
      <button class="tool-button" id="speakButton" onclick="listen()">🎙 Speak Korean</button>
      <button class="tool-button" id="listenButton" onclick="speakCurrent()">🔊 Listen</button>
    </div>

    <div class="status" id="status">
      Choose a response or type a phrase.
    </div>

  </section>

  <!-- 학습 자료 화면 -->
  <section id="library" class="hidden">

    <button class="back-button" onclick="goHome()">← Back</button>

    <h1 class="heading" id="libraryHeading">Learning Materials</h1>

    <p class="subheading" id="librarySubheading">
      Useful Korean for your trip
    </p>

    <div class="item-list" id="libraryList"></div>

  </section>

</section>
</main>

// ==========================================
// 8부: 앱 상태 관리
// ==========================================

// 현재 선택된 언어
let currentLanguage = "en";

// 현재 선택된 장소
let currentPlace = null;

// 현재 선택된 상황
let currentScenario = null;

// 현재 대화 순서
let currentStep = 0;

// 현재 학습 자료 카테고리
let currentLibraryCategory = "all";

// 현재 화면
let currentScreen = "home";


// ==========================================
// 9부: 공통 도우미 함수
// ==========================================

// HTML 요소를 ID로 가져오기
function getElement(id) {
  return document.getElementById(id);
}

// 요소의 글자 변경
function setText(id, value) {
  const element = getElement(id);

  if (element) {
    element.textContent = value;
  }
}

// 선택한 언어의 번역 가져오기
function getText(key) {
  return (
    translations[currentLanguage]?.[key] ||
    translations.en[key] ||
    key
  );
}

// 현재 언어의 장소 이름 가져오기
function getPlaceName(placeId) {
  return getText("places")[placeId] || placeId;
}

// 현재 언어의 상황 이름 가져오기
function getScenarioName(scenarioId, fallback) {
  return (
    scenarioNames[currentLanguage]?.[scenarioId] ||
    scenarioNames.en[scenarioId] ||
    fallback
  );
}

// 현재 언어의 상황 설명 가져오기
function getScenarioDescription(scenarioId, fallback) {
  return (
    scenarioDescriptions[currentLanguage]?.[scenarioId] ||
    scenarioDescriptions.en[scenarioId] ||
    fallback
  );
}

// 한국어 문장을 현재 언어로 번역
function getPhraseTranslation(korean, fallback = "") {
  const translationsForPhrase = phraseTranslations[korean];

  if (translationsForPhrase) {
    return (
      translationsForPhrase[currentLanguage] ||
      translationsForPhrase.en ||
      fallback ||
      korean
    );
  }

  return fallback || korean;
}


// ==========================================
// 10부: 화면 전환
// ==========================================

function showScreen(screenId) {

  const screens = [
    "home",
    "scenarios",
    "conversation",
    "library"
  ];

  screens.forEach(id => {
    const element = getElement(id);

    if (element) {
      element.classList.toggle("hidden", id !== screenId);
    }
  });

  currentScreen = screenId;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

// 홈으로 돌아가기
function goHome() {

  currentPlace = null;
  currentScenario = null;
  currentStep = 0;

  showScreen("home");
}

// 상황 목록으로 돌아가기
function goScenarios() {

  currentScenario = null;
  currentStep = 0;

  if (currentPlace) {
    renderScenarios();
    showScreen("scenarios");
  } else {
    goHome();
  }
}


// ==========================================
// 11부: 언어 선택과 화면 번역
// ==========================================

function setLanguage(language) {

  // 지원하는 언어인지 확인
  if (!translations[language]) {
    language = "en";
  }

  currentLanguage = language;

  // 언어 선택 메뉴 업데이트
  const languageSelect = getElement("languageSelect");

  if (languageSelect) {
    languageSelect.value = language;
  }

  // 아랍어는 오른쪽에서 왼쪽으로 표시
  document.documentElement.lang = language;
  document.documentElement.dir =
    language === "ar" ? "rtl" : "ltr";

  // 사용자의 언어 설정 저장
  try {
    localStorage.setItem("ktrep-language", language);
  } catch (error) {
    console.warn("Language preference could not be saved.", error);
  }

  // 홈 화면 번역
  updateInterface();

  // 현재 화면에 맞는 내용 다시 표시
  if (currentScreen === "scenarios" && currentPlace) {
    renderScenarios();
  }

  if (currentScreen === "conversation" && currentScenario) {
    renderDialogue();
    renderChoices();
  }

  if (currentScreen === "library") {
    renderLibrary();
  }
}

// 화면에 표시되는 기본 텍스트 업데이트
function updateInterface() {

  setText("homeTitle", getText("home"));
  setText("homeSubheading", getText("sub"));
  setText("languageLabel", getText("language"));
  setText("learnTitle", getText("learn"));

  setText("scenarioSubheading", getText("scenario"));

  setText("libraryHeading", getText("library"));
  setText("librarySubheading", getText("librarySub"));

  setText("featureExpressions", getText("expressions"));
  setText("featureExpressionsDesc", getText("expressionsDesc"));

  setText("featureGrammar", getText("grammar"));
  setText("featureGrammarDesc", getText("grammarDesc"));

  setText("featureDietary", getText("dietary"));
  setText("featureDietaryDesc", getText("dietaryDesc"));

  setText("featureAll", getText("all"));
  setText("featureAllDesc", getText("allDesc"));

  setText("foreignLabel", getText("foreignLabel"));
  setText("koreanLabel", getText("koreanLabel"));
  setText("pronunciationLabel", getText("pronunciationLabel"));

  setText("sendButton", getText("send"));
  setText("speakButton", getText("speak"));
  setText("listenButton", getText("listen"));

  // 입력창 안내 문구
  const input = getElement("userInput");

  if (input) {
    input.placeholder = getText("input");
  }

  // 홈 화면의 장소 이름 변경
  document.querySelectorAll("[data-place]").forEach(element => {

    const placeId = element.dataset.place;

    element.textContent = getPlaceName(placeId);

  });
}


// ==========================================
// 12부: 장소 선택
// ==========================================

function getCurrentPlaceData() {

  return appData.find(place => {
    return place.id === currentPlace;
  });
}

function selectPlace(placeId) {

  const place = appData.find(item => item.id === placeId);

  if (!place) {
    return;
  }

  currentPlace = placeId;
  currentScenario = null;
  currentStep = 0;

  renderScenarios();

  showScreen("scenarios");
}


// ==========================================
// 13부: 상황 목록 표시
// ==========================================

function renderScenarios() {

  const place = getCurrentPlaceData();

  if (!place) {
    return;
  }

  // 장소 제목
  setText("placeHeading", getPlaceName(place.id));

  // 상황 목록 요소
  const container = getElement("scenarioList");

  if (!container) {
    return;
  }

  container.innerHTML = "";

  // 장소에 포함된 모든 상황 표시
  place.scenarios.forEach(scenario => {

    const button = document.createElement("button");

    button.className = "scenario-card";
    button.type = "button";

    const icon = document.createElement("span");
    icon.className = "scenario-icon";
    icon.textContent = scenario.icon;

    const textWrapper = document.createElement("span");
    textWrapper.className = "scenario-text";

    const title = document.createElement("span");
    title.className = "scenario-name";

    title.textContent = getScenarioName(
      scenario.id,
      scenario.title
    );

    const description = document.createElement("span");
    description.className = "scenario-description";

    description.textContent = getScenarioDescription(
      scenario.id,
      scenario.description
    );

    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "›";

    textWrapper.appendChild(title);
    textWrapper.appendChild(description);

    button.appendChild(icon);
    button.appendChild(textWrapper);
    button.appendChild(arrow);

    // 상황을 누르면 대화 화면으로 이동
    button.addEventListener("click", () => {
      selectScenario(scenario.id);
    });

    container.appendChild(button);

  });
}


// ==========================================
// 14부: 대화 상황 선택
// ==========================================

function selectScenario(scenarioId) {

  const place = getCurrentPlaceData();

  if (!place) {
    return;
  }

  const scenario = place.scenarios.find(item => {
    return item.id === scenarioId;
  });

  if (!scenario) {
    return;
  }

  currentScenario = scenario;
  currentStep = 0;

  setText(
    "conversationHeading",
    getScenarioName(scenario.id, scenario.title)
  );

  renderDialogue();
  renderChoices();

  setText("status", getText("status"));

  const input = getElement("userInput");

  if (input) {
    input.value = "";
  }

  showScreen("conversation");
}


// ==========================================
// 15부: 현재 대화 가져오기
// ==========================================

function getCurrentConversation() {

  if (!currentScenario) {
    return null;
  }

  return currentScenario.dialogues[currentStep] || null;
}


// ==========================================
// 16부: 대화 내용 표시
// ==========================================

function renderDialogue() {

  const dialogue = getCurrentConversation();

  // 모든 대화가 끝났을 때
  if (!dialogue) {

    setText("speaker", "COMPLETED");
    setText("foreign", getText("selected"));
    setText("korean", "대화가 끝났어요.");
    setText("pronunciation", "");

    setText("status", getText("selected"));

    const choices = getElement("choices");

    if (choices) {
      choices.innerHTML = "";
    }

    return;
  }

  // 말하는 사람
  setText("speaker", dialogue.speaker);

  // 외국어 번역
  setText(
    "foreign",
    getPhraseTranslation(dialogue.ko, dialogue.en)
  );

  // 한국어 원문
  setText("korean", dialogue.ko);

  // 한국어 발음
  setText("pronunciation", dialogue.roman);

  // 현재 대화의 제목
  if (currentScenario) {
    setText(
      "conversationHeading",
      getScenarioName(
        currentScenario.id,
        currentScenario.title
      )
    );
  }
}


// ==========================================
// 17부: 선택지 표시
// ==========================================

function renderChoices() {

  const container = getElement("choices");

  if (!container) {
    return;
  }

  container.innerHTML = "";

  const dialogue = getCurrentConversation();

  // 대화가 끝났다면 선택지 표시하지 않음
  if (!dialogue || !dialogue.choices) {
    return;
  }

  dialogue.choices.forEach(choice => {

    const button = document.createElement("button");

    button.className = "choice";
    button.type = "button";

    const foreign = document.createElement("span");
    foreign.className = "choice-foreign";

    foreign.textContent = getPhraseTranslation(
      choice.ko,
      choice.en
    );

    const korean = document.createElement("span");
    korean.className = "choice-ko";
    korean.textContent = choice.ko;

    const pronunciation = document.createElement("span");
    pronunciation.className = "choice-pronunciation";
    pronunciation.textContent = choice.roman;

    button.appendChild(foreign);
    button.appendChild(korean);
    button.appendChild(pronunciation);

    // 선택지를 누르면 다음 대화로 이동
    button.addEventListener("click", () => {
      selectChoice(choice);
    });

    container.appendChild(button);

  });
}


// ==========================================
// 18부: 선택지 진행
// ==========================================

function selectChoice(choice) {

  if (!currentScenario || !choice) {
    return;
  }

  // 사용자가 선택한 문장을 상태 영역에 표시
  const selectedText = getPhraseTranslation(
    choice.ko,
    choice.en
  );

  setText(
    "status",
    "✓ " + selectedText
  );

  // 다음 대화 순서로 이동
  currentStep++;

  // 다음 대화 표시
  renderDialogue();
  renderChoices();

  // 대화가 모두 끝났을 때
  if (currentStep >= currentScenario.dialogues.length) {
    setText("status", getText("selected"));
  }
}


// ==========================================
// 19부: 학습 자료 카테고리
// ==========================================

function getLibraryItems(category) {

  if (category === "all") {

    return [
      ...learningMaterials.expressions,
      ...learningMaterials.grammar,
      ...learningMaterials.dietary
    ];
  }

  return learningMaterials[category] || [];
}


// ==========================================
// 20부: 학습 자료 화면 열기
// ==========================================

function openLibrary(category = "all") {

  currentLibraryCategory = category;

  renderLibrary();

  showScreen("library");
}


// ==========================================
// 21부: 학습 자료 표시
// ==========================================

function renderLibrary() {

  const container = getElement("libraryList");

  if (!container) {
    return;
  }

  container.innerHTML = "";

  // 카테고리 버튼
  const categories = [
    {
      id: "all",
      label: getText("all")
    },
    {
      id: "expressions",
      label: getText("expressions")
    },
    {
      id: "grammar",
      label: getText("grammar")
    },
    {
      id: "dietary",
      label: getText("dietary")
    }
  ];

  const categoryWrapper = document.createElement("div");

  categoryWrapper.className = "feature-grid";

  categories.forEach(category => {

    const button = document.createElement("button");

    button.className = "feature-card";
    button.type = "button";

    button.textContent = category.label;

    // 현재 선택된 카테고리 표시
    if (currentLibraryCategory === category.id) {
      button.style.border = "2px solid #b6a8d2";
      button.style.background = "#f5f0fb";
    }

    button.addEventListener("click", () => {
      currentLibraryCategory = category.id;
      renderLibrary();
    });

    categoryWrapper.appendChild(button);

  });

  container.appendChild(categoryWrapper);

  // 선택된 카테고리의 학습 자료 가져오기
  const items = getLibraryItems(currentLibraryCategory);

  if (items.length === 0) {

    const empty = document.createElement("p");

    empty.className = "status";
    empty.textContent = getText("empty");

    container.appendChild(empty);

    return;
  }

  // 학습 자료 카드 만들기
  items.forEach(item => {

    const card = document.createElement("article");

    card.className = "item-card";

    const foreign = document.createElement("div");
    foreign.className = "item-en";

    foreign.textContent = getPhraseTranslation(
      item.ko,
      item.en
    );

    const korean = document.createElement("div");
    korean.className = "item-ko";
    korean.textContent = item.ko;

    const roman = document.createElement("div");
    roman.className = "item-ro";
    roman.textContent = item.roman;

    const note = document.createElement("div");
    note.className = "item-note";

    note.textContent = item.note;

    card.appendChild(foreign);
    card.appendChild(korean);
    card.appendChild(roman);
    card.appendChild(note);

    container.appendChild(card);

  });
}


// ==========================================
// 22부: 한국어 음성 재생
// ==========================================

function speakText(text) {

  if (!("speechSynthesis" in window)) {

    setText(
      "status",
      "음성 재생을 지원하지 않는 브라우저입니다."
    );

    return;
  }

  // 이전 음성 재생 중지
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  // 한국어 발음 설정
  utterance.lang = "ko-KR";

  // 기본 속도
  utterance.rate = 0.85;

  // 음성 높이
  utterance.pitch = 1;

  window.speechSynthesis.speak(utterance);
}


// 현재 대화의 한국어 문장 듣기
function speakCurrent() {

  const dialogue = getCurrentConversation();

  if (!dialogue) {
    setText("status", getText("selected"));
    return;
  }

  speakText(dialogue.ko);
}


// ==========================================
// 23부: 한국어 음성 인식
// ==========================================

function listen() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  // 브라우저 지원 여부 확인
  if (!SpeechRecognition) {

    setText(
      "status",
      "이 브라우저에서는 음성 인식을 지원하지 않습니다. Safari 또는 지원되는 브라우저에서 다시 시도해 주세요."
    );

    return;
  }

  const recognition = new SpeechRecognition();

  // 한국어 인식
  recognition.lang = "ko-KR";

  // 한 번의 발화 인식
  recognition.continuous = false;

  // 중간 결과는 표시하지 않음
  recognition.interimResults = false;

  recognition.maxAlternatives = 1;

  setText("status", "듣고 있어요. 한국어로 말해 보세요.");

  recognition.onresult = function(event) {

    const result = event.results[0][0].transcript;

    const input = getElement("userInput");

    if (input) {
      input.value = result;
    }

    setText(
      "status",
      "인식한 문장: " + result
    );

  };

  recognition.onerror = function(event) {

    setText(
      "status",
      "음성 인식 오류: " + event.error
    );

  };

  recognition.onend = function() {

    const status = getElement("status");

    if (status && status.textContent.includes("듣고 있어요")) {
      setText("status", "음성 인식이 종료되었습니다.");
    }

  };

  try {
    recognition.start();
  } catch (error) {
    setText(
      "status",
      "마이크를 시작할 수 없습니다. 잠시 후 다시 시도해 주세요."
    );
  }
}


// ==========================================
// 24부: 문장 입력 기능
// ==========================================

function submitText() {

  const input = getElement("userInput");

  if (!input) {
    return;
  }

  const value = input.value.trim();

  if (!value) {
    setText("status", "문장을 먼저 입력해 주세요.");
    return;
  }

  // 입력한 한국어 문장을 표시
  setText(
    "status",
    "입력한 문장: " + value
  );

  // 입력창 비우기
  input.value = "";
}


// 키보드 Enter로 입력
const userInput = getElement("userInput");

if (userInput) {

  userInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      submitText();
    }

  });

}


// ==========================================
// 25부: 앱 초기화
// ==========================================

function initializeApp() {

  // 저장된 언어 설정 불러오기
  let savedLanguage = "en";

  try {

    savedLanguage =
      localStorage.getItem("ktrep-language") || "en";

  } catch (error) {

    savedLanguage = "en";

  }

  // 언어 설정 적용
  setLanguage(savedLanguage);

  // 첫 화면은 홈
  showScreen("home");

}


// ==========================================
// 26부: 앱 실행
// ==========================================

if (document.readyState === "loading") {

  document.addEventListener(
    "DOMContentLoaded",
    initializeApp
  );

} else {

  initializeApp();

}

</script>
</body>
</html>
