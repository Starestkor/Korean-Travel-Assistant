
<!DOCTYPE html>
<!-- HTML 문서임을 선언합니다. -->
<html lang="ko">
<!-- 문서의 기본 언어를 한국어로 설정합니다. -->

<head>
    <!-- 문서 설정을 시작합니다. -->
    <meta charset="UTF-8">
    <!-- 한글 인코딩을 설정합니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 모바일 화면에 맞춥니다. -->
    <title>Korean Travel Assistant</title>
    <!-- 브라우저 제목입니다. -->

    <style>
        /* 모든 요소의 크기 계산 방식을 통일합니다. */
        * {
            box-sizing: border-box;
        }

        /* 페이지 전체 디자인입니다. */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background-color: #f5f6fa;
            color: #222222;
        }

        /* 메인 제목 디자인입니다. */
        h1 {
            text-align: center;
            font-size: 27px;
            margin-top: 30px;
        }

        /* 소개 문장 디자인입니다. */
        .description {
            text-align: center;
            color: #666666;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* 버튼 목록을 세로로 배치합니다. */
        .place-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* 장소와 상황 버튼의 공통 디자인입니다. */
        .place-button {
            padding: 20px;
            border: 1px solid #dddddd;
            border-radius: 14px;
            background-color: white;
            font-size: 18px;
            text-align: left;
            cursor: pointer;
        }

        /* 버튼을 누르는 동안의 배경색입니다. */
        .place-button:active {
            background-color: #dce8ff;
        }

        /* 상황 목록 영역입니다. */
        #situation-section {
            max-width: 500px;
            margin: 30px auto;
        }

        /* 상황 목록 제목입니다. */
        #situation-section h2 {
            font-size: 21px;
        }

        /* 선택한 상황의 표현을 보여주는 상자입니다. */
        #sentence-box {
            background-color: white;
            border-radius: 14px;
            padding: 20px;
            margin-top: 20px;
            line-height: 1.6;
        }

        /* 한국어 문장 디자인입니다. */
        #korean {
            font-size: 20px;
            font-weight: bold;
        }

        /* 영어 번역 디자인입니다. */
        #english {
            color: #666666;
            font-size: 15px;
        }

        /* 뒤로 가기 버튼입니다. */
        .back-button {
            background-color: #e5e7eb;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
        }

        /* 상황과 문장을 숨길 때 사용하는 설정입니다. */
        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <!-- 메인 제목입니다. -->
    <h1>🇰🇷 한국 여행 도우미</h1>

    <!-- 서비스 소개 문장입니다. -->
    <p class="description">
        외국인을 위한 실생활 한국 여행 도우미
        <br>
        어디에서 도움이 필요하신가요?
    </p>

    <!-- 장소 선택 영역입니다. -->
    <div id="place-section" class="place-list">

        <!-- 카페 버튼입니다. -->
        <button class="place-button" onclick="selectPlace('카페')">
            ☕ 카페
        </button>

        <!-- 식당 버튼입니다. -->
        <button class="place-button" onclick="selectPlace('식당')">
            🍽️ 식당
        </button>

        <!-- 교통 버튼입니다. -->
        <button class="place-button" onclick="selectPlace('교통')">
            🚇 교통
        </button>

        <!-- 쇼핑 버튼입니다. -->
        <button class="place-button" onclick="selectPlace('쇼핑')">
            🛍️ 쇼핑
        </button>

        <!-- 숙소 버튼입니다. -->
        <button class="place-button" onclick="selectPlace('숙소')">
            🏨 숙소
        </button>

    </div>

    <!-- 카페 상황 선택 영역입니다. -->
    <div id="situation-section" class="hidden">

        <!-- 장소 이름을 표시합니다. -->
        <h2 id="place-title">☕ 카페</h2>

        <!-- 장소 선택 화면으로 돌아가는 버튼입니다. -->
        <button class="back-button" onclick="goBack()">
            ← 장소 선택으로 돌아가기
        </button>

        <!-- 상황 선택 제목입니다. -->
        <h3>어떤 상황인가요?</h3>

        <!-- 카페 상황 버튼 목록입니다. -->
        <div class="place-list">

            <!-- 음료 주문 상황입니다. -->
            <button class="place-button" onclick="selectSituation('order')">
                🥤 음료 주문하기
            </button>

            <!-- 사이즈 선택 상황입니다. -->
            <button class="place-button" onclick="selectSituation('size')">
                📏 사이즈 선택하기
            </button>

            <!-- 옵션 변경 상황입니다. -->
            <button class="place-button" onclick="selectSituation('option')">
                🧊 음료 옵션 변경하기
            </button>

            <!-- 결제 상황입니다. -->
            <button class="place-button" onclick="selectSituation('payment')">
                💳 결제하기
            </button>

            <!-- 포장 상황입니다. -->
            <button class="place-button" onclick="selectSituation('takeout')">
                🛍️ 포장하기
            </button>

        </div>

        <!-- 선택한 상황의 문장을 표시합니다. -->
        <div id="sentence-box" class="hidden">

            <!-- 상황의 한국어 문장입니다. -->
            <p id="korean"></p>

            <!-- 상황의 영어 번역입니다. -->
            <p id="english"></p>

        </div>
    </div>

    <script>
        // 카페에서 사용하는 상황별 문장 데이터입니다.
        const cafeData = {

            // 음료 주문 문장입니다.
            order: {
                korean: "아이스 아메리카노 하나 주세요.",
                english: "I'd like an iced Americano, please."
            },

            // 사이즈 선택 문장입니다.
            size: {
                korean: "톨 사이즈로 주세요.",
                english: "I'll have a tall size, please."
            },

            // 옵션 변경 문장입니다.
            option: {
                korean: "샷 추가해 주세요.",
                english: "Please add an extra shot."
            },

            // 결제 문장입니다.
            payment: {
                korean: "카드로 결제할게요.",
                english: "I'll pay by card."
            },

            // 포장 문장입니다.
            takeout: {
                korean: "포장해 주세요.",
                english: "Please make it to go."
            }

        };

        // 사용자가 장소를 선택하면 실행됩니다.
        function selectPlace(place) {

            // 카페를 선택한 경우입니다.
            if (place === "카페") {

                // 장소 선택 화면을 숨깁니다.
                document.getElementById("place-section").classList.add("hidden");

                // 카페 상황 선택 화면을 보여줍니다.
                document.getElementById("situation-section").classList.remove("hidden");

                // 화면 제목을 카페로 설정합니다.
                document.getElementById("place-title").textContent = "☕ 카페";

            } else {

                // 아직 준비하지 않은 장소를 안내합니다.
                alert(place + " 기능은 준비 중입니다.");

            }
        }

        // 사용자가 카페 상황을 선택하면 실행됩니다.
        function selectSituation(situation) {

            // 선택한 상황에 해당하는 데이터를 찾습니다.
            const data = cafeData[situation];

            // 한국어 문장을 화면에 표시합니다.
            document.getElementById("korean").textContent = data.korean;

            // 영어 번역을 화면에 표시합니다.
            document.getElementById("english").textContent = data.english;

            // 문장 상자를 보여줍니다.
            document.getElementById("sentence-box").classList.remove("hidden");

        }

        // 장소 선택 화면으로 돌아가는 함수입니다.
        function goBack() {

            // 카페 상황 화면을 숨깁니다.
            document.getElementById("situation-section").classList.add("hidden");

            // 장소 선택 화면을 다시 보여줍니다.
            document.getElementById("place-section").classList.remove("hidden");

            // 이전에 선택한 문장도 숨깁니다.
            document.getElementById("sentence-box").classList.add("hidden");

        }
    </script>
</body>
</html>
