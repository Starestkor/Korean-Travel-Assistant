
<!DOCTYPE html>
<!-- HTML 문서의 시작을 선언합니다. -->
<html lang="ko">
<!-- 문서의 기본 언어를 한국어로 설정합니다. -->

<head>
    <!-- 브라우저 설정 영역을 시작합니다. -->
    <meta charset="UTF-8">
    <!-- 한글 인코딩을 설정합니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 모바일 화면에 맞춥니다. -->
    <title>Korean Travel Assistant</title>
    <!-- 브라우저 탭 제목입니다. -->

    <style>
        /* 모든 요소의 크기 계산 방식을 통일합니다. */
        * {
            box-sizing: border-box;
        }

        /* 페이지 전체의 디자인입니다. */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f5f8;
            color: #222222;
        }

        /* 페이지 제목 디자인입니다. */
        h1 {
            text-align: center;
            font-size: 25px;
        }

        /* 페이지 소개 문장입니다. */
        .description {
            text-align: center;
            color: #666666;
            margin-bottom: 25px;
        }

        /* 화면의 주요 내용 영역입니다. */
        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* 버튼의 공통 디자인입니다. */
        button {
            cursor: pointer;
            font-size: 16px;
        }

        /* 장소 및 상황 선택 버튼입니다. */
        .menu-button {
            width: 100%;
            padding: 18px;
            margin-bottom: 12px;
            background-color: white;
            border: 1px solid #dddddd;
            border-radius: 12px;
            text-align: left;
        }

        /* 대화 화면의 상자입니다. */
        .chat-box {
            background-color: white;
            border-radius: 14px;
            padding: 18px;
            margin-top: 20px;
        }

        /* 직원과 손님의 대화 공통 디자인입니다. */
        .message {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 14px;
            line-height: 1.6;
        }

        /* 직원의 대화 디자인입니다. */
        .staff {
            background-color: #edf1f8;
            margin-right: 35px;
        }

        /* 손님의 대화 디자인입니다. */
        .user {
            background-color: #e2f4e9;
            margin-left: 35px;
        }

        /* 대화하는 사람의 이름입니다. */
        .speaker {
            font-size: 12px;
            font-weight: bold;
            color: #555555;
            margin-bottom: 6px;
        }

        /* 선택지 영역입니다. */
        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        /* 각각의 선택지 버튼입니다. */
        .choice-button {
            padding: 14px;
            background-color: white;
            border: 1px solid #4778c7;
            border-radius: 10px;
            text-align: left;
        }

        /* 선택지 버튼을 눌렀을 때입니다. */
        .choice-button:active {
            background-color: #dce8ff;
        }

        /* 다시 시작하는 버튼입니다. */
        .restart-button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background-color: #263b60;
            color: white;
            border: none;
            border-radius: 10px;
        }

        /* 화면을 숨기는 설정입니다. */
        .hidden {
            display: none;
        }

        /* 번역 문장 디자인입니다. */
        .translation {
            color: #666666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <!-- 메인 제목입니다. -->
    <h1>🇰🇷 한국 여행 도우미</h1>

    <!-- 서비스 소개 문장입니다. -->
    <p class="description">
        외국인을 위한 실생활 한국어 도우미
    </p>

    <!-- 모든 화면을 담는 영역입니다. -->
    <div class="container">

        <!-- 첫 번째 장소 선택 화면입니다. -->
        <div id="place-screen">

            <!-- 장소 선택 안내입니다. -->
            <h2>어디에 계신가요?</h2>

            <!-- 카페 선택 버튼입니다. -->
            <button class="menu-button" onclick="openCafe()">
                ☕ 카페
            </button>

            <!-- 아직 준비 중인 장소입니다. -->
            <button class="menu-button" onclick="showComingSoon('식당')">
                🍽️ 식당
            </button>

            <!-- 아직 준비 중인 장소입니다. -->
            <button class="menu-button" onclick="showComingSoon('교통')">
                🚇 교통
            </button>

            <!-- 아직 준비 중인 장소입니다. -->
            <button class="menu-button" onclick="showComingSoon('쇼핑')">
                🛍️ 쇼핑
            </button>

            <!-- 아직 준비 중인 장소입니다. -->
            <button class="menu-button" onclick="showComingSoon('숙소')">
                🏨 숙소
            </button>

        </div>

        <!-- 카페 상황 선택 화면입니다. -->
        <div id="cafe-screen" class="hidden">

            <!-- 카페 화면 제목입니다. -->
            <h2>☕ 카페</h2>

            <!-- 음료 주문 상황 선택 버튼입니다. -->
            <button class="menu-button" onclick="startConversation()">
                🥤 음료 주문하기
            </button>

            <!-- 장소 선택 화면으로 돌아갑니다. -->
            <button class="restart-button" onclick="goHome()">
                ← 장소 선택으로 돌아가기
            </button>

        </div>

        <!-- 실제 대화가 표시되는 화면입니다. -->
        <div id="chat-screen" class="hidden">

            <!-- 대화 화면의 제목입니다. -->
            <h2>카페에서 주문하기</h2>

            <!-- 대화 메시지가 표시되는 영역입니다. -->
            <div id="chat-box" class="chat-box"></div>

            <!-- 사용자가 선택할 답변 목록입니다. -->
            <div id="choices" class="choices"></div>

            <!-- 처음부터 다시 시작하는 버튼입니다. -->
            <button class="restart-button" onclick="startConversation()">
                ↻ 처음부터 다시 시작
            </button>

            <!-- 카페 상황 선택으로 돌아가는 버튼입니다. -->
            <button class="menu-button" onclick="openCafe()">
                ← 카페 상황으로 돌아가기
            </button>

        </div>

    </div>

    <script>
        // 카페 대화의 모든 단계를 저장하는 데이터입니다.
        const conversation = {

            // 첫 번째 대화 단계입니다.
            start: {
                speaker: "staff",
                korean: "어서 오세요. 주문하시겠어요?",
                english: "Hello! Are you ready to order?",
                choices: [
                    {
                        text: "아이스 아메리카노 하나 주세요.",
                        next: "americano"
                    },
                    {
                        text: "따뜻한 라테 하나 주세요.",
                        next: "latte"
                    }
                ]
            },

            // 아이스 아메리카노를 선택했을 때입니다.
            americano: {
                speaker: "user",
                korean: "아이스 아메리카노 하나 주세요.",
                english: "I'd like an iced Americano, please.",
                next: "size"
            },

            // 따뜻한 라테를 선택했을 때입니다.
            latte: {
                speaker: "user",
                korean: "따뜻한 라테 하나 주세요.",
                english: "I'd like a hot latte, please.",
                next: "size"
            },

            // 사이즈를 물어보는 단계입니다.
            size: {
                speaker: "staff",
                korean: "사이즈는 어떻게 드릴까요?",
                english: "What size would you like?",
                choices: [
                    {
                        text: "톨 사이즈요.",
                        next: "tall"
                    },
                    {
                        text: "그란데 사이즈요.",
                        next: "grande"
                    },
                    {
                        text: "벤티 사이즈요.",
                        next: "venti"
                    }
                ]
            },

            // 톨 사이즈를 선택한 경우입니다.
            tall: {
                speaker: "user",
                korean: "톨 사이즈요.",
                english: "Tall size, please.",
                next: "takeout"
            },

            // 그란데 사이즈를 선택한 경우입니다.
            grande: {
                speaker: "user",
                korean: "그란데 사이즈요.",
                english: "Grande size, please.",
                next: "takeout"
            },

            // 벤티 사이즈를 선택한 경우입니다.
            venti: {
                speaker: "user",
                korean: "벤티 사이즈요.",
                english: "Venti size, please.",
                next: "takeout"
            },

            // 매장 이용 여부를 물어보는 단계입니다.
            takeout: {
                speaker: "staff",
                korean: "드시고 가시나요? 포장하시나요?",
                english: "For here or to go?",
                choices: [
                    {
                        text: "먹고 갈게요.",
                        next: "here"
                    },
                    {
                        text: "포장해 주세요.",
                        next: "togo"
                    }
                ]
            },

            // 매장에서 마시는 경우입니다.
            here: {
                speaker: "user",
                korean: "먹고 갈게요.",
                english: "For here, please.",
                next: "payment"
            },

            // 포장하는 경우입니다.
            togo: {
                speaker: "user",
                korean: "포장해 주세요.",
                english: "To go, please.",
                next: "payment"
            },

            // 결제 단계입니다.
            payment: {
                speaker: "staff",
                korean: "결제 도와드리겠습니다. 카드 주시겠어요?",
                english: "Let's proceed with payment. May I have your card?",
                choices: [
                    {
                        text: "네, 여기 있습니다.",
                        next: "finish"
                    }
                ]
            },

            // 마지막 단계입니다.
            finish: {
                speaker: "user",
                korean: "네, 여기 있습니다.",
                english: "Sure, here it is.",
                end: true
            }
        };

        // 현재 대화 단계를 저장하는 변수입니다.
        let currentStep = "start";

        // 화면에서 특정 영역을 숨기는 함수입니다.
        function hideAllScreens() {

            // 장소 선택 화면을 숨깁니다.
            document.getElementById("place-screen").classList.add("hidden");

            // 카페 선택 화면을 숨깁니다.
            document.getElementById("cafe-screen").classList.add("hidden");

            // 대화 화면을 숨깁니다.
            document.getElementById("chat-screen").classList.add("hidden");
        }

        // 카페를 선택했을 때 실행됩니다.
        function openCafe() {

            // 모든 화면을 먼저 숨깁니다.
            hideAllScreens();

            // 카페 화면을 보여줍니다.
            document.getElementById("cafe-screen").classList.remove("hidden");
        }

        // 준비 중인 장소를 선택했을 때 실행됩니다.
        function showComingSoon(place) {

            // 준비 중이라는 안내를 표시합니다.
            alert(place + " 기능은 준비 중입니다.");
        }

        // 처음 장소 선택 화면으로 돌아갑니다.
        function goHome() {

            // 모든 화면을 숨깁니다.
            hideAllScreens();

            // 장소 선택 화면을 보여줍니다.
            document.getElementById("place-screen").classList.remove("hidden");
        }

        // 새로운 대화를 시작하는 함수입니다.
        function startConversation() {

            // 대화 시작 단계를 설정합니다.
            currentStep = "start";

            // 이전 대화 내용을 지웁니다.
            document.getElementById("chat-box").innerHTML = "";

            // 모든 화면을 숨깁니다.
            hideAllScreens();

            // 대화 화면을 보여줍니다.
            document.getElementById("chat-screen").classList.remove("hidden");

            // 첫 번째 대화를 표시합니다.
            showStep(currentStep);
        }

        // 특정 대화 단계를 화면에 표시하는 함수입니다.
        function showStep(stepId) {

            // 현재 단계의 데이터를 가져옵니다.
            const step = conversation[stepId];

            // 현재 단계를 저장합니다.
            currentStep = stepId;

            // 대화 메시지가 표시될 영역을 가져옵니다.
            const chatBox = document.getElementById("chat-box");

            // 새로운 메시지를 담을 요소를 만듭니다.
            const message = document.createElement("div");

            // 직원인지 손님인지에 따라 디자인을 정합니다.
            message.className = "message " + step.speaker;

            // 직원 또는 손님의 이름을 표시합니다.
            const speakerName = step.speaker === "staff" ? "직원 STAFF" : "손님 YOU";

            // 메시지 안에 이름과 한국어 문장을 넣습니다.
            message.innerHTML =
                '<div class="speaker">' + speakerName + '</div>' +
                '<div>' + step.korean + '</div>' +
                '<div class="translation">' + step.english + '</div>';

            // 대화창에 새 메시지를 추가합니다.
            chatBox.appendChild(message);

            // 최신 대화가 보이도록 화면을 아래로 이동합니다.
            message.scrollIntoView({ behavior: "smooth", block: "nearest" });

            // 선택지 영역을 가져옵니다.
            const choicesBox = document.getElementById("choices");

            // 이전 선택지를 지웁니다.
            choicesBox.innerHTML = "";

            // 선택지가 있는 경우입니다.
            if (step.choices) {

                // 모든 선택지를 하나씩 확인합니다.
                step.choices.forEach(function(choice) {

                    // 선택지 버튼을 만듭니다.
                    const button = document.createElement("button");

                    // 버튼에 디자인을 적용합니다.
                    button.className = "choice-button";

                    // 버튼에 선택할 문장을 표시합니다.
                    button.textContent = choice.text;

                    // 버튼을 누르면 다음 대화로 이동합니다.
                    button.onclick = function() {
                        showStep(choice.next);
                    };

                    // 선택지 영역에 버튼을 추가합니다.
                    choicesBox.appendChild(button);
                });

            } else if (step.next) {

                // 다음 단계가 있는 경우 자동으로 이동하는 버튼을 만듭니다.
                const button = document.createElement("button");

                // 버튼 디자인을 설정합니다.
                button.className = "choice-button";

                // 다음 대화로 이동하는 문구를 표시합니다.
                button.textContent = "다음 대화 보기";

                // 버튼을 누르면 다음 단계를 표시합니다.
                button.onclick = function() {
                    showStep(step.next);
                };

                // 선택지 영역에 버튼을 추가합니다.
                choicesBox.appendChild(button);

            } else if (step.end) {

                // 대화가 끝났을 때 완료 문구를 표시합니다.
                choicesBox.textContent = "주문이 완료되었습니다! 감사합니다.";
            }
        }
    </script>
</body>
<!-- 화면에 표시되는 내용이 끝났습니다. -->

</html>
<!-- HTML 문서가 끝났습니다. -->
